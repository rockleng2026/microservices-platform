server:
  port: 8083
  
spring:
  application:
    name: organization-service
  
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/central_organization?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: lengfeng847
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: microservices-platform
      config:
        server-addr: 127.0.0.1:8848
        namespace: microservices-platform
        file-extension: yml
        shared-configs:
          - data-id: common.yml
            refresh: true
            
  redis:
    host: 127.0.0.1
    port: 6379
    password: 
    database: 0
    timeout: 30000
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.central.organization.model
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    lazy-loading-enabled: true
    multiple-result-sets-enabled: true
    use-column-label: true
    use-generated-keys: true
    default-executor-type: reuse
    default-statement-timeout: 25000
  global-config:
    db-config:
      id-type: auto
      field-strategy: not_empty
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.central.organization.mapper: debug
    root: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/organization-service.log

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# 租户配置
tenant:
  enable: true
  default-tenant-id: default
  
# 文件上传配置  
file:
  upload:
    path: /data/uploads/organization/
    max-size: 10MB
    allowed-types: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx 