<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户交接 - Portal 3.0</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .transfer-tabs {
            display: flex;
            background: white;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .tab-item {
            flex: 1;
            padding: 16px 24px;
            text-align: center;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .tab-item.active {
            background: var(--primary-color);
            color: white;
            border-bottom-color: #fff;
        }
        
        .tab-item:hover:not(.active) {
            background: #f0f0f0;
        }
        
        .transfer-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .transfer-form {
            display: grid;
            gap: 20px;
            max-width: 600px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .form-group-full {
            grid-column: 1 / -1;
        }
        
        .transfer-item {
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            transition: border-color 0.3s;
        }
        
        .transfer-item:hover {
            border-color: var(--primary-color);
        }
        
        .transfer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .transfer-info h4 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 500;
        }
        
        .transfer-info p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }
        
        .transfer-status {
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-pending { background: #fff2e8; color: #fa8c16; }
        .status-approved { background: #f6ffed; color: #52c41a; }
        .status-rejected { background: #fff1f0; color: #f5222d; }
        .status-completed { background: #e6f7ff; color: #1890ff; }
        
        .transfer-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }
        
        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .detail-label {
            color: #666;
            font-size: 14px;
        }
        
        .detail-value {
            font-weight: 500;
            font-size: 14px;
        }
        
        .transfer-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        .approval-history {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
        }
        
        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }
        
        .history-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }
        
        .history-pending .history-icon { background: #fa8c16; }
        .history-approved .history-icon { background: #52c41a; }
        .history-rejected .history-icon { background: #f5222d; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-number {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
        }
        
        .customer-select-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
        }
        
        .customer-select-item {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .customer-select-item:hover {
            background: #f9f9f9;
        }
        
        .customer-select-item.selected {
            background: #e6f7ff;
            border-left: 3px solid var(--primary-color);
        }
        
        .customer-select-item:last-child {
            border-bottom: none;
        }
        
        .customer-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        
        .customer-item-name {
            font-weight: 500;
            font-size: 14px;
        }
        
        .customer-item-status {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
        }
        
        .customer-item-info {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Portal 3.0</h2>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-title">组织架构</div>
                    <a href="../organization/department-tree.html" class="nav-link">
                        <i class="fas fa-sitemap"></i> 部门管理
                    </a>
                    <a href="../organization/employee-list.html" class="nav-link">
                        <i class="fas fa-users"></i> 员工管理
                    </a>
                </div>
                <div class="nav-section">
                    <div class="nav-title">客户管理</div>
                    <a href="customer-dashboard.html" class="nav-link">
                        <i class="fas fa-chart-pie"></i> CRM工作台
                    </a>
                    <a href="customer-list.html" class="nav-link">
                        <i class="fas fa-address-book"></i> 客户列表
                    </a>
                    <a href="customer-detail.html" class="nav-link">
                        <i class="fas fa-user-circle"></i> 客户详情
                    </a>
                    <a href="follow-record.html" class="nav-link">
                        <i class="fas fa-clipboard-list"></i> 跟进记录
                    </a>
                    <a href="customer-transfer.html" class="nav-link active">
                        <i class="fas fa-exchange-alt"></i> 客户交接
                    </a>
                </div>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部导航 -->
            <header class="main-header">
                <div class="header-left">
                    <button class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="breadcrumb">
                        <span>客户管理</span>
                        <i class="fas fa-chevron-right"></i>
                        <span>客户交接</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="搜索交接记录...">
                    </div>
                    <div class="user-menu">
                        <img src="https://via.placeholder.com/32" alt="用户头像" class="user-avatar">
                        <span>管理员</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </header>

            <!-- 页面内容 -->
            <div class="page-content">
                <div class="page-header">
                    <h1>客户交接</h1>
                    <p>管理客户交接申请和审批流程</p>
                </div>
                
                <!-- 统计卡片 -->
                <div class="stats-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;">
                    <div class="stat-card" style="background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center;">
                        <div class="stat-number" style="color: #fa8c16; font-size: 20px; font-weight: bold; margin-bottom: 4px;" id="pendingCount">3</div>
                        <div class="stat-label" style="font-size: 12px; color: #666;">待审批</div>
                    </div>
                    <div class="stat-card" style="background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center;">
                        <div class="stat-number" style="color: #52c41a; font-size: 20px; font-weight: bold; margin-bottom: 4px;" id="approvedCount">15</div>
                        <div class="stat-label" style="font-size: 12px; color: #666;">已批准</div>
                    </div>
                    <div class="stat-card" style="background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center;">
                        <div class="stat-number" style="color: #f5222d; font-size: 20px; font-weight: bold; margin-bottom: 4px;" id="rejectedCount">2</div>
                        <div class="stat-label" style="font-size: 12px; color: #666;">已拒绝</div>
                    </div>
                    <div class="stat-card" style="background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center;">
                        <div class="stat-number" style="color: #1890ff; font-size: 20px; font-weight: bold; margin-bottom: 4px;" id="completedCount">28</div>
                        <div class="stat-label" style="font-size: 12px; color: #666;">已完成</div>
                    </div>
                </div>

                <!-- 选项卡导航 -->
                <div class="transfer-tabs" style="display: flex; background: white; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden;">
                    <div class="tab-item active" onclick="switchTab('apply')" id="tab-apply" style="flex: 1; padding: 16px 24px; text-align: center; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.3s; background: var(--primary-color); color: white; border-bottom-color: #fff;">
                        <i class="fas fa-plus-circle"></i> 申请交接
                    </div>
                    <div class="tab-item" onclick="switchTab('pending')" id="tab-pending" style="flex: 1; padding: 16px 24px; text-align: center; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.3s;">
                        <i class="fas fa-clock"></i> 待我审批
                    </div>
                    <div class="tab-item" onclick="switchTab('history')" id="tab-history" style="flex: 1; padding: 16px 24px; text-align: center; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.3s;">
                        <i class="fas fa-history"></i> 交接记录
                    </div>
                </div>

                <!-- 申请交接内容 -->
                <div class="transfer-content" id="content-apply" style="background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <h3>申请客户交接</h3>
                    <div style="max-width: 600px;">
                        <div style="margin-bottom: 20px;">
                            <label style="display: block; margin-bottom: 4px; font-weight: 500; color: var(--text-color); font-size: 14px;">选择客户 <span style="color: red;">*</span></label>
                            <select class="form-input" style="width: 100%;">
                                <option value="">请选择要交接的客户</option>
                                <option value="1">张三 (阿里云科技)</option>
                                <option value="2">李四 (腾讯云服务)</option>
                                <option value="3">王五 (百度智能云)</option>
                            </select>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                            <div>
                                <label style="display: block; margin-bottom: 4px; font-weight: 500; color: var(--text-color); font-size: 14px;">接收人 <span style="color: red;">*</span></label>
                                <select class="form-input">
                                    <option value="">请选择接收人</option>
                                    <option value="2">李四</option>
                                    <option value="3">王五</option>
                                    <option value="4">赵六</option>
                                </select>
                            </div>
                            <div>
                                <label style="display: block; margin-bottom: 4px; font-weight: 500; color: var(--text-color); font-size: 14px;">交接类型 <span style="color: red;">*</span></label>
                                <select class="form-input">
                                    <option value="temporary">临时交接</option>
                                    <option value="permanent">永久交接</option>
                                    <option value="collaborative">协作交接</option>
                                </select>
                            </div>
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <label style="display: block; margin-bottom: 4px; font-weight: 500; color: var(--text-color); font-size: 14px;">交接原因 <span style="color: red;">*</span></label>
                            <textarea class="form-input" rows="4" placeholder="请详细说明交接原因，以便审批人员了解情况"></textarea>
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <label style="display: block; margin-bottom: 4px; font-weight: 500; color: var(--text-color); font-size: 14px;">客户情况说明</label>
                            <textarea class="form-input" rows="3" placeholder="请简要说明客户当前状态、需求特点、注意事项等"></textarea>
                        </div>
                        
                        <div>
                            <button class="btn btn-primary" onclick="submitTransfer()">
                                <i class="fas fa-paper-plane"></i> 提交申请
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 待审批内容 -->
                <div class="transfer-content" id="content-pending" style="display: none; background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <h3>待我审批的交接申请</h3>
                    <div style="text-align: center; padding: 40px; color: #999;">
                        <i class="fas fa-inbox" style="font-size: 32px; margin-bottom: 16px; opacity: 0.5;"></i>
                        <p>暂无待审批的交接申请</p>
                    </div>
                </div>

                <!-- 交接记录内容 -->
                <div class="transfer-content" id="content-history" style="display: none; background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <h3>交接历史记录</h3>
                    <div style="margin-bottom: 16px;">
                        <select class="form-input" style="width: 200px; display: inline-block; margin-right: 16px;">
                            <option value="">全部状态</option>
                            <option value="pending">待审批</option>
                            <option value="approved">已批准</option>
                            <option value="rejected">已拒绝</option>
                            <option value="completed">已完成</option>
                        </select>
                        <button class="btn btn-primary">
                            <i class="fas fa-search"></i> 查询
                        </button>
                    </div>
                    <div style="text-align: center; padding: 40px; color: #999;">
                        <i class="fas fa-history" style="font-size: 32px; margin-bottom: 16px; opacity: 0.5;"></i>
                        <p>暂无交接记录</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/common.js"></script>
    <script>
        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializePage();
        });

        // 切换选项卡
        function switchTab(tabName) {
            // 隐藏所有内容
            document.querySelectorAll('.transfer-content').forEach(content => {
                content.style.display = 'none';
            });
            
            // 移除所有激活状态
            document.querySelectorAll('.tab-item').forEach(tab => {
                tab.style.background = 'white';
                tab.style.color = 'var(--text-color)';
                tab.style.borderBottomColor = 'transparent';
            });
            
            // 显示对应内容
            document.getElementById('content-' + tabName).style.display = 'block';
            
            // 激活对应选项卡
            const activeTab = document.getElementById('tab-' + tabName);
            activeTab.style.background = 'var(--primary-color)';
            activeTab.style.color = 'white';
            activeTab.style.borderBottomColor = '#fff';
        }

        // 提交交接申请
        function submitTransfer() {
            // 简单表单验证
            const form = event.target.closest('.transfer-content');
            const selects = form.querySelectorAll('select');
            const textareas = form.querySelectorAll('textarea');
            
            let isValid = true;
            
            // 检查必填字段
            selects.forEach((select, index) => {
                if (index < 2 && !select.value) { // 前两个select是必填的
                    select.style.borderColor = '#f5222d';
                    isValid = false;
                } else {
                    select.style.borderColor = '#d9d9d9';
                }
            });
            
            if (!textareas[0].value.trim()) { // 交接原因是必填的
                textareas[0].style.borderColor = '#f5222d';
                isValid = false;
            } else {
                textareas[0].style.borderColor = '#d9d9d9';
            }
            
            if (!isValid) {
                showMessage('请填写所有必填字段', 'error');
                return;
            }
            
            // 模拟提交
            showMessage('交接申请提交成功，等待审批', 'success');
            
            // 清空表单
            form.querySelectorAll('select').forEach(select => select.selectedIndex = 0);
            form.querySelectorAll('textarea').forEach(textarea => textarea.value = '');
        }
    </script>
</body>
</html>
