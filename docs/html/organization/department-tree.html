<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部门管理 - Portal 3.0</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
        .department-layout {
            display: flex;
            gap: 24px;
            height: calc(100vh - var(--header-height) - 48px);
        }
        
        .department-tree-panel {
            flex: 0 0 400px;
            min-width: 350px;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            display: flex;
            flex-direction: column;
        }
        
        .department-info-panel {
            flex: 1;
            min-width: 0;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            display: flex;
            flex-direction: column;
        }
        
        .panel-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .panel-title {
            font-size: 16px;
            font-weight: 500;
            margin: 0;
        }
        
        .panel-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .tree-search {
            margin-bottom: 16px;
        }
        
        .tree-container {
            flex: 1;
            overflow-y: auto;
        }
        
        .tree-node {
            margin-bottom: 4px;
        }
        
        .tree-node-content {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        
        .tree-node-content:hover {
            background: #f0f2f5;
        }
        
        .tree-node-content.active {
            background: #e6f7ff;
            border: 1px solid var(--primary-color);
        }
        
        .tree-node-content.dragging {
            opacity: 0.5;
            background: #fff2e8;
        }
        
        .tree-expand {
            width: 16px;
            height: 16px;
            margin-right: 4px;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
        }
        
        .tree-expand:hover {
            background: var(--border-color);
        }
        
        .tree-expand::before {
            content: '▶';
            font-size: 10px;
            transition: transform 0.3s;
        }
        
        .tree-expand.expanded::before {
            transform: rotate(90deg);
        }
        
        .tree-expand.empty {
            visibility: hidden;
        }
        
        .tree-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            background: var(--primary-color);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
        }
        
        .tree-label {
            flex: 1;
            font-size: 14px;
        }
        
        .tree-badge {
            background: var(--background-color);
            color: var(--text-color-secondary);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 8px;
        }
        
        .tree-actions {
            opacity: 0;
            transition: opacity 0.3s;
            margin-left: 8px;
        }
        
        .tree-node-content:hover .tree-actions {
            opacity: 1;
        }
        
        .tree-action-btn {
            width: 20px;
            height: 20px;
            border: none;
            background: none;
            border-radius: 2px;
            cursor: pointer;
            margin-left: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .tree-action-btn:hover {
            background: var(--border-color);
        }
        
        .tree-children {
            margin-left: 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .tree-children.expanded {
            max-height: 1000px;
        }
        
        .dept-form {
            display: grid;
            gap: 16px;
        }
        
        .form-section {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 16px;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 12px;
            color: var(--text-color);
        }
        
        .dept-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: var(--background-color);
            padding: 16px;
            border-radius: 4px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--text-color-secondary);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-color-secondary);
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }
        
        .drag-indicator {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary-color);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .drag-indicator.active {
            opacity: 1;
        }
        
        .level-indicator {
            position: absolute;
            left: 4px;
            top: 4px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--success-color);
        }
        
        .level-1 .level-indicator { background: #f5222d; }
        .level-2 .level-indicator { background: #fa541c; }
        .level-3 .level-indicator { background: #faad14; }
        .level-4 .level-indicator { background: #52c41a; }
        .level-5 .level-indicator { background: #13c2c2; }
        .level-6 .level-indicator { background: #1890ff; }
        .level-7 .level-indicator { background: #722ed1; }
        
        @media (max-width: 768px) {
            .department-layout {
                flex-direction: column;
                height: auto;
            }
            
            .department-tree-panel {
                width: 100%;
                margin-bottom: 16px;
            }
            
            .dept-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="layout-container">
        <!-- 侧边栏 -->
        <div class="layout-sidebar">
            <div class="logo">
                <span>Portal 3.0</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="../index.html" class="nav-link">
                        <i>🏠</i> 首页总览
                    </a>
                </li>
                <li class="nav-item has-submenu active">
                    <a href="#" class="nav-link">
                        <i>📋</i> 组织架构
                    </a>
                    <ul class="submenu open">
                        <li><a href="department-tree.html" class="nav-link active">部门管理</a></li>
                        <li><a href="employee-list.html" class="nav-link">员工管理</a></li>
                        <li><a href="position-manage.html" class="nav-link">岗位管理</a></li>
                        <li><a href="role-permission.html" class="nav-link">角色权限</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a href="../crm/customer-dashboard.html" class="nav-link">
                        <i>🤝</i> 客户管理
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../product/category-manage.html" class="nav-link">
                        <i>📦</i> 商品管理
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../order/order-dashboard.html" class="nav-link">

                    </a>
                </li>

                    <a href="../support/ticket-dashboard.html" class="nav-link">

                    </a>

        <!-- 头部 -->
        <div class="layout-header">
            <div class="breadcrumb">
                <span class="breadcrumb-item">组织架构</span>
                <span class="breadcrumb-item active">部门管理</span>
            </div>
            <div class="header-actions">
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="搜索功能...">
                    <i class="search-icon">🔍</i>
                </div>
                <div class="user-info">
                    <div class="avatar">张</div>
                    <span>张总</span>
                </div>
            </div>

        <!-- 主内容区 -->
        <div class="layout-content">
            <!-- 页面标题 -->
            <div class="page-header">
                <h1 class="page-title">部门管理</h1>
                <p class="page-description">管理公司组织架构，支持7级部门层级，拖拽调整部门关系</p>
            </div>

            <!-- 工具栏 -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <button class="btn btn-primary" onclick="addDepartment()">
                        <i>➕</i> 新增部门

                    <button class="btn" onclick="expandAll()">

                        <i>📂</i> 收起全部

                <div class="toolbar-right">
                    <button class="btn" onclick="exportDepartments()">
                        <i>📤</i> 导出
                    </button>
                    <button class="btn" onclick="refreshDepartments()">
                        <i>🔄</i> 刷新
                    </button>
                </div>

            <!-- 主要内容 -->
            <div class="department-layout">
                <!-- 部门树面板 -->
                <div class="department-tree-panel">
                    <div class="panel-header">
                        <h3 class="panel-title">部门树</h3>
                        <span class="status-tag success">共9个部门</span>
                    </div>
                    <div class="panel-body">
                        <div class="tree-search">
                            <input type="text" class="form-control" placeholder="搜索部门..." onInput="searchDepartments(this.value)">
                        </div>
                        <div class="tree-container" id="departmentTree">
                            <!-- 部门树将通过JavaScript生成 -->
                        </div>

                <!-- 部门信息面板 -->
                <div class="department-info-panel">
                    <div class="panel-header">
                        <h3 class="panel-title">部门详情</h3>

                            <button class="btn btn-sm" onclick="editDepartment()" id="editBtn" style="display: none;">
                                <i>✏️</i> 编辑
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteDepartment()" id="deleteBtn" style="display: none;">

                            </button>

                    </div>
                    <div class="panel-body">
                        <div id="departmentDetail">
                            <div class="empty-state">
                                <div class="empty-icon">🏢</div>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/mock-data.js"></script>
    <script>
        let currentDepartment = null;
        let departments = [];
        let employees = [];

        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            renderDepartmentTree();
        });

        // 加载数据
        function loadData() {
            departments = Portal.Utils.deepClone(MockData.departments);
            employees = Portal.Utils.deepClone(MockData.employees);
        }

        // 渲染部门树
        function renderDepartmentTree() {
            const treeContainer = document.getElementById('departmentTree');
            const rootDepartments = departments.filter(dept => dept.parentId === 0);
            
            treeContainer.innerHTML = '';
            rootDepartments.forEach(dept => {
                treeContainer.appendChild(createTreeNode(dept, 1));
            });
        }

        // 创建树节点
        function createTreeNode(department, level) {
            const children = departments.filter(dept => dept.parentId === department.id);
            const empCount = employees.filter(emp => emp.department === department.id).length;
            
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'tree-node';
            nodeDiv.setAttribute('data-dept-id', department.id);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = `tree-node-content level-${level}`;
            contentDiv.draggable = true;
            contentDiv.onclick = () => selectDepartment(department);
            
            // 拖拽事件
            contentDiv.ondragstart = (e) => handleDragStart(e, department);
            contentDiv.ondragover = (e) => handleDragOver(e);
            contentDiv.ondrop = (e) => handleDrop(e, department);
            
            contentDiv.innerHTML = `
                <div class="level-indicator"></div>
                <button class="tree-expand ${children.length === 0 ? 'empty' : ''}" 
                        onclick="toggleExpand(event, this)">
                </button>
                <div class="tree-icon">${getDepIcon(department)}</div>
                <span class="tree-label">${department.name}</span>
                <span class="tree-badge">${empCount}人</span>
                <div class="tree-actions">
                    <button class="tree-action-btn" onclick="addSubDepartment(event, ${department.id})" title="添加子部门">
                        ➕
                    </button>
                    <button class="tree-action-btn" onclick="editDepartment(event, ${department.id})" title="编辑">
                        ✏️
                    </button>
                    <button class="tree-action-btn" onclick="deleteDepartment(event, ${department.id})" title="删除">
                        🗑️
                    </button>
                </div>
                <div class="drag-indicator"></div>
            `;
            
            nodeDiv.appendChild(contentDiv);
            
            // 添加子节点
            if (children.length > 0) {
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'tree-children';
                
                children.forEach(child => {
                    childrenDiv.appendChild(createTreeNode(child, level + 1));
                });
                
                nodeDiv.appendChild(childrenDiv);
            }
            
            return nodeDiv;
        }

        // 获取部门图标
        function getDepIcon(department) {
            if (department.fiiale === '1') return '🏢'; // 分公司
            switch (department.gradeid) {
                case 1: return '👑'; // 总经理
                case 2: return '🏛️'; // 部门
                case 3: return '👥'; // 团队
                default: return '📋'; // 其他
            }
        }

        // 选择部门
        function selectDepartment(department) {
            // 清除之前的选中状态
            document.querySelectorAll('.tree-node-content.active').forEach(el => {
                el.classList.remove('active');
            });
            
            // 设置当前选中
            event.currentTarget.classList.add('active');
            currentDepartment = department;
            
            // 显示部门详情
            showDepartmentDetail(department);
            
            // 显示操作按钮
            document.getElementById('editBtn').style.display = 'inline-block';
            document.getElementById('deleteBtn').style.display = 'inline-block';
        }

        // 显示部门详情
        function showDepartmentDetail(department) {
            const detailContainer = document.getElementById('departmentDetail');
            const deptEmployees = employees.filter(emp => emp.department === department.id);
            const children = departments.filter(dept => dept.parentId === department.id);
            const director = employees.find(emp => emp.id === department.directorId);
            
            detailContainer.innerHTML = `
                <div class="dept-stats">
                    <div class="stat-card">
                        <div class="stat-value">${deptEmployees.length}</div>
                        <div class="stat-label">员工人数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${children.length}</div>
                        <div class="stat-label">子部门</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${department.gradeid}</div>
                        <div class="stat-label">部门等级</div>
                    </div>
                </div>
                
                <form class="dept-form">
                    <div class="form-section">
                        <div class="section-title">基本信息</div>
                        <div class="form-row">
                            <div class="form-col">
                                <label class="form-label">部门名称</label>
                                <input type="text" class="form-control" value="${department.name}" readonly>
                            </div>
                            <div class="form-col">
                                <label class="form-label">部门编号</label>
                                <input type="text" class="form-control" value="${department.depNo || ''}" readonly>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-col">
                                <label class="form-label">部门等级</label>
                                <input type="text" class="form-control" value="第${department.gradeid}级" readonly>
                            </div>
                            <div class="form-col">
                                <label class="form-label">部门类型</label>
                                <input type="text" class="form-control" value="${department.fiiale === '1' ? '分公司' : '普通部门'}" readonly>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">部门主管</label>
                            <input type="text" class="form-control" value="${director ? director.name : '未设置'}" readonly>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <div class="section-title">部门员工 (${deptEmployees.length}人)</div>
                        <div style="max-height: 200px; overflow-y: auto;">
                            ${deptEmployees.length === 0 ? 
                                '<p style="text-align: center; color: #999; padding: 20px;">暂无员工</p>' :
                                deptEmployees.map(emp => `
                                    <div style="display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0;">
                                        <div style="width: 32px; height: 32px; border-radius: 50%; background: #1890ff; color: white; display: flex; align-items: center; justify-content: center; margin-right: 12px; font-size: 12px;">
                                            ${emp.name.charAt(0)}
                                        </div>
                                        <div style="flex: 1;">
                                            <div style="font-weight: 500;">${emp.name}</div>
                                            <div style="font-size: 12px; color: #999;">${emp.position} | ${emp.empNo}</div>
                                        </div>
                                        <div style="color: #999; font-size: 12px;">
                                            ${emp.isLeave === 1 ? '在职' : '离职'}
                                        </div>
                                    </div>
                                `).join('')
                            }
                        </div>
                    </div>
                    
                    ${children.length > 0 ? `
                    <div class="form-section">
                        <div class="section-title">子部门 (${children.length}个)</div>
                        <div>
                            ${children.map(child => `
                                <div style="display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0;">
                                    <div style="margin-right: 12px;">${getDepIcon(child)}</div>
                                    <div style="flex: 1;">
                                        <div style="font-weight: 500;">${child.name}</div>
                                        <div style="font-size: 12px; color: #999;">编号: ${child.depNo || '未设置'}</div>
                                    </div>
                                    <div style="color: #999; font-size: 12px;">
                                        ${employees.filter(emp => emp.department === child.id).length}人
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                </form>
            `;
        }

        // 切换展开/收起
        function toggleExpand(event, button) {
            event.stopPropagation();
            
            const treeNode = button.closest('.tree-node');
            const children = treeNode.querySelector('.tree-children');
            
            if (children) {
                const isExpanded = children.classList.contains('expanded');
                
                if (isExpanded) {
                    children.classList.remove('expanded');
                    button.classList.remove('expanded');
                } else {
                    children.classList.add('expanded');
                    button.classList.add('expanded');
                }
            }
        }

        // 展开全部
        function expandAll() {
            document.querySelectorAll('.tree-children').forEach(children => {
                children.classList.add('expanded');
            });
            document.querySelectorAll('.tree-expand:not(.empty)').forEach(button => {
                button.classList.add('expanded');
            });
        }

        // 收起全部
        function collapseAll() {
            document.querySelectorAll('.tree-children').forEach(children => {
                children.classList.remove('expanded');
            });
            document.querySelectorAll('.tree-expand').forEach(button => {
                button.classList.remove('expanded');
            });
        }

        // 搜索部门
        function searchDepartments(keyword) {
            const treeNodes = document.querySelectorAll('.tree-node');
            
            if (!keyword.trim()) {
                // 清空搜索，显示全部
                treeNodes.forEach(node => {
                    node.style.display = '';
                });
                return;
            }
            
            treeNodes.forEach(node => {
                const label = node.querySelector('.tree-label').textContent;
                const match = label.toLowerCase().includes(keyword.toLowerCase());
                node.style.display = match ? '' : 'none';
                
                // 如果匹配，展开父节点
                if (match) {
                    let parent = node.parentElement;
                    while (parent && parent.classList.contains('tree-children')) {
                        parent.classList.add('expanded');
                        const expandBtn = parent.previousElementSibling.querySelector('.tree-expand');
                        if (expandBtn) expandBtn.classList.add('expanded');
                        parent = parent.parentElement.parentElement;
                    }
                }
            });
        }

        // 拖拽处理
        let draggedDepartment = null;

        function handleDragStart(event, department) {
            draggedDepartment = department;
            event.currentTarget.classList.add('dragging');
        }

        function handleDragOver(event) {
            event.preventDefault();
            const indicator = event.currentTarget.querySelector('.drag-indicator');
            indicator.classList.add('active');
        }

        function handleDrop(event, targetDepartment) {
            event.preventDefault();
            
            const indicator = event.currentTarget.querySelector('.drag-indicator');
            indicator.classList.remove('active');
            
            if (draggedDepartment && draggedDepartment.id !== targetDepartment.id) {
                // 检查是否会造成循环引用
                if (!wouldCreateCycle(draggedDepartment.id, targetDepartment.id)) {
                    // 移动部门
                    moveDepartment(draggedDepartment.id, targetDepartment.id);
                } else {
                    Portal.Message.warning('不能将部门移动到其子部门下');
                }
            }
            
            document.querySelectorAll('.tree-node-content.dragging').forEach(el => {
                el.classList.remove('dragging');
            });
            
            draggedDepartment = null;
        }

        // 检查是否会造成循环引用
        function wouldCreateCycle(sourceId, targetId) {
            let current = targetId;
            while (current) {
                if (current === sourceId) return true;
                const dept = departments.find(d => d.id === current);
                current = dept ? dept.parentId : null;
            }
            return false;
        }

        // 移动部门
        function moveDepartment(sourceId, targetId) {
            const dept = departments.find(d => d.id === sourceId);
            if (dept) {
                dept.parentId = targetId;
                // 重新计算等级
                const targetDept = departments.find(d => d.id === targetId);
                dept.gradeid = targetDept.gradeid + 1;
                
                renderDepartmentTree();
                Portal.Message.success('部门移动成功');
            }
        }

        // 新增部门
        function addDepartment() {
            const parentId = currentDepartment ? currentDepartment.id : 0;
            const parentLevel = currentDepartment ? currentDepartment.gradeid : 0;
            
            Portal.Modal.confirm({
                title: '新增部门',
                content: `
                    <form id="addDeptForm">
                        <div class="form-group">
                            <label class="form-label">部门名称 *</label>
                            <input type="text" name="name" class="form-control" data-validate="required" placeholder="请输入部门名称">
                        </div>
                        <div class="form-row">
                            <div class="form-col">
                                <label class="form-label">部门编号</label>
                                <input type="text" name="depNo" class="form-control" placeholder="如：D010">
                            </div>
                            <div class="form-col">
                                <label class="form-label">是否分公司</label>
                                <select name="fiiale" class="form-control">
                                    <option value="">否</option>
                                    <option value="1">是</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">上级部门</label>
                            <input type="text" class="form-control" value="${currentDepartment ? currentDepartment.name : '根部门'}" readonly>
                        </div>
                    </form>
                `,
                onConfirm: () => {
                    const form = document.getElementById('addDeptForm');
                    const validation = Portal.Validator.validate(form);
                    
                    if (validation.isValid) {
                        const formData = new FormData(form);
                        const newDept = {
                            id: MockData.generator.generateId(),
                            name: formData.get('name'),
                            depNo: formData.get('depNo'),
                            parentId: parentId,
                            gradeid: parentLevel + 1,
                            fiiale: formData.get('fiiale'),
                            directorId: null,
                            createTime: new Date().toISOString().split('T')[0]
                        };
                        
                        departments.push(newDept);
                        renderDepartmentTree();
                        Portal.Message.success('部门新增成功');
                    }
                }
            });
        }

        // 添加子部门
        function addSubDepartment(event, parentId) {
            event.stopPropagation();
            const parent = departments.find(d => d.id === parentId);
            currentDepartment = parent;
            addDepartment();
        }

        // 编辑部门
        function editDepartment(event, deptId) {
            if (event) event.stopPropagation();
            
            const dept = deptId ? departments.find(d => d.id === deptId) : currentDepartment;
            if (!dept) return;
            
            Portal.Modal.confirm({
                title: '编辑部门',
                content: `
                    <form id="editDeptForm">
                        <div class="form-group">
                            <label class="form-label">部门名称 *</label>
                            <input type="text" name="name" class="form-control" value="${dept.name}" data-validate="required">
                        </div>
                        <div class="form-row">
                            <div class="form-col">
                                <label class="form-label">部门编号</label>
                                <input type="text" name="depNo" class="form-control" value="${dept.depNo || ''}">
                            </div>
                            <div class="form-col">
                                <label class="form-label">是否分公司</label>
                                <select name="fiiale" class="form-control">
                                    <option value="" ${dept.fiiale !== '1' ? 'selected' : ''}>否</option>
                                    <option value="1" ${dept.fiiale === '1' ? 'selected' : ''}>是</option>
                                </select>
                            </div>
                        </div>
                    </form>
                `,
                onConfirm: () => {
                    const form = document.getElementById('editDeptForm');
                    const validation = Portal.Validator.validate(form);
                    
                    if (validation.isValid) {
                        const formData = new FormData(form);
                        dept.name = formData.get('name');
                        dept.depNo = formData.get('depNo');
                        dept.fiiale = formData.get('fiiale');
                        
                        renderDepartmentTree();
                        if (currentDepartment && currentDepartment.id === dept.id) {
                            showDepartmentDetail(dept);
                        }
                        Portal.Message.success('部门编辑成功');
                    }
                }
            });
        }

        // 删除部门
        function deleteDepartment(event, deptId) {
            if (event) event.stopPropagation();
            
            const dept = deptId ? departments.find(d => d.id === deptId) : currentDepartment;
            if (!dept) return;
            
            // 检查是否有子部门
            const children = departments.filter(d => d.parentId === dept.id);
            if (children.length > 0) {
                Portal.Message.error('该部门下还有子部门，无法删除');
                return;
            }
            
            // 检查是否有员工
            const deptEmployees = employees.filter(emp => emp.department === dept.id);
            if (deptEmployees.length > 0) {
                Portal.Message.error('该部门下还有员工，无法删除');
                return;
            }
            
            Portal.Modal.confirm({
                title: '确认删除',
                content: `确定要删除部门"${dept.name}"吗？此操作不可恢复。`,
                onConfirm: () => {
                    const index = departments.findIndex(d => d.id === dept.id);
                    if (index > -1) {
                        departments.splice(index, 1);
                        renderDepartmentTree();
                        
                        // 清空详情面板
                        document.getElementById('departmentDetail').innerHTML = `
                            <div class="empty-state">
                                <div class="empty-icon">🏢</div>
                                <p>请选择一个部门查看详情</p>
                            </div>
                        `;
                        document.getElementById('editBtn').style.display = 'none';
                        document.getElementById('deleteBtn').style.display = 'none';
                        currentDepartment = null;
                        
                        Portal.Message.success('部门删除成功');
                    }
                }
            });
        }

        // 导出部门
        function exportDepartments() {
            const data = departments.map(dept => ({
                '部门名称': dept.name,
                '部门编号': dept.depNo || '',
                '部门等级': dept.gradeid,
                '是否分公司': dept.fiiale === '1' ? '是' : '否',
                '员工人数': employees.filter(emp => emp.department === dept.id).length,
                '创建时间': dept.createTime
            }));
            
            console.log('导出部门数据:', data);
            Portal.Message.success('部门数据导出成功');
        }

        // 刷新部门
        function refreshDepartments() {
            loadData();
            renderDepartmentTree();
            Portal.Message.success('数据刷新成功');
        }
    </script>
</body>
</html>
