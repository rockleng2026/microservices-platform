<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜单管理 - Portal 3.0</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/navigation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>

        .page-header {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: #1a1a1a;
        }

        .header-left p {
            color: #666;
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            height: calc(100vh - 200px);
        }

        .menu-tree-panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .tree-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tree-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin: 0;
        }

        .tree-actions {
            display: flex;
            gap: 8px;
        }

        .tree-content {
            padding: 16px 20px;
            flex: 1;
            overflow-y: auto;
        }

        .menu-tree {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .tree-node {
            margin-bottom: 4px;
        }

        .tree-node-content {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .tree-node-content:hover {
            background: #f5f5f5;
        }

        .tree-node-content.active {
            background: #e6f7ff;
            color: #1890ff;
        }

        .tree-node-content.dragging {
            opacity: 0.5;
        }

        .tree-expand-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            cursor: pointer;
            color: #666;
        }

        .tree-expand-icon.expanded {
            transform: rotate(90deg);
        }

        .tree-node-icon {
            margin-right: 8px;
            color: #666;
            width: 16px;
            text-align: center;
        }

        .tree-node-label {
            flex: 1;
            font-size: 14px;
        }

        .tree-node-type {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 3px;
            color: white;
            margin-left: 8px;
        }

        .type-menu { background: #1890ff; }
        .type-button { background: #52c41a; }
        .type-api { background: #faad14; }

        .tree-node-status {
            margin-left: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-enabled { background: #52c41a; }
        .status-disabled { background: #d9d9d9; }

        .tree-children {
            margin-left: 24px;
            display: none;
        }

        .tree-children.expanded {
            display: block;
        }

        .menu-detail-panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .detail-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin: 0;
        }

        .detail-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .form-section {
            margin-bottom: 24px;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin: 0 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #e8e8e8;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }

        .form-label.required::after {
            content: '*';
            color: #f5222d;
            margin-left: 4px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #40a9ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
            outline: none;
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .icon-selector {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
        }

        .icon-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .icon-item:hover {
            border-color: #40a9ff;
            background: #f0f8ff;
        }

        .icon-item.selected {
            border-color: #1890ff;
            background: #e6f7ff;
            color: #1890ff;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        .detail-actions {
            padding: 16px 20px;
            border-top: 1px solid #e8e8e8;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #1890ff;
            color: white;
        }

        .btn-primary:hover {
            background: #40a9ff;
        }

        .btn-success {
            background: #52c41a;
            color: white;
        }

        .btn-success:hover {
            background: #73d13d;
        }

        .btn-warning {
            background: #faad14;
            color: white;
        }

        .btn-warning:hover {
            background: #ffc53d;
        }

        .btn-danger {
            background: #f5222d;
            color: white;
        }

        .btn-danger:hover {
            background: #ff4d4f;
        }

        .btn-default {
            background: white;
            color: #333;
            border: 1px solid #d9d9d9;
        }

        .btn-default:hover {
            border-color: #40a9ff;
            color: #1890ff;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: #999;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .batch-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .drop-zone {
            border: 2px dashed #d9d9d9;
            border-radius: 6px;
            padding: 8px;
            margin: 2px 0;
            transition: all 0.3s ease;
        }

        .drop-zone.drag-over {
            border-color: #1890ff;
            background: #f0f8ff;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .menu-manage-page {
                padding: 10px;
            }
            
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: 300px 1fr;
                height: auto;
            }
            
            .page-header {
                flex-direction: column;
                gap: 16px;
                align-items: stretch;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- 左侧导航 -->
        <aside class="app-sidebar" id="app-sidebar">
            <!-- 导航内容将由navigation.js动态生成 -->
        </aside>

        <!-- 头部区域 -->
        <header class="app-header">
            <div class="header-left">
                <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
                <div class="breadcrumb">
                    <span class="breadcrumb-item">Portal 3.0</span>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-item">系统管理</span>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-item">菜单管理</span>
                </div>
            </div>
            
            <div class="header-actions">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" placeholder="搜索功能...">
                </div>
                
                <button class="notification-btn">
                    <span>🔔</span>
                    <span class="notification-badge">5</span>
                </button>
                
                <div class="user-menu">
                    <div class="user-avatar">管</div>
                    <span>管理员</span>
                </div>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="app-main">
                <!-- 页面标题 -->
                <div class="page-header">
                    <div class="header-left">
                        <h1>菜单管理</h1>
                        <p>管理系统菜单结构、权限配置和显示设置</p>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-success" onclick="addRootMenu()">
                            <i class="fas fa-plus"></i>
                            新增根菜单
                        </button>
                        <button class="btn btn-default" onclick="exportMenus()">
                            <i class="fas fa-download"></i>
                            导出配置
                        </button>
                    </div>
                </div>

                <!-- 主要内容区 -->
                <div class="main-container">
                    <!-- 菜单树 -->
                    <div class="menu-tree-panel">
                        <div class="tree-header">
                            <h3 class="tree-title">菜单结构</h3>
                            <div class="tree-actions">
                                <button class="btn btn-primary" onclick="expandAll()">
                                    <i class="fas fa-expand-arrows-alt"></i>
                                </button>
                                <button class="btn btn-default" onclick="collapseAll()">
                                    <i class="fas fa-compress-arrows-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="tree-content">
                            <div class="batch-actions">
                                <button class="btn btn-primary" onclick="batchEnable()">批量启用</button>
                                <button class="btn btn-warning" onclick="batchDisable()">批量禁用</button>
                                <button class="btn btn-danger" onclick="batchDelete()">批量删除</button>
                            </div>
                            <ul class="menu-tree" id="menuTree">
                                <!-- 菜单树将由 JavaScript 动态生成 -->
                            </ul>
                        </div>
                    </div>

                    <!-- 菜单详情 -->
                    <div class="menu-detail-panel">
                        <div class="detail-header">
                            <h3 class="detail-title">菜单配置</h3>
                        </div>
                        <div class="detail-content" id="menuDetailContent">
                            <div class="empty-state">
                                <i class="fas fa-mouse-pointer"></i>
                                <p>请选择左侧菜单进行配置</p>
                            </div>
                        </div>
                        <div class="detail-actions" id="menuDetailActions" style="display: none;">
                            <button class="btn btn-default" onclick="resetForm()">重置</button>
                            <button class="btn btn-primary" onclick="saveMenu()">保存</button>
                            <button class="btn btn-success" onclick="addChildMenu()">添加子菜单</button>
                            <button class="btn btn-danger" onclick="deleteMenu()">删除</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- 底部页脚 -->
        <footer class="app-footer">
            <div class="footer-content">
                © 2024 Portal 3.0 企业管理平台 | 
                <a href="#" style="color: #1890ff; text-decoration: none;">技术支持</a> | 
                <a href="#" style="color: #1890ff; text-decoration: none;">帮助文档</a> | 
                <span style="color: #999;">版本 v3.0.1</span>
            </div>
        </footer>
    </div>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/navigation.js"></script>
    <script>
        // 菜单数据
        const menuData = [
            {
                id: 1,
                name: '工作台',
                code: 'dashboard',
                type: 'menu',
                icon: 'fas fa-tachometer-alt',
                path: '/dashboard',
                component: '',
                sortOrder: 1,
                visible: true,
                enabled: true,
                parentId: 0,
                children: [
                    {
                        id: 11,
                        name: 'OA工作台',
                        code: 'oa_workspace',
                        type: 'menu',
                        icon: 'fas fa-briefcase',
                        path: '/dashboard/oa',
                        component: 'OAWorkspace',
                        sortOrder: 1,
                        visible: true,
                        enabled: true,
                        parentId: 1,
                        children: []
                    },
                    {
                        id: 12,
                        name: 'CRM工作台',
                        code: 'crm_workspace',
                        type: 'menu',
                        icon: 'fas fa-users',
                        path: '/dashboard/crm',
                        component: 'CRMWorkspace',
                        sortOrder: 2,
                        visible: true,
                        enabled: true,
                        parentId: 1,
                        children: []
                    }
                ]
            },
            {
                id: 2,
                name: '组织架构',
                code: 'organization',
                type: 'menu',
                icon: 'fas fa-sitemap',
                path: '/organization',
                component: '',
                sortOrder: 2,
                visible: true,
                enabled: true,
                parentId: 0,
                children: [
                    {
                        id: 21,
                        name: '部门管理',
                        code: 'dept_manage',
                        type: 'menu',
                        icon: 'fas fa-building',
                        path: '/organization/department',
                        component: 'DepartmentManage',
                        sortOrder: 1,
                        visible: true,
                        enabled: true,
                        parentId: 2,
                        children: [
                            {
                                id: 211,
                                name: '新增部门',
                                code: 'dept_add',
                                type: 'button',
                                icon: 'fas fa-plus',
                                path: '',
                                component: '',
                                sortOrder: 1,
                                visible: true,
                                enabled: true,
                                parentId: 21,
                                children: []
                            },
                            {
                                id: 212,
                                name: '编辑部门',
                                code: 'dept_edit',
                                type: 'button',
                                icon: 'fas fa-edit',
                                path: '',
                                component: '',
                                sortOrder: 2,
                                visible: true,
                                enabled: true,
                                parentId: 21,
                                children: []
                            }
                        ]
                    },
                    {
                        id: 22,
                        name: '员工管理',
                        code: 'employee_manage',
                        type: 'menu',
                        icon: 'fas fa-user-friends',
                        path: '/organization/employee',
                        component: 'EmployeeManage',
                        sortOrder: 2,
                        visible: true,
                        enabled: true,
                        parentId: 2,
                        children: []
                    }
                ]
            },
            {
                id: 3,
                name: 'CRM管理',
                code: 'crm',
                type: 'menu',
                icon: 'fas fa-handshake',
                path: '/crm',
                component: '',
                sortOrder: 3,
                visible: true,
                enabled: false,
                parentId: 0,
                children: []
            }
        ];

        let selectedMenuId = null;
        let expandedNodes = new Set();

        // 图标列表
        const iconList = [
            'fas fa-home', 'fas fa-tachometer-alt', 'fas fa-sitemap', 'fas fa-users',
            'fas fa-user-friends', 'fas fa-building', 'fas fa-briefcase', 'fas fa-handshake',
            'fas fa-shopping-cart', 'fas fa-box', 'fas fa-chart-bar', 'fas fa-cogs',
            'fas fa-user-cog', 'fas fa-key', 'fas fa-shield-alt', 'fas fa-database',
            'fas fa-plus', 'fas fa-edit', 'fas fa-trash', 'fas fa-eye',
            'fas fa-download', 'fas fa-upload', 'fas fa-search', 'fas fa-filter',
            'fas fa-print', 'fas fa-copy', 'fas fa-save', 'fas fa-times'
        ];

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化导航
            const navigation = new Navigation();
            navigation.init();
            navigation.setActiveMenu('system', 'menu-manage');
            
            // 渲染菜单树
            renderMenuTree();
            
            // 添加拖拽事件
            initDragAndDrop();
        });

        // 渲染菜单树
        function renderMenuTree() {
            const treeContainer = document.getElementById('menuTree');
            treeContainer.innerHTML = '';
            
            const rootMenus = menuData.filter(menu => menu.parentId === 0);
            rootMenus.forEach(menu => {
                const li = createTreeNode(menu);
                treeContainer.appendChild(li);
            });
        }

        // 创建树节点
        function createTreeNode(menu) {
            const li = document.createElement('li');
            li.className = 'tree-node';
            li.setAttribute('data-menu-id', menu.id);

            const hasChildren = menu.children && menu.children.length > 0;
            const isExpanded = expandedNodes.has(menu.id);

            li.innerHTML = `
                <div class="tree-node-content ${selectedMenuId === menu.id ? 'active' : ''}" 
                     onclick="selectMenu(${menu.id})" draggable="true">
                    <div class="tree-expand-icon ${hasChildren ? (isExpanded ? 'expanded' : '') : ''}" 
                         onclick="toggleNode(event, ${menu.id})" style="${hasChildren ? '' : 'visibility: hidden;'}">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                    <i class="tree-node-icon ${menu.icon}"></i>
                    <span class="tree-node-label">${menu.name}</span>
                    <span class="tree-node-type type-${menu.type}">${getTypeText(menu.type)}</span>
                    <div class="tree-node-status ${menu.enabled ? 'status-enabled' : 'status-disabled'}"></div>
                </div>
            `;

            if (hasChildren) {
                const ul = document.createElement('ul');
                ul.className = `tree-children ${isExpanded ? 'expanded' : ''}`;
                
                menu.children.forEach(child => {
                    const childNode = createTreeNode(child);
                    ul.appendChild(childNode);
                });
                
                li.appendChild(ul);
            }

            return li;
        }

        // 获取类型文本
        function getTypeText(type) {
            const typeMap = {
                'menu': '菜单',
                'button': '按钮',
                'api': '接口'
            };
            return typeMap[type] || type;
        }

        // 切换节点展开/收起
        function toggleNode(event, menuId) {
            event.stopPropagation();
            
            if (expandedNodes.has(menuId)) {
                expandedNodes.delete(menuId);
            } else {
                expandedNodes.add(menuId);
            }
            
            renderMenuTree();
        }

        // 选择菜单
        function selectMenu(menuId) {
            selectedMenuId = menuId;
            renderMenuTree();
            renderMenuDetail(menuId);
        }

        // 渲染菜单详情
        function renderMenuDetail(menuId) {
            const menu = findMenuById(menuId);
            if (!menu) return;

            const content = document.getElementById('menuDetailContent');
            const actions = document.getElementById('menuDetailActions');

            content.innerHTML = `
                <form id="menuForm">
                    <div class="form-section">
                        <h4 class="section-title">基本信息</h4>
                        <div class="form-group">
                            <label class="form-label required">菜单名称</label>
                            <input type="text" class="form-input" id="menuName" value="${menu.name}" placeholder="请输入菜单名称">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label required">菜单编码</label>
                                <input type="text" class="form-input" id="menuCode" value="${menu.code}" placeholder="请输入菜单编码">
                            </div>
                            <div class="form-group">
                                <label class="form-label required">菜单类型</label>
                                <select class="form-select" id="menuType">
                                    <option value="menu" ${menu.type === 'menu' ? 'selected' : ''}>菜单</option>
                                    <option value="button" ${menu.type === 'button' ? 'selected' : ''}>按钮</option>
                                    <option value="api" ${menu.type === 'api' ? 'selected' : ''}>接口</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">菜单路径</label>
                                <input type="text" class="form-input" id="menuPath" value="${menu.path}" placeholder="请输入菜单路径">
                            </div>
                            <div class="form-group">
                                <label class="form-label">组件路径</label>
                                <input type="text" class="form-input" id="menuComponent" value="${menu.component}" placeholder="请输入组件路径">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">排序序号</label>
                            <input type="number" class="form-input" id="sortOrder" value="${menu.sortOrder}" min="0">
                        </div>
                    </div>

                    <div class="form-section">
                        <h4 class="section-title">图标设置</h4>
                        <div class="form-group">
                            <label class="form-label">选择图标</label>
                            <div class="icon-selector">
                                ${iconList.map(icon => `
                                    <div class="icon-item ${menu.icon === icon ? 'selected' : ''}" 
                                         onclick="selectIcon('${icon}')">
                                        <i class="${icon}"></i>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h4 class="section-title">显示设置</h4>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="menuVisible" ${menu.visible ? 'checked' : ''}>
                                <label for="menuVisible">是否可见</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="menuEnabled" ${menu.enabled ? 'checked' : ''}>
                                <label for="menuEnabled">是否启用</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="menuExternal">
                                <label for="menuExternal">是否外链</label>
                            </div>
                        </div>
                    </div>
                </form>
            `;

            actions.style.display = 'flex';
        }

        // 查找菜单
        function findMenuById(id) {
            function findInArray(arr) {
                for (let menu of arr) {
                    if (menu.id === id) return menu;
                    if (menu.children) {
                        const found = findInArray(menu.children);
                        if (found) return found;
                    }
                }
                return null;
            }
            return findInArray(menuData);
        }

        // 选择图标
        function selectIcon(iconClass) {
            // 移除所有选中状态
            document.querySelectorAll('.icon-item').forEach(item => {
                item.classList.remove('selected');
            });
            
            // 添加选中状态
            event.currentTarget.classList.add('selected');
        }

        // 保存菜单
        function saveMenu() {
            if (!selectedMenuId) return;

            const menu = findMenuById(selectedMenuId);
            if (!menu) return;

            // 收集表单数据
            menu.name = document.getElementById('menuName').value;
            menu.code = document.getElementById('menuCode').value;
            menu.type = document.getElementById('menuType').value;
            menu.path = document.getElementById('menuPath').value;
            menu.component = document.getElementById('menuComponent').value;
            menu.sortOrder = parseInt(document.getElementById('sortOrder').value);
            menu.visible = document.getElementById('menuVisible').checked;
            menu.enabled = document.getElementById('menuEnabled').checked;

            // 获取选中的图标
            const selectedIcon = document.querySelector('.icon-item.selected i');
            if (selectedIcon) {
                menu.icon = selectedIcon.className;
            }

            console.log('保存菜单:', menu);
            alert('菜单保存成功！');
            
            // 重新渲染树
            renderMenuTree();
        }

        // 重置表单
        function resetForm() {
            if (selectedMenuId) {
                renderMenuDetail(selectedMenuId);
            }
        }

        // 添加子菜单
        function addChildMenu() {
            if (!selectedMenuId) return;

            const parentMenu = findMenuById(selectedMenuId);
            if (!parentMenu) return;

            const newMenu = {
                id: Date.now(),
                name: '新菜单',
                code: 'new_menu',
                type: 'menu',
                icon: 'fas fa-circle',
                path: '',
                component: '',
                sortOrder: (parentMenu.children ? parentMenu.children.length : 0) + 1,
                visible: true,
                enabled: true,
                parentId: selectedMenuId,
                children: []
            };

            if (!parentMenu.children) {
                parentMenu.children = [];
            }
            parentMenu.children.push(newMenu);

            // 展开父节点
            expandedNodes.add(selectedMenuId);

            // 重新渲染并选中新菜单
            renderMenuTree();
            selectMenu(newMenu.id);
        }

        // 删除菜单
        function deleteMenu() {
            if (!selectedMenuId) return;

            if (confirm('确定要删除该菜单吗？删除后不可恢复！')) {
                removeMenuById(selectedMenuId);
                selectedMenuId = null;
                
                // 清空详情面板
                document.getElementById('menuDetailContent').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-mouse-pointer"></i>
                        <p>请选择左侧菜单进行配置</p>
                    </div>
                `;
                document.getElementById('menuDetailActions').style.display = 'none';
                
                renderMenuTree();
                alert('菜单删除成功！');
            }
        }

        // 移除菜单
        function removeMenuById(id) {
            function removeFromArray(arr) {
                for (let i = 0; i < arr.length; i++) {
                    if (arr[i].id === id) {
                        arr.splice(i, 1);
                        return true;
                    }
                    if (arr[i].children && removeFromArray(arr[i].children)) {
                        return true;
                    }
                }
                return false;
            }
            removeFromArray(menuData);
        }

        // 添加根菜单
        function addRootMenu() {
            const newMenu = {
                id: Date.now(),
                name: '新根菜单',
                code: 'new_root_menu',
                type: 'menu',
                icon: 'fas fa-circle',
                path: '',
                component: '',
                sortOrder: menuData.filter(m => m.parentId === 0).length + 1,
                visible: true,
                enabled: true,
                parentId: 0,
                children: []
            };

            menuData.push(newMenu);
            renderMenuTree();
            selectMenu(newMenu.id);
        }

        // 展开所有节点
        function expandAll() {
            function addAllIds(arr) {
                arr.forEach(menu => {
                    if (menu.children && menu.children.length > 0) {
                        expandedNodes.add(menu.id);
                        addAllIds(menu.children);
                    }
                });
            }
            addAllIds(menuData);
            renderMenuTree();
        }

        // 收起所有节点
        function collapseAll() {
            expandedNodes.clear();
            renderMenuTree();
        }

        // 批量操作
        function batchEnable() {
            if (confirm('确定要批量启用选中的菜单吗？')) {
                // 实现批量启用逻辑
                alert('批量启用成功！');
            }
        }

        function batchDisable() {
            if (confirm('确定要批量禁用选中的菜单吗？')) {
                // 实现批量禁用逻辑
                alert('批量禁用成功！');
            }
        }

        function batchDelete() {
            if (confirm('确定要批量删除选中的菜单吗？删除后不可恢复！')) {
                // 实现批量删除逻辑
                alert('批量删除成功！');
            }
        }

        // 导出菜单配置
        function exportMenus() {
            const dataStr = JSON.stringify(menuData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'menu-config.json';
            link.click();
            
            URL.revokeObjectURL(url);
        }

        // 初始化拖拽功能
        function initDragAndDrop() {
            // 拖拽相关事件处理
            document.addEventListener('dragstart', function(e) {
                if (e.target.hasAttribute('draggable')) {
                    e.target.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', e.target.closest('.tree-node').getAttribute('data-menu-id'));
                }
            });

            document.addEventListener('dragend', function(e) {
                if (e.target.hasAttribute('draggable')) {
                    e.target.classList.remove('dragging');
                }
            });

            document.addEventListener('dragover', function(e) {
                e.preventDefault();
                const dropZone = e.target.closest('.tree-node');
                if (dropZone) {
                    dropZone.classList.add('drop-zone', 'drag-over');
                }
            });

            document.addEventListener('dragleave', function(e) {
                const dropZone = e.target.closest('.tree-node');
                if (dropZone) {
                    dropZone.classList.remove('drag-over');
                }
            });

            document.addEventListener('drop', function(e) {
                e.preventDefault();
                const dropZone = e.target.closest('.tree-node');
                if (dropZone) {
                    dropZone.classList.remove('drag-over');
                    const draggedMenuId = parseInt(e.dataTransfer.getData('text/plain'));
                    const targetMenuId = parseInt(dropZone.getAttribute('data-menu-id'));
                    
                    if (draggedMenuId !== targetMenuId) {
                        console.log('移动菜单:', draggedMenuId, '到', targetMenuId);
                        // 实现菜单移动逻辑
                    }
                }
            });
        }
    </script>
</body>
