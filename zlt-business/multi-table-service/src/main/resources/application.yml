spring:
  datasource:
    url: jdbc:mysql://${zlt.datasource.ip}:3306/multi_table_system?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai
    username: ${zlt.datasource.username}
    password: ${zlt.datasource.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:/mapper/*Mapper.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.central.multitable.model
  global-config:
    db-config:
      id-type: auto
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.central.multitable.controller

knife4j:
  enable: true
  setting:
    swagger-model-name: 多维表格服务接口文档

zlt:
  cache-manager:
    configs:
      - key: table
        second: 300
      - key: field
        second: 600
      - key: view
        second: 300
  #多租户配置
  tenant:
    enable: true
    ignoreTables:
      - mt_field_type_dict
      - mt_field
      - mt_tenant
      - mt_tenant_config
    ignoreSqls:
      # 字段类型字典查询
      - com.central.multitable.mapper.MtFieldTypeDictMapper.selectList
      # 租户配置查询
      - com.central.multitable.mapper.MtTenantConfigMapper.selectByTenantId
  # 数据权限
  datascope:
    enabled: true
    ignoreTables:
      - mt_permission
      - mt_tenant_config
    includeSqls:
      # 表格列表
      - com.central.multitable.mapper.MtTableMapper.findList
      # 团队列表
      - com.central.multitable.mapper.MtTeamMapper.findList
      # 权限列表
      - com.central.multitable.mapper.MtPermissionMapper.findList 