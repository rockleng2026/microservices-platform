<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部门管理 - Portal 3.0</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/navigation.css">
    <style>
        /* 部门树管理专用样式 */
        .department-container {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .department-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e8e8e8;
        }

        .department-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .department-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-input {
            width: 200px;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
        }

        .search-input:focus {
            border-color: #1890ff;
            outline: none;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }

        .btn-action {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #1890ff;
            color: white;
        }

        .btn-primary:hover {
            background: #40a9ff;
        }

        .btn-default {
            background: #f5f5f5;
            color: #666;
            border: 1px solid #d9d9d9;
        }

        .btn-default:hover {
            background: #e6f7ff;
            border-color: #1890ff;
            color: #1890ff;
        }

        /* 部门树样式 */
        .department-tree {
            margin-top: 20px;
        }

        .tree-node {
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            margin-bottom: 8px;
            background: white;
            transition: all 0.3s ease;
        }

        .tree-node:hover {
            border-color: #1890ff;
            box-shadow: 0 2px 8px rgba(24, 144, 255, 0.15);
        }

        .tree-node-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
        }

        .tree-node-content {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .tree-node-expand {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .tree-node-expand:hover {
            background: #f5f5f5;
        }

        .tree-node-expand.expanded::before {
            content: '📂';
        }

        .tree-node-expand.collapsed::before {
            content: '📁';
        }

        .tree-node-expand.no-children::before {
            content: '📄';
            opacity: 0.5;
        }

        .dept-info {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .dept-name {
            font-weight: 500;
            color: #333;
            margin-right: 12px;
        }

        .dept-code {
            background: #f0f0f0;
            color: #666;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 8px;
        }

        .dept-level {
            background: #e6f7ff;
            color: #1890ff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 8px;
        }

        .dept-status {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-enabled {
            background: #f6ffed;
            color: #52c41a;
        }

        .status-disabled {
            background: #fff2e8;
            color: #fa8c16;
        }

        .half-level-mark {
            color: #fa8c16;
            font-weight: bold;
            margin-left: 4px;
        }

        .dept-stats {
            display: flex;
            gap: 12px;
            color: #666;
            font-size: 12px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tree-actions {
            display: flex;
            gap: 8px;
            margin-left: 16px;
        }

        .action-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-manage {
            background: #e6f7ff;
            color: #1890ff;
        }

        .btn-manage:hover {
            background: #bae7ff;
        }

        .btn-edit {
            background: #f6ffed;
            color: #52c41a;
        }

        .btn-edit:hover {
            background: #d9f7be;
        }

        .btn-delete {
            background: #fff2e8;
            color: #fa541c;
        }

        .btn-delete:hover {
            background: #ffd8bf;
        }

        .tree-children {
            padding: 0 0 0 40px;
            border-top: 1px solid #f0f0f0;
            background: #fafafa;
            display: none;
        }

        .tree-children.expanded {
            display: block;
            padding: 16px 16px 16px 40px;
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e8e8e8;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: #666;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #1890ff;
            outline: none;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e8e8e8;
        }

        .required {
            color: #f5222d;
        }

        /* 空状态样式 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-text {
            font-size: 16px;
            margin-bottom: 20px;
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .loading::before {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #1890ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .department-header {
                flex-direction: column;
                gap: 16px;
                align-items: stretch;
            }

            .department-actions {
                justify-content: space-between;
            }

            .search-input {
                width: 120px;
            }

            .tree-actions {
                margin-left: 8px;
            }

            .action-btn {
                padding: 2px 6px;
                font-size: 11px;
            }

            .modal-content {
                width: 95%;
                padding: 16px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .nav-subitem.active {
            background: rgba(24, 144, 255, 0.1);
            color: #1890ff;
        }

        .nav-subitem.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #1890ff;
        }

        // 渲染部门树
        function renderDepartmentTree(data, container = null) {
            if (!container) {
                container = document.getElementById('departmentTree');
            }

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📁</div>
                        <div class="empty-text">暂无部门数据</div>
                        <button class="btn-action btn-primary" onclick="showAddDepartmentModal()">新增部门</button>
                    </div>
                `;
                return;
            }

            const html = data.map(dept => renderDepartmentNode(dept)).join('');
            container.innerHTML = html;
        }

        // 渲染单个部门节点
        function renderDepartmentNode(dept) {
            const hasChildren = dept.children && dept.children.length > 0;
            const isExpanded = expandedNodes.has(dept.id);
            const expandClass = hasChildren ? (isExpanded ? 'expanded' : 'collapsed') : 'no-children';
            const statusClass = dept.status === 1 ? 'status-enabled' : 'status-disabled';
            const statusText = dept.status === 1 ? '启用' : '禁用';
            const gradeNames = ['', '集团级', '公司级', '事业部级', '部门级', '科室级', '小组级', '班组级'];
            const gradeName = gradeNames[dept.gradeid] || '未知';
            const halfLevelMark = dept.isHalfLevel ? '<span class="half-level-mark">*</span>' : '';
            const isFiliale = dept.fiiale === '1';

            return `
                <div class="tree-node" data-id="${dept.id}">
                    <div class="tree-node-header">
                        <div class="tree-node-content">
                            <div class="tree-node-expand ${expandClass}" onclick="toggleNode(${dept.id})"></div>
                            <div class="dept-info">
                                <span class="dept-name">${dept.name}${halfLevelMark}</span>
                                ${dept.depNo ? `<span class="dept-code">${dept.depNo}</span>` : ''}
                                <span class="dept-level">${gradeName}</span>
                                ${isFiliale ? '<span class="dept-level" style="background: #fff2e8; color: #fa8c16;">分公司</span>' : ''}
                                <span class="dept-status ${statusClass}">${statusText}</span>
                            </div>
                        </div>
                        <div class="dept-stats">
                            <div class="stat-item">
                                <span>👥</span>
                                <span>${dept.employeeCount || 0}人</span>
                            </div>
                            <div class="stat-item">
                                <span>💼</span>
                                <span>${dept.positionCount || 0}岗</span>
                            </div>
                        </div>
                        <div class="tree-actions">
                            <button class="action-btn btn-manage" onclick="managePositions(${dept.id})" title="岗位管理">
                                💼 岗位
                            </button>
                            <button class="action-btn btn-manage" onclick="manageEmployees(${dept.id})" title="人员管理">
                                👥 人员
                            </button>
                            <button class="action-btn btn-edit" onclick="editDepartment(${dept.id})" title="编辑部门">
                                ✏️ 编辑
                            </button>
                            <button class="action-btn btn-delete" onclick="deleteDepartment(${dept.id})" title="删除部门">
                                🗑️ 删除
                            </button>
                        </div>
                    </div>
                    ${hasChildren ? `
                        <div class="tree-children ${isExpanded ? 'expanded' : ''}" id="children-${dept.id}">
                            ${dept.children.map(child => renderDepartmentNode(child)).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 切换节点展开/折叠
        function toggleNode(id) {
            const childrenContainer = document.getElementById(`children-${id}`);
            const expandButton = document.querySelector(`[data-id="${id}"] .tree-node-expand`);
            
            if (!childrenContainer) return;

            if (expandedNodes.has(id)) {
                expandedNodes.delete(id);
                childrenContainer.classList.remove('expanded');
                expandButton.classList.remove('expanded');
                expandButton.classList.add('collapsed');
            } else {
                expandedNodes.add(id);
                childrenContainer.classList.add('expanded');
                expandButton.classList.remove('collapsed');
                expandButton.classList.add('expanded');
            }
        }

        // 展开所有节点
        function expandAllNodes() {
            const allNodes = document.querySelectorAll('.tree-node');
            allNodes.forEach(node => {
                const id = parseInt(node.dataset.id);
                const childrenContainer = node.querySelector('.tree-children');
                const expandButton = node.querySelector('.tree-node-expand');
                
                if (childrenContainer && !expandButton.classList.contains('no-children')) {
                    expandedNodes.add(id);
                    childrenContainer.classList.add('expanded');
                    expandButton.classList.remove('collapsed');
                    expandButton.classList.add('expanded');
                }
            });
        }

        // 折叠所有节点
        function collapseAllNodes() {
            expandedNodes.clear();
            const childrenContainers = document.querySelectorAll('.tree-children');
            const expandButtons = document.querySelectorAll('.tree-node-expand:not(.no-children)');
            
            childrenContainers.forEach(container => {
                container.classList.remove('expanded');
            });
            
            expandButtons.forEach(button => {
                button.classList.remove('expanded');
                button.classList.add('collapsed');
            });
        }

        // 搜索过滤部门
        function filterDepartments(keyword) {
            if (!keyword.trim()) {
                renderDepartmentTree(departmentData);
                return;
            }

            const filtered = filterDepartmentData(departmentData, keyword.toLowerCase());
            renderDepartmentTree(filtered);
        }

        // 递归过滤部门数据
        function filterDepartmentData(data, keyword) {
            return data.filter(dept => {
                const matches = dept.name.toLowerCase().includes(keyword) ||
                              (dept.depNo && dept.depNo.toLowerCase().includes(keyword)) ||
                              (dept.directorName && dept.directorName.toLowerCase().includes(keyword));
                
                if (matches) {
                    return true;
                }
                
                if (dept.children && dept.children.length > 0) {
                    const filteredChildren = filterDepartmentData(dept.children, keyword);
                    if (filteredChildren.length > 0) {
                        dept.children = filteredChildren;
                        return true;
                    }
                }
                
                return false;
            });
        }

        // 显示新增部门模态框
        function showAddDepartmentModal(parentId = null) {
            currentEditId = null;
            document.getElementById('modalTitle').textContent = '新增部门';
            
            // 重置表单
            document.getElementById('departmentForm').reset();
            document.getElementById('sortOrder').value = '0';
            
            // 加载上级部门选项
            loadParentDepartmentOptions(parentId);
            
            // 显示模态框
            document.getElementById('departmentModal').classList.add('show');
        }

        // 编辑部门
        function editDepartment(id) {
            currentEditId = id;
            document.getElementById('modalTitle').textContent = '编辑部门';
            
            // 查找部门数据
            const dept = findDepartmentById(departmentData, id);
            if (!dept) {
                showError('部门数据不存在');
                return;
            }
            
            // 填充表单数据
            document.getElementById('deptName').value = dept.name || '';
            document.getElementById('deptCode').value = dept.depNo || '';
            document.getElementById('deptGrade').value = dept.gradeid || '7';
            document.getElementById('deptDirector').value = dept.directorId || '';
            document.getElementById('deptTel').value = dept.tel || '';
            document.getElementById('deptAddress').value = dept.address || '';
            document.getElementById('deptDescription').value = dept.description || '';
            document.getElementById('isFiliale').value = dept.fiiale || '';
            document.getElementById('sortOrder').value = dept.sortOrder || '0';
            
            // 加载上级部门选项
            loadParentDepartmentOptions(dept.parentId, id);
            
            // 显示模态框
            document.getElementById('departmentModal').classList.add('show');
        }

        // 递归查找部门
        function findDepartmentById(data, id) {
            for (const dept of data) {
                if (dept.id === id) {
                    return dept;
                }
                if (dept.children && dept.children.length > 0) {
                    const found = findDepartmentById(dept.children, id);
                    if (found) return found;
                }
            }
            return null;
        }

        // 加载上级部门选项
        function loadParentDepartmentOptions(selectedId = null, excludeId = null) {
            const select = document.getElementById('parentDept');
            select.innerHTML = '<option value="">请选择上级部门</option>';
            
            function addOptions(data, level = 0) {
                data.forEach(dept => {
                    if (excludeId && dept.id === excludeId) return;
                    
                    const prefix = '　'.repeat(level);
                    const option = document.createElement('option');
                    option.value = dept.id;
                    option.textContent = prefix + dept.name;
                    if (selectedId && dept.id === selectedId) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                    
                    if (dept.children && dept.children.length > 0) {
                        addOptions(dept.children, level + 1);
                    }
                });
            }
            
            addOptions(departmentData);
        }

        // 保存部门
        async function saveDepartment() {
            const form = document.getElementById('departmentForm');
            if (!form.checkValidity()) {
                showError('请填写必填字段');
                return;
            }

            const formData = {
                name: document.getElementById('deptName').value,
                depNo: document.getElementById('deptCode').value,
                parentId: document.getElementById('parentDept').value || 0,
                gradeid: parseInt(document.getElementById('deptGrade').value),
                directorId: document.getElementById('deptDirector').value || null,
                tel: document.getElementById('deptTel').value,
                address: document.getElementById('deptAddress').value,
                description: document.getElementById('deptDescription').value,
                fiiale: document.getElementById('isFiliale').value,
                sortOrder: parseInt(document.getElementById('sortOrder').value) || 0
            };

            try {
                // 模拟API调用
                const url = currentEditId ? 
                    `/api/organization/department/${currentEditId}` : 
                    '/api/organization/department';
                const method = currentEditId ? 'PUT' : 'POST';
                
                const response = await mockApiCall(url, {
                    method,
                    body: JSON.stringify(formData)
                });

                if (response.success) {
                    showSuccess(currentEditId ? '部门更新成功' : '部门创建成功');
                    closeDepartmentModal();
                    loadDepartmentData(); // 重新加载数据
                } else {
                    showError(response.message || '操作失败');
                }
            } catch (error) {
                console.error('保存部门失败:', error);
                showError('保存失败，请重试');
            }
        }

        // 删除部门
        function deleteDepartment(id) {
            const dept = findDepartmentById(departmentData, id);
            if (!dept) {
                showError('部门数据不存在');
                return;
            }

            currentDeleteId = id;
            const hasChildren = dept.children && dept.children.length > 0;
            const message = hasChildren ? 
                `确定要删除部门"${dept.name}"吗？删除后将同时删除所有子部门，此操作不可恢复。` :
                `确定要删除部门"${dept.name}"吗？此操作不可恢复。`;
            
            document.getElementById('deleteMessage').textContent = message;
            document.getElementById('deleteModal').classList.add('show');
        }

        // 确认删除
        async function confirmDelete() {
            if (!currentDeleteId) return;

            try {
                const response = await mockApiCall(`/api/organization/department/${currentDeleteId}`, {
                    method: 'DELETE'
                });

                if (response.success) {
                    showSuccess('部门删除成功');
                    closeDeleteModal();
                    loadDepartmentData(); // 重新加载数据
                } else {
                    showError(response.message || '删除失败');
                }
            } catch (error) {
                console.error('删除部门失败:', error);
                showError('删除失败，请重试');
            }
        }

        // 岗位管理
        function managePositions(id) {
            const dept = findDepartmentById(departmentData, id);
            if (dept) {
                window.location.href = `position-manage.html?deptId=${id}&deptName=${encodeURIComponent(dept.name)}`;
            }
        }

        // 人员管理
        function manageEmployees(id) {
            const dept = findDepartmentById(departmentData, id);
            if (dept) {
                window.location.href = `employee-list.html?deptId=${id}&deptName=${encodeURIComponent(dept.name)}`;
            }
        }

        // 导入部门
        function showImportModal() {
            document.getElementById('importModal').classList.add('show');
        }

        function importDepartments() {
            const fileInput = document.getElementById('importFile');
            const file = fileInput.files[0];
            
            if (!file) {
                showError('请选择要导入的文件');
                return;
            }

            // 这里应该实现文件上传和解析逻辑
            showInfo('导入功能开发中...');
        }

        function downloadTemplate() {
            // 创建模板数据
            const templateData = 'data:text/csv;charset=utf-8,部门名称,部门编号,上级部门编号,部门等级,联系电话,办公地址,是否分公司\n示例部门,DEMO,CEO,4,010-12345678,北京市朝阳区,否';
            
            // 创建下载链接
            const link = document.createElement('a');
            link.href = templateData;
            link.download = '部门导入模板.csv';
            link.click();
        }

        // 导出部门
        function exportDepartments() {
            // 模拟导出功能
            showInfo('正在导出部门数据...');
            
            setTimeout(() => {
                showSuccess('导出完成');
            }, 1000);
        }

        // 关闭模态框
        function closeDepartmentModal() {
            document.getElementById('departmentModal').classList.remove('show');
            currentEditId = null;
        }

        function closeImportModal() {
            document.getElementById('importModal').classList.remove('show');
            document.getElementById('importFile').value = '';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('show');
            currentDeleteId = null;
        }

        // 工具函数
        function showLoading() {
            document.getElementById('loadingState').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loadingState').style.display = 'none';
        }

        function showSuccess(message) {
            Message.success(message);
        }

        function showError(message) {
            Message.error(message);
        }

        function showInfo(message) {
            Message.info(message);
        }

        // 点击模态框外部关闭
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('show');
            }
        });
    </script>
</body>
