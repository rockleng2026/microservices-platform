    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
        /* 框架布局结构 */
        .app-layout {
            display: grid;
            grid-template-areas: 
                "sidebar header"
                "sidebar main"
                "sidebar footer";
            grid-template-columns: 240px 1fr;
            grid-template-rows: 60px 1fr auto;
            min-height: 100vh;
            background: #f5f5f5;
        }

        /* 头部区域 */
        .app-header {
            grid-area: header;
            background: white;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        /* 左侧导航区域 */
        .app-sidebar {
            grid-area: sidebar;
            background: white;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        /* 主内容区域 */
        .app-main {
            grid-area: main;
            padding: 24px;
            overflow-y: auto;
            min-height: calc(100vh - 120px);
        }

        /* 底部页脚区域 */

            grid-area: footer;
            background: white;
            border-top: 1px solid #e8e8e8;
            padding: 16px 24px;

            font-size: 14px;
            text-align: center;

        /* 侧边栏头部 */

            height: 60px;

            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #e8e8e8;
            background: white;

        .logo {
            width: 32px;
            height: 32px;
            background: #1890ff;
            border-radius: 6px;

            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 12px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .nav-menu {
            padding: 20px 0;
            list-style: none;
            margin: 0;
        }

        .nav-item {
            margin-bottom: 4px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #666 !important;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            font-size: 14px;
            width: 100%;

        }

        .nav-link:hover {
            background: #f5f5f5 !important;
            color: #333 !important;

        .nav-link.active {

        .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;

            background: #1890ff;
        }

        .nav-icon {
            margin-right: 12px;
            font-size: 16px;
            display: inline-block;

        }

        /* 二级菜单样式 */
        .nav-group {

            align-items: center;
            padding: 12px 20px;
            color: #666;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            font-size: 14px;

            border: none;

        .nav-group:hover {

            color: #333;
        }

        .nav-group.expanded {

    <script>
        let positions = [];
        let filteredPositions = [];
        let currentPosition = null;
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            loadPositionData();
        });
        
        // 切换导航组展开/收起
        function toggleNavGroup(element) {
            const submenu = element.nextElementSibling;
            const arrow = element.querySelector('.nav-arrow');
            
            if (submenu && submenu.classList.contains('nav-submenu')) {
                submenu.classList.toggle('expanded');
                element.classList.toggle('expanded');
                
                if (submenu.classList.contains('expanded')) {
                    arrow.style.transform = 'rotate(90deg)';
                } else {
                    arrow.style.transform = 'rotate(0deg)';
                }
            }
        }
        
        // 加载岗位数据
        function loadPositionData() {
            positions = window.MockData.positions.map(pos => {
                const dept = window.MockData.departments.find(d => d.id == pos.deptId);
                const employeeCount = window.MockData.employees.filter(e => e.workposition == pos.id).length;
                
                return {
                    ...pos,
                    deptName: dept ? dept.name : '未分配',
                    employeeCount: employeeCount
                };
            });
            
            filteredPositions = [...positions];
            renderPositionList();
        }
        
        // 渲染岗位列表
        function renderPositionList() {
            const listContainer = document.getElementById('positionList');
            
            if (filteredPositions.length === 0) {
                listContainer.innerHTML = `
                    <div style="text-align: center; padding: 24px; color: #999;">
                        <i style="font-size: 32px;">💼</i><br>
                        暂无岗位数据
                    </div>
                `;
                return;
            }
            
            listContainer.innerHTML = filteredPositions.map(pos => `
                <div class="position-item ${currentPosition === pos.id ? 'active' : ''}" onclick="selectPosition(${pos.id})">
                    <div class="position-name">${pos.name}</div>
                    <div class="position-meta">
                        <span>${pos.deptName}</span>
                        <span>${pos.employeeCount}人</span>
                    </div>
                    <div class="position-actions" onclick="event.stopPropagation()">
                        <button class="btn btn-default btn-sm" onclick="editPosition(${pos.id})" title="编辑">
                            ✏️
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="deletePosition(${pos.id})" title="删除">
                            🗑️
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        // 搜索岗位
        function searchPositions() {
            const keyword = document.getElementById('positionSearch').value.trim();
            
            if (keyword) {
                filteredPositions = positions.filter(pos => 
                    pos.name.includes(keyword) || pos.description?.includes(keyword)
                );
            } else {
                filteredPositions = [...positions];
            }
            
            renderPositionList();
        }
        
        // 选择岗位
        function selectPosition(posId) {
            currentPosition = posId;
            renderPositionList();
            loadPositionDetail(posId);
        }
        
        // 加载岗位详情
        function loadPositionDetail(posId) {
            const position = positions.find(p => p.id === posId);
            if (!position) return;

        // 渲染权限树
        function renderPermissionTree() {
            const permissions = [

                        { id: 'follow_edit', name: '添加跟进', icon: '✏️' }
                    ]
                },
                {
                    id: 'product',
                    name: '商品管理',
                    icon: '📦',
                    children: [
                        { id: 'product_view', name: '查看商品', icon: '👁️' },
                        { id: 'product_edit', name: '编辑商品', icon: '✏️' },
                        { id: 'inventory_view', name: '查看库存', icon: '👁️' },
                        { id: 'inventory_edit', name: '调整库存', icon: '✏️' }
                    ]
                }
            ];
            
            function renderNode(node, level = 0) {
                const hasChildren = node.children && node.children.length > 0;
                const indent = level * 16;
                
                let html = `
                    <div class="permission-node" style="margin-left: ${indent}px;">
                        <div class="permission-item">
                            <input type="checkbox" class="permission-checkbox" 
                                   value="${node.id}" onchange="togglePermission('${node.id}')">
                            <i class="permission-icon">${node.icon}</i>
                            <span>${node.name}</span>
                        </div>
                `;
                
                if (hasChildren) {
                    html += '<div class="permission-children">';
                    node.children.forEach(child => {
                        html += renderNode(child, level + 1);
                    });
                    html += '</div>';
                }
                
                html += '</div>';
                return html;
            }
            
            return permissions.map(perm => renderNode(perm)).join('');
        }
