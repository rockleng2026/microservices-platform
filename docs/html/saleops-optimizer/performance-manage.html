<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盈策通决策平台 - 绩效管理</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Portal框架标准布局 */
        .app-layout {
            display: grid;
            grid-template-areas: "sidebar header" "sidebar main" "sidebar footer";
            grid-template-columns: 240px 1fr;
            grid-template-rows: 60px 1fr auto;
            min-height: 100vh;
            background: #f5f5f5;
        }

        .app-header {
            grid-area: header;
            background: white;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .app-sidebar {
            grid-area: sidebar;
            background: white;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        .app-main {
            grid-area: main;
            padding: 24px;
            overflow-y: auto;
        }

        .app-footer {
            grid-area: footer;
            background: white;
            border-top: 1px solid #e8e8e8;
            padding: 16px 24px;
            color: #666;
            font-size: 14px;
            text-align: center;
        }

        /* 导航菜单样式 */
        .sidebar-header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #e8e8e8;
            background: white;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: #1890ff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 12px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .nav-menu {
            padding: 20px 0;
            list-style: none;
            margin: 0;
        }

        .nav-item {
            margin-bottom: 4px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #666 !important;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            font-size: 14px;
            width: 100%;
        }

        .nav-link:hover {
            background: #f5f5f5 !important;
            color: #333 !important;
        }

        .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #1890ff;
        }

        .nav-icon {
            margin-right: 12px;
            font-size: 16px;
            display: inline-block;
            min-width: 20px;
        }

        .nav-group {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #666;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            font-size: 14px;
            cursor: pointer;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
        }

        .nav-group:hover {
            background: #f5f5f5;
            color: #333;
        }

        .nav-group.expanded {
            background: rgba(24, 144, 255, 0.05);
            color: #1890ff;
        }

        .nav-arrow {
            margin-left: auto;
            transition: transform 0.3s ease;
            font-size: 12px;
        }

        .nav-arrow.rotated {
            transform: rotate(90deg);
        }

        .nav-submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: #fafafa;
        }

        .nav-submenu.expanded {
            max-height: 300px;
        }

        .nav-subitem {
            display: block;
            padding: 10px 20px 10px 52px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-subitem:hover {
            background: #f0f0f0;
            color: #333;
        }

        .nav-subitem.active {
            background: rgba(24, 144, 255, 0.1);
            color: #1890ff;
        }

        .nav-subitem.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #1890ff;
        }

        /* 页面内容样式 */
        .page-header {
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #262626;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
        }

        .page-title i {
            color: #1890ff;
            margin-right: 12px;
        }

        .page-subtitle {
            color: #8c8c8c;
            font-size: 14px;
            margin: 0;
        }

        .filter-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .filter-row {
            display: flex;
            gap: 24px;
            align-items: end;
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-item label {
            font-size: 14px;
            font-weight: 500;
            color: #262626;
        }

        .filter-select,
        .filter-input {
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
        }

        .performance-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #d9d9d9;
            background: white;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #1890ff;
            color: white;
            border-color: #1890ff;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .performance-table {
            width: 100%;
            border-collapse: collapse;
        }

        .performance-table th,
        .performance-table td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .performance-table th {
            background: #fafafa;
            font-weight: 600;
            color: #262626;
        }

        .performance-table td {
            color: #595959;
        }

        .performance-table tr:hover {
            background: #fafafa;
        }

        .score-input,
        .amount-input,
        .rate-input {
            width: 100%;
            padding: 4px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
        }

        .status-saved {
            color: #52c41a;
            font-size: 12px;
        }

        .status-pending {
            color: #faad14;
            font-size: 12px;
        }

        .stats-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stats-card {
            background: #fafafa;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stats-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .stats-value {
            font-size: 24px;
            font-weight: 600;
            color: #262626;
            margin-bottom: 8px;
        }

        .stats-trend {
            font-size: 12px;
            color: #52c41a;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .app-layout {
                grid-template-columns: 1fr;
                grid-template-areas: "header" "main" "footer";
            }

            .app-sidebar {
                display: none;
            }

            .filter-row {
                flex-direction: column;
                align-items: stretch;
            }

            .stats-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- 左侧导航菜单 -->
        <nav class="app-sidebar" id="app-sidebar">
            <!-- 导航内容将通过 JavaScript 动态生成 -->
        </nav>

        <!-- 头部区域 -->
        <header class="app-header">
            <div class="breadcrumb">
                <span>盈策通决策平台</span>
                <span style="margin: 0 8px; color: #d9d9d9;">/</span>
                <span>绩效管理</span>
            </div>
            <div class="header-actions">
                <span>管理员</span>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="app-main">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="fas fa-chart-bar"></i>
                    绩效管理
                </h1>
                <p class="page-subtitle">月度绩效录入与统计分析</p>
            </div>

            <!-- 筛选条件 -->
            <div class="filter-section">
                <div class="filter-row">
                    <div class="filter-item">
                        <label>📅 月份选择:</label>
                        <select class="filter-select">
                            <option value="2024-12">2024年12月</option>
                            <option value="2024-11">2024年11月</option>
                            <option value="2024-10">2024年10月</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>👥 部门筛选:</label>
                        <select class="filter-select">
                            <option value="">全部部门</option>
                            <option value="sales">销售部</option>
                            <option value="rd">产品研发部</option>
                            <option value="marketing">市场运营部</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>🔍 员工搜索:</label>
                        <input type="text" class="filter-input" placeholder="输入员工姓名">
                    </div>
                </div>
            </div>

            <!-- 绩效录入表格 -->
            <div class="performance-section">
                <div class="section-header">
                    <h3>员工绩效录入</h3>
                    <div class="action-buttons">
                        <button class="btn">全选</button>
                        <button class="btn">反选</button>
                        <button class="btn btn-primary">💾 批量保存</button>
                        <button class="btn">📊 数据分析</button>
                        <button class="btn">📤 导出</button>
                    </div>
                </div>

                <table class="performance-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll"></th>
                            <th>员工姓名</th>
                            <th>部门</th>
                            <th>绩效得分</th>
                            <th>个人项目营业额</th>
                            <th>团队项目营业额</th>
                            <th>毛利率</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><input type="checkbox" name="employee"></td>
                            <td>张三</td>
                            <td>销售部</td>
                            <td><input type="number" class="score-input" value="95" min="0" max="100"></td>
                            <td><input type="text" class="amount-input" value="500,000"></td>
                            <td><input type="text" class="amount-input" value="1,000,000"></td>
                            <td><input type="text" class="rate-input" value="35%"></td>
                            <td><span class="status-saved">已保存</span></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" name="employee"></td>
                            <td>李四</td>
                            <td>销售部</td>
                            <td><input type="number" class="score-input" value="80" min="0" max="100"></td>
                            <td><input type="text" class="amount-input" value="200,000"></td>
                            <td><input type="text" class="amount-input" value="1,000,000"></td>
                            <td><input type="text" class="rate-input" value="35%"></td>
                            <td><span class="status-pending">待保存</span></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" name="employee"></td>
                            <td>王五</td>
                            <td>产品研发部</td>
                            <td><input type="number" class="score-input" value="90" min="0" max="100"></td>
                            <td><input type="text" class="amount-input" value="0"></td>
                            <td><input type="text" class="amount-input" value="500,000"></td>
                            <td><input type="text" class="rate-input" value="65%"></td>
                            <td><span class="status-saved">已保存</span></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" name="employee"></td>
                            <td>赵六</td>
                            <td>市场运营部</td>
                            <td><input type="number" class="score-input" value="85" min="0" max="100"></td>
                            <td><input type="text" class="amount-input" value="300,000"></td>
                            <td><input type="text" class="amount-input" value="800,000"></td>
                            <td><input type="text" class="rate-input" value="45%"></td>
                            <td><span class="status-pending">待保存</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 统计分析 -->
            <div class="stats-section">
                <h3>绩效数据统计</h3>
                <div class="stats-cards">
                    <div class="stats-card">
                        <div class="stats-label">平均绩效得分</div>
                        <div class="stats-value">87.3</div>
                        <div class="stats-trend">📈 较上月提升2.1分</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-label">总营业额</div>
                        <div class="stats-value">¥15,680,000</div>
                        <div class="stats-trend">📈 较上月增长12.5%</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-label">平均毛利率</div>
                        <div class="stats-value">45.5%</div>
                        <div class="stats-trend">📈 较上月提升3.2%</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-label">完成录入率</div>
                        <div class="stats-value">95.2%</div>
                        <div class="stats-trend">🎯 目标: 100%</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 底部页脚 -->
        <footer class="app-footer">
            © 2024 Portal 3.0 - 企业管理平台. All rights reserved.
        </footer>
    </div>

    <script src="../assets/js/navigation.js"></script>
    <script>
        // 初始化导航
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof NavigationManager !== 'undefined') {
                const nav = new NavigationManager();
                nav.render();
            }
        });

        // 全选功能
        document.getElementById('selectAll').addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('input[name="employee"]');
            checkboxes.forEach(cb => cb.checked = this.checked);
        });

        // 监听输入变化，更新保存状态
        document.addEventListener('input', function(e) {
            if (e.target.classList.contains('score-input') || 
                e.target.classList.contains('amount-input') || 
                e.target.classList.contains('rate-input')) {
                const row = e.target.closest('tr');
                const statusSpan = row.querySelector('.status-saved, .status-pending');
                if (statusSpan) {
                    statusSpan.className = 'status-pending';
                    statusSpan.textContent = '待保存';
                }
            }
        });
    </script>
</body>
</html>
