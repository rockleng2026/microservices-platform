<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组织架构 - Portal 3.0</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
        .workspace-container {
            display: flex;
            min-height: 100vh;
            background: #f5f5f5;
        }

        .sidebar {
            width: 240px;
            background: white;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #e8e8e8;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: #1890ff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 12px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .nav-menu {
            padding: 20px 0;
            list-style: none;
            margin: 0;
        }

        .nav-item {
            margin-bottom: 4px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #666 !important;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            font-size: 14px;
            width: 100%;
            overflow: visible;
        }

        .nav-link span {
            display: inline-block;
            color: inherit;
            white-space: nowrap;
            overflow: visible;
        }

        .nav-link:hover {
            background: #f5f5f5 !important;
            color: #333 !important;
        }

        .nav-link.active {
            background: rgba(24, 144, 255, 0.1) !important;
            color: #1890ff !important;
        }

        .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #1890ff;
        }

        .nav-icon {
            margin-right: 12px;
            font-size: 16px;
            display: inline-block;
            min-width: 20px;
        }

        .main-content {
            flex: 1;
            margin-left: 240px;
            min-height: 100vh;
        }

        .header {
            height: 60px;
            background: white;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            color: #666;
        }

        .breadcrumb-item {
            margin-right: 8px;
        }

        .breadcrumb-separator {
            margin: 0 8px;
            color: #d9d9d9;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            width: 200px;
            height: 32px;
            padding: 0 12px 0 36px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            background: #fafafa;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .notification-btn {
            position: relative;
            width: 32px;
            height: 32px;
            border: none;
            background: none;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            transition: all 0.3s ease;
        }

        .notification-btn:hover {
            background: #f5f5f5;
        }

        .notification-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 16px;
            height: 16px;
            background: #ff4d4f;
            color: white;
            border-radius: 50%;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-menu {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .user-menu:hover {
            background: #f5f5f5;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1890ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 8px;
        }

        .page-content {
            padding: 24px;
        }
        
        .department-layout {
            display: flex;
            gap: 24px;
            height: calc(100vh - 60px - 48px);
        }
        
        .department-tree-panel {
            flex: 0 0 400px;
            min-width: 350px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        
        .department-info-panel {
            flex: 1;
            min-width: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        
        .panel-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .panel-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            color: #333;
        }
        
        .panel-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .tree-search {
            margin-bottom: 16px;
        }
        
        .tree-container {
            flex: 1;
            overflow-y: auto;
        }
        
        .tree-node {
            margin-bottom: 4px;
        }
        
        .tree-node-content {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        
        .tree-node-content:hover {
            background: #f0f2f5;
        }
        
        .tree-node-content.active {
            background: rgba(24, 144, 255, 0.1);
            border: 1px solid #1890ff;
        }
        
        .tree-node-content.dragging {
            opacity: 0.5;
            background: #fff2e8;
        }
        
        .tree-expand {
            width: 16px;
            height: 16px;
            margin-right: 4px;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
        }
        
        .tree-expand:hover {
            background: #d9d9d9;
        }
        
        .tree-expand::before {
            content: '▶';
            font-size: 10px;
            transition: transform 0.3s;
        }
        
        .tree-expand.expanded::before {
            transform: rotate(90deg);
        }
        
        .tree-expand.empty {
            visibility: hidden;
        }
        
        .tree-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            background: #1890ff;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
        }
        
        .tree-label {
            flex: 1;
            font-size: 14px;
        }
        
        .tree-badge {
            background: #f5f5f5;
            color: #666;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 8px;
        }
        
        .tree-actions {
            opacity: 0;
            transition: opacity 0.3s;
            margin-left: 8px;
        }
        
        .tree-node-content:hover .tree-actions {
            opacity: 1;
        }
        
        .tree-action-btn {
            width: 20px;
            height: 20px;
            border: none;
            background: none;
            border-radius: 2px;
            cursor: pointer;
            margin-left: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .tree-action-btn:hover {
            background: #d9d9d9;
        }
        
        .tree-children {
            margin-left: 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .tree-children.expanded {
            max-height: 1000px;
        }
        
        .dept-form {
            display: grid;
            gap: 16px;
        }
        
        .form-section {
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 16px;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-label {
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
            font-weight: 500;
        }
        
        .form-input, .form-select, .form-textarea {
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }
        
        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e8e8e8;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        
        .btn-primary {
            background: #1890ff;
            color: white;
            border-color: #1890ff;
        }
        
        .btn-primary:hover {
            background: #40a9ff;
            border-color: #40a9ff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(24, 144, 255, 0.3);
        }
        
        .btn-secondary {
            background: white;
            color: #666;
            border-color: #d9d9d9;
        }
        
        .btn-secondary:hover {
            border-color: #1890ff;
            color: #1890ff;
        }
        
        .btn-danger {
            background: #ff4d4f;
            color: white;
            border-color: #ff4d4f;
        }
        
        .btn-danger:hover {
            background: #ff7875;
            border-color: #ff7875;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            color: #999;
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .empty-text {
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .empty-desc {
            font-size: 14px;
            color: #ccc;
        }
        
        .employee-list {
            margin-top: 16px;
        }
        
        .employee-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        
        .employee-item:last-child {
            border-bottom: none;
        }
        
        .employee-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1890ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 12px;
        }
        
        .employee-info {
            flex: 1;
        }
        
        .employee-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .employee-position {
            font-size: 12px;
            color: #999;
        }
        
        .employee-actions {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            padding: 4px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            background: white;
            color: #666;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .action-btn:hover {
            border-color: #1890ff;
            color: #1890ff;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-240px);
            }

            .main-content {
                margin-left: 0;
            }

            .page-content {
                padding: 16px;
            }

            .department-layout {
                flex-direction: column;
                height: auto;
            }
            
            .department-tree-panel {
                flex: none;
                min-width: auto;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/mock-data.js"></script>
    <script>
        let selectedDepartment = null;
        let departments = [];

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            loadDepartmentData();
            renderDepartmentTree();
            
            // 搜索功能
            document.getElementById('treeSearch').addEventListener('input', function(e) {
                const keyword = e.target.value.toLowerCase();
                filterDepartmentTree(keyword);
            });
        });

        // 加载部门数据
        function loadDepartmentData() {
            // 使用mock数据中的部门信息
            departments = window.mockData.departments || [];
        }

        // 渲染部门树
        function renderDepartmentTree() {
            const container = document.getElementById('departmentTree');
            container.innerHTML = '';
            
            const rootDepts = departments.filter(dept => !dept.parentId);
            rootDepts.forEach(dept => {
                const nodeElement = createTreeNode(dept);
                container.appendChild(nodeElement);
            });
        }

        // 创建树节点
        function createTreeNode(department) {
            const hasChildren = departments.some(d => d.parentId === department.id);
            const childrenCount = departments.filter(d => d.parentId === department.id).length;
            
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'tree-node';
            nodeDiv.setAttribute('data-dept-id', department.id);
            
            nodeDiv.innerHTML = `
                <div class="tree-node-content" onclick="selectDepartment('${department.id}')">
                    <button class="tree-expand ${hasChildren ? '' : 'empty'}" onclick="toggleNode(event, '${department.id}')">
                    </button>
                    <div class="tree-icon">${department.name.charAt(0)}</div>
                    <span class="tree-label">${department.name}</span>
                    ${childrenCount > 0 ? `<span class="tree-badge">${childrenCount}</span>` : ''}
                    <div class="tree-actions">
                        <button class="tree-action-btn" onclick="addSubDepartment(event, '${department.id}')" title="添加下级">+</button>
                        <button class="tree-action-btn" onclick="editDepartmentInline(event, '${department.id}')" title="编辑">✏</button>
                    </div>
                </div>
                <div class="tree-children" id="children-${department.id}">
                    ${hasChildren ? renderChildren(department.id) : ''}
                </div>
            `;
            
            return nodeDiv;
        }

        // 渲染子部门
        function renderChildren(parentId) {
            const children = departments.filter(d => d.parentId === parentId);
            return children.map(child => createTreeNode(child).outerHTML).join('');
        }

        // 切换节点展开/收缩
        function toggleNode(event, deptId) {
            event.stopPropagation();
            const expandBtn = event.target;
            const childrenContainer = document.getElementById(`children-${deptId}`);
            
            if (expandBtn.classList.contains('expanded')) {
                expandBtn.classList.remove('expanded');
                childrenContainer.classList.remove('expanded');
            } else {
                expandBtn.classList.add('expanded');
                childrenContainer.classList.add('expanded');
            }
        }

        // 选择部门
        function selectDepartment(deptId) {
            // 清除之前的选中状态
            document.querySelectorAll('.tree-node-content.active').forEach(node => {
                node.classList.remove('active');
            });
            
            // 设置当前选中状态
            const currentNode = document.querySelector(`[data-dept-id="${deptId}"] .tree-node-content`);
            if (currentNode) {
                currentNode.classList.add('active');
            }
            
            // 更新选中的部门
            selectedDepartment = departments.find(d => d.id === deptId);
            
            if (selectedDepartment) {
                renderDepartmentDetails(selectedDepartment);
            }
        }

        // 渲染部门详情
        function renderDepartmentDetails(department) {
            const titleElement = document.getElementById('deptTitle');
            const actionsElement = document.getElementById('deptActions');
            const contentElement = document.getElementById('deptContent');
            
            titleElement.textContent = department.name;
            actionsElement.style.display = 'flex';
            
            // 获取部门员工
            const employees = window.mockData.employees.filter(emp => emp.departmentId === department.id);
            
            contentElement.innerHTML = `
                <form class="dept-form">
                    <div class="form-section">
                        <div class="section-title">基本信息</div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">部门名称</label>
                                <input type="text" class="form-input" value="${department.name}" readonly>
                            </div>
                            <div class="form-group">
                                <label class="form-label">部门代码</label>
                                <input type="text" class="form-input" value="${department.code}" readonly>
                            </div>
                            <div class="form-group">
                                <label class="form-label">部门级别</label>
                                <input type="text" class="form-input" value="第${department.level}级" readonly>
                            </div>
                            <div class="form-group">
                                <label class="form-label">排序权重</label>
                                <input type="number" class="form-input" value="${department.sort}" readonly>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">部门描述</label>
                                <textarea class="form-textarea" readonly>${department.description || '暂无描述'}</textarea>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <div class="section-title">部门员工 (${employees.length}人)</div>
                        <div class="employee-list">
                            ${employees.length > 0 ? employees.map(emp => `
                                <div class="employee-item">
                                    <div class="employee-avatar">${emp.name.charAt(0)}</div>
                                    <div class="employee-info">
                                        <div class="employee-name">${emp.name}</div>
                                        <div class="employee-position">${emp.position}</div>
                                    </div>
                                    <div class="employee-actions">
                                        <button type="button" class="action-btn" onclick="viewEmployee('${emp.id}')">查看</button>
                                        <button type="button" class="action-btn" onclick="editEmployee('${emp.id}')">编辑</button>
                                    </div>
                                </div>
                            `).join('') : '<div class="empty-state"><div class="empty-text">暂无员工</div></div>'}
                        </div>
                    </div>
                </form>
            `;
        }

        // 添加部门
        function addDepartment() {
            showMessage('正在打开添加部门对话框...', 'info');
            // 这里可以实现添加部门的对话框
        }

        // 添加子部门
        function addSubDepartment(event, parentId) {
            event.stopPropagation();
            showMessage(`正在为部门${parentId}添加子部门...`, 'info');
        }

        // 编辑部门
        function editDepartment() {
            if (!selectedDepartment) return;
            
            showMessage('正在打开编辑部门对话框...', 'info');
            // 这里可以实现编辑部门的对话框
        }

        // 内联编辑部门
        function editDepartmentInline(event, deptId) {
            event.stopPropagation();
            showMessage(`正在编辑部门${deptId}...`, 'info');
        }

        // 删除部门
        function deleteDepartment() {
            if (!selectedDepartment) return;
            
            if (confirm(`确定要删除部门"${selectedDepartment.name}"吗？`)) {
                showMessage('部门删除成功', 'success');
                // 这里可以实现删除部门的逻辑
            }
        }

        // 查看员工
        function viewEmployee(empId) {
            showMessage(`正在查看员工${empId}详情...`, 'info');
        }

        // 编辑员工
        function editEmployee(empId) {
            showMessage(`正在编辑员工${empId}...`, 'info');
        }

        // 过滤部门树
        function filterDepartmentTree(keyword) {
            const allNodes = document.querySelectorAll('.tree-node');
            
            allNodes.forEach(node => {
                const label = node.querySelector('.tree-label').textContent.toLowerCase();
                const isMatch = label.includes(keyword);
                
                if (keyword === '' || isMatch) {
                    node.style.display = 'block';
                } else {
                    node.style.display = 'none';
                }
            });
        }

        // 初始化拖拽功能（可选）
        function initDragAndDrop() {
            // 实现部门拖拽排序功能
        }
    </script>
</body>
</html>
