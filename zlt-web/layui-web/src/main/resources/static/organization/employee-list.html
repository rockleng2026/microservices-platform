<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理 - Portal 3.0</title>
    <link rel="stylesheet" href="../assets/layui/css/layui.css">
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
        .employee-container {
            padding: 20px;
            min-height: 100vh;
            background: #f5f5f5;
        }
        
        .search-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .search-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            color: #333;
        }
        
        .search-content {
            padding: 20px;
        }
        
        .search-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .search-item {
            flex: 1;
            min-width: 200px;
        }
        
        .search-actions {
            text-align: center;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
            margin-top: 20px;
        }
        
        .table-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .table-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .table-title {
            font-weight: 600;
            color: #333;
        }
        
        .table-actions {
            display: flex;
            gap: 10px;
        }
        
        .employee-table {
            width: 100%;
        }
        
        .employee-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .status-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: white;
        }
        
        .status-active { background-color: #52c41a; }
        .status-trial { background-color: #1890ff; }
        .status-leave { background-color: #999; }
        
        .type-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            background-color: #f0f0f0;
            color: #666;
        }
        
        .action-buttons .layui-btn {
            margin-right: 5px;
            padding: 0 10px;
            height: 28px;
            line-height: 28px;
            font-size: 12px;
        }
        
        .employee-detail-card {
            background: white;
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .detail-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .detail-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.3);
            margin-bottom: 10px;
        }
        
        .detail-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .detail-position {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .detail-content {
            padding: 20px;
        }
        
        .detail-section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            display: flex;
            padding: 8px 0;
        }
        
        .info-label {
            min-width: 80px;
            color: #666;
            font-size: 14px;
        }
        
        .info-value {
            color: #333;
            font-size: 14px;
            flex: 1;
        }
        
        .timeline {
            position: relative;
            padding-left: 20px;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e8e8e8;
        }
        
        .timeline-item {
            position: relative;
            margin-bottom: 20px;
            padding-left: 25px;
        }
        
        .timeline-dot {
            position: absolute;
            left: -8px;
            top: 5px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #1890ff;
            border: 2px solid white;
            box-shadow: 0 0 0 2px #e8e8e8;
        }
        
        .timeline-content {
            background: #fafafa;
            padding: 10px 15px;
            border-radius: 6px;
            border-left: 3px solid #1890ff;
        }
        
        .timeline-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .timeline-meta {
            font-size: 12px;
            color: #999;
        }
        
        @media (max-width: 768px) {
            .employee-container {
                padding: 10px;
            }
            
            .search-row {
                flex-direction: column;
                gap: 10px;
            }
            
            .search-item {
                min-width: auto;
            }
            
            .table-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="employee-container">
        <!-- 搜索区域 -->
        <div class="search-card">
            <div class="search-header">
                <i class="layui-icon layui-icon-search"></i> 员工搜索
            </div>
            <div class="search-content">
                <form class="layui-form" lay-filter="searchForm">
                    <div class="search-row">
                        <div class="search-item">
                            <label class="layui-form-label">关键词</label>
                            <div class="layui-input-block">
                                <input type="text" name="keyword" placeholder="姓名、员工编号" class="layui-input">
                            </div>
                        </div>
                        <div class="search-item">
                            <label class="layui-form-label">部门</label>
                            <div class="layui-input-block">
                                <select name="departmentId" lay-filter="departmentSelect">
                                    <option value="">请选择部门</option>
                                </select>
                            </div>
                        </div>
                        <div class="search-item">
                            <label class="layui-form-label">在职状态</label>
                            <div class="layui-input-block">
                                <select name="employmentStatus">
                                    <option value="">全部状态</option>
                                    <option value="1">在职</option>
                                    <option value="2">试用</option>
                                    <option value="3">离职</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="search-row">
                        <div class="search-item">
                            <label class="layui-form-label">岗位</label>
                            <div class="layui-input-block">
                                <select name="positionId" lay-filter="positionSelect">
                                    <option value="">请选择岗位</option>
                                </select>
                            </div>
                        </div>
                        <div class="search-item">
                            <label class="layui-form-label">用工类型</label>
                            <div class="layui-input-block">
                                <select name="employmentType">
                                    <option value="">全部类型</option>
                                    <option value="1">正式</option>
                                    <option value="2">实习</option>
                                    <option value="3">外包</option>
                                    <option value="4">劳务</option>
                                </select>
                            </div>
                        </div>
                        <div class="search-item">
                            <label class="layui-form-label">入职时间</label>
                            <div class="layui-input-block">
                                <input type="text" name="entryDateRange" placeholder="选择日期范围" class="layui-input" id="entryDateRange">
                            </div>
                        </div>
                    </div>
                    <div class="search-actions">
                        <button type="button" class="layui-btn" lay-submit lay-filter="searchBtn">
                            <i class="layui-icon layui-icon-search"></i> 搜索
                        </button>
                        <button type="reset" class="layui-btn layui-btn-primary">
                            <i class="layui-icon layui-icon-refresh"></i> 重置
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 表格区域 -->
        <div class="table-card">
            <div class="table-header">
                <div class="table-title">
                    <i class="layui-icon layui-icon-user"></i> 员工列表
                </div>
                <div class="table-actions">
                    <button class="layui-btn layui-btn-sm" id="addEmployee">
                        <i class="layui-icon layui-icon-add-1"></i> 新增员工
                    </button>
                    <button class="layui-btn layui-btn-sm layui-btn-normal" id="importEmployee">
                        <i class="layui-icon layui-icon-upload"></i> 导入
                    </button>
                    <button class="layui-btn layui-btn-sm layui-btn-warm" id="exportEmployee">
                        <i class="layui-icon layui-icon-download-circle"></i> 导出
                    </button>
                    <button class="layui-btn layui-btn-sm layui-btn-danger" id="batchDelete">
                        <i class="layui-icon layui-icon-delete"></i> 批量删除
                    </button>
                </div>
            </div>
            <table class="layui-table employee-table" lay-filter="employeeTable" id="employeeTable"></table>
        </div>
    </div>

    <!-- 员工详情弹窗 -->
    <div id="employeeDetailModal" style="display: none; padding: 20px;">
        <div class="employee-detail-card">
            <div class="detail-header">
                <img class="detail-avatar" id="detailAvatar" src="../assets/images/default-avatar.png" alt="头像">
                <div class="detail-name" id="detailName">--</div>
                <div class="detail-position" id="detailPosition">--</div>
            </div>
            <div class="detail-content">
                <!-- 基础信息 -->
                <div class="detail-section">
                    <div class="section-title">基础信息</div>
                    <div class="info-grid" id="basicInfo">
                        <!-- 动态生成基础信息 -->
                    </div>
                </div>
                
                <!-- 部门岗位 -->
                <div class="detail-section">
                    <div class="section-title">部门岗位</div>
                    <div class="info-grid" id="deptPositionInfo">
                        <!-- 动态生成部门岗位信息 -->
                    </div>
                </div>
                
                <!-- 联系信息 -->
                <div class="detail-section">
                    <div class="section-title">联系信息</div>
                    <div class="info-grid" id="contactInfo">
                        <!-- 动态生成联系信息 -->
                    </div>
                </div>
                
                <!-- 工作履历 -->
                <div class="detail-section">
                    <div class="section-title">工作履历</div>
                    <div class="timeline" id="workHistory">
                        <!-- 动态生成工作履历 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 员工表单弹窗 -->
    <div id="employeeFormModal" style="display: none; padding: 20px;">
        <form class="layui-form" lay-filter="employeeForm" style="max-width: 600px;">
            <input type="hidden" name="id">
            <input type="hidden" name="tenantId">
            
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">姓名 <span style="color: red;">*</span></label>
                        <div class="layui-input-block">
                            <input type="text" name="name" required lay-verify="required" placeholder="请输入姓名" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">员工编号</label>
                        <div class="layui-input-block">
                            <input type="text" name="empNo" placeholder="自动生成" class="layui-input">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">性别</label>
                        <div class="layui-input-block">
                            <input type="radio" name="gender" value="1" title="男" checked>
                            <input type="radio" name="gender" value="2" title="女">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">出生日期</label>
                        <div class="layui-input-block">
                            <input type="text" name="birthDate" id="birthDate" placeholder="请选择出生日期" class="layui-input">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">手机号</label>
                        <div class="layui-input-block">
                            <input type="text" name="mobile" lay-verify="phone" placeholder="请输入手机号" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">邮箱</label>
                        <div class="layui-input-block">
                            <input type="email" name="email" lay-verify="email" placeholder="请输入邮箱" class="layui-input">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">部门 <span style="color: red;">*</span></label>
                        <div class="layui-input-block">
                            <select name="departmentId" lay-verify="required" lay-filter="formDepartmentSelect">
                                <option value="">请选择部门</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">岗位 <span style="color: red;">*</span></label>
                        <div class="layui-input-block">
                            <select name="positionId" lay-verify="required" lay-filter="formPositionSelect">
                                <option value="">请选择岗位</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">用工类型</label>
                        <div class="layui-input-block">
                            <select name="employmentType">
                                <option value="1">正式</option>
                                <option value="2">实习</option>
                                <option value="3">外包</option>
                                <option value="4">劳务</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">入职日期</label>
                        <div class="layui-input-block">
                            <input type="text" name="entryDate" id="entryDate" placeholder="请选择入职日期" class="layui-input">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="layui-form-item">
                <label class="layui-form-label">身份证号</label>
                <div class="layui-input-block">
                    <input type="text" name="idCard" lay-verify="identity" placeholder="请输入身份证号" class="layui-input">
                </div>
            </div>
            
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" placeholder="请输入备注信息" class="layui-textarea"></textarea>
                </div>
            </div>
            
            <div class="layui-form-item" style="text-align: center; margin-top: 30px;">
                <button class="layui-btn" lay-submit lay-filter="saveEmployee">
                    <i class="layui-icon layui-icon-ok"></i> 保存
                </button>
                <button type="button" class="layui-btn layui-btn-primary" id="cancelForm">
                    <i class="layui-icon layui-icon-close"></i> 取消
                </button>
            </div>
        </form>
    </div>

    <script src="../assets/layui/layui.js"></script>
    <script>
        layui.use(['table', 'form', 'layer', 'laydate', 'util'], function(){
            var table = layui.table,
                form = layui.form,
                layer = layui.layer,
                laydate = layui.laydate,
                util = layui.util,
                $ = layui.$;

            // 初始化日期选择器
            laydate.render({
                elem: '#entryDateRange',
                type: 'date',
                range: true
            });

            laydate.render({
                elem: '#birthDate',
                type: 'date'
            });

            laydate.render({
                elem: '#entryDate',
                type: 'date'
            });

            // 渲染表格
            var tableIns = table.render({
                elem: '#employeeTable',
                url: '/api/organization/employees/page',
                page: true,
                limit: 20,
                limits: [10, 20, 50, 100],
                loading: true,
                cols: [[
                    {type: 'checkbox', width: 50},
                    {field: 'avatar', title: '头像', width: 80, templet: function(d){
                        return '<img class="employee-avatar" src="' + (d.avatar || '../assets/images/default-avatar.png') + '" alt="头像">';
                    }},
                    {field: 'empNo', title: '员工编号', width: 120},
                    {field: 'name', title: '姓名', width: 100},
                    {field: 'departmentName', title: '部门', width: 150},
                    {field: 'positionName', title: '岗位', width: 120},
                    {field: 'mobile', title: '手机号', width: 120},
                    {field: 'employmentStatus', title: '状态', width: 80, templet: function(d){
                        var status = d.employmentStatus;
                        if(status == 1) {
                            return '<span class="status-badge status-active">在职</span>';
                        } else if(status == 2) {
                            return '<span class="status-badge status-trial">试用</span>';
                        } else if(status == 3) {
                            return '<span class="status-badge status-leave">离职</span>';
                        }
                        return '--';
                    }},
                    {field: 'employmentType', title: '类型', width: 80, templet: function(d){
                        var type = d.employmentType;
                        var typeMap = {1: '正式', 2: '实习', 3: '外包', 4: '劳务'};
                        return '<span class="type-badge">' + (typeMap[type] || '--') + '</span>';
                    }},
                    {field: 'entryDate', title: '入职日期', width: 120},
                    {title: '操作', width: 200, align: 'center', fixed: 'right', templet: function(d){
                        var html = '<div class="action-buttons">';
                        html += '<button class="layui-btn layui-btn-xs" onclick="viewEmployee(' + d.id + ')">详情</button>';
                        html += '<button class="layui-btn layui-btn-xs layui-btn-normal" onclick="editEmployee(' + d.id + ')">编辑</button>';
                        if(d.employmentStatus == 2) {
                            html += '<button class="layui-btn layui-btn-xs layui-btn-warm" onclick="convertEmployee(' + d.id + ')">转正</button>';
                        }
                        if(d.employmentStatus != 3) {
                            html += '<button class="layui-btn layui-btn-xs layui-btn-danger" onclick="leaveEmployee(' + d.id + ')">离职</button>';
                        }
                        html += '<button class="layui-btn layui-btn-xs layui-btn-danger" onclick="deleteEmployee(' + d.id + ')">删除</button>';
                        html += '</div>';
                        return html;
                    }}
                ]],
                done: function(res, curr, count){
                    // 表格渲染完成的回调
                }
            });

            // 搜索表单提交
            form.on('submit(searchBtn)', function(data){
                var field = data.field;
                
                // 处理日期范围
                if(field.entryDateRange) {
                    var dates = field.entryDateRange.split(' - ');
                    field.entryDateStart = dates[0];
                    field.entryDateEnd = dates[1];
                }
                
                // 重载表格
                table.reload('employeeTable', {
                    where: field,
                    page: {curr: 1}
                });
                
                return false;
            });

            // 新增员工
            $('#addEmployee').click(function(){
                openEmployeeForm();
            });

            // 编辑员工
            window.editEmployee = function(id) {
                openEmployeeForm(id);
            };

            // 查看员工详情
            window.viewEmployee = function(id) {
                layer.open({
                    type: 1,
                    title: '员工详情',
                    content: $('#employeeDetailModal'),
                    area: ['800px', '600px'],
                    success: function(layero, index){
                        loadEmployeeDetail(id);
                    }
                });
            };

            // 员工转正
            window.convertEmployee = function(id) {
                layer.confirm('确认将该员工转正吗？', {
                    btn: ['确认', '取消']
                }, function(index){
                    // TODO: 调用转正API
                    layer.msg('转正成功');
                    tableIns.reload();
                    layer.close(index);
                });
            };

            // 员工离职
            window.leaveEmployee = function(id) {
                layer.prompt({title: '离职原因', formType: 2}, function(value, index){
                    // TODO: 调用离职API
                    layer.msg('离职处理成功');
                    tableIns.reload();
                    layer.close(index);
                });
            };

            // 删除员工
            window.deleteEmployee = function(id) {
                layer.confirm('确认删除该员工吗？', {
                    btn: ['确认', '取消']
                }, function(index){
                    // TODO: 调用删除API
                    layer.msg('删除成功');
                    tableIns.reload();
                    layer.close(index);
                });
            };

            // 打开员工表单
            function openEmployeeForm(id) {
                layer.open({
                    type: 1,
                    title: id ? '编辑员工' : '新增员工',
                    content: $('#employeeFormModal'),
                    area: ['700px', '600px'],
                    success: function(layero, index){
                        // 重置表单
                        $('#employeeFormModal form')[0].reset();
                        form.render();
                        
                        // 加载部门和岗位数据
                        loadDepartments();
                        
                        if(id) {
                            // 编辑模式，加载员工数据
                            loadEmployeeData(id);
                        }
                    }
                });
            }

            // 加载员工详情
            function loadEmployeeDetail(id) {
                // TODO: 调用API加载员工详情
                // 模拟数据
                var detail = {
                    id: id,
                    name: '张三',
                    empNo: 'E001',
                    position: '高级工程师',
                    department: '技术部',
                    mobile: '13800138000',
                    email: 'zhangsan@example.com',
                    entryDate: '2023-01-01'
                };
                
                $('#detailName').text(detail.name);
                $('#detailPosition').text(detail.position + ' · ' + detail.department);
                
                // 填充基础信息
                var basicHtml = [
