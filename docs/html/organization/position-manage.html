<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岗位管理 - Portal 3.0</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .position-layout {
            display: flex;
            gap: 20px;
            height: calc(100vh - 200px);
        }
        
        .position-list-panel {
            flex: 1;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .position-detail-panel {
            flex: 1;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .panel-header {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: between;
            align-items: center;
        }
        
        .panel-content {
            padding: 20px;
            overflow-y: auto;
        }
        
        .position-item {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .position-item:hover {
            background: #f9f9f9;
        }
        
        .position-item.active {
            background: #e6f7ff;
            border-left: 3px solid var(--primary-color);
        }
        
        .position-name {
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .position-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #666;
        }
        
        .position-level {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .level-1 { background: #f6ffed; color: #52c41a; }
        .level-2 { background: #e6f7ff; color: #1890ff; }
        .level-3 { background: #fff2e8; color: #fa8c16; }
        .level-4 { background: #fff1f0; color: #f5222d; }
        
        .position-form {
            display: grid;
            gap: 20px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .form-group-full {
            grid-column: 1 / -1;
        }
        
        .permission-tree {
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .permission-node {
            padding: 8px 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .permission-node:last-child {
            border-bottom: none;
        }
        
        .permission-node.parent {
            background: #fafafa;
            font-weight: 500;
        }
        
        .permission-node.child {
            padding-left: 40px;
            font-size: 14px;
        }
        
        .employees-in-position {
            margin-top: 20px;
        }
        
        .employee-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            background: #f0f2f5;
            border-radius: 16px;
            font-size: 12px;
            margin: 4px 8px 4px 0;
        }
        
        .employee-tag .remove {
            cursor: pointer;
            color: #999;
        }
        
        .employee-tag .remove:hover {
            color: #f5222d;
        }
        
        .position-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .search-box-small {
            position: relative;
            width: 300px;
        }
        
        .search-box-small input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .search-box-small i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #bfbfbf;
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Portal 3.0</h2>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-title">组织架构</div>
                    <a href="department-tree.html" class="nav-link">
                        <i class="fas fa-sitemap"></i> 部门管理
                    </a>
                    <a href="employee-list.html" class="nav-link">
                        <i class="fas fa-users"></i> 员工管理
                    </a>
                    <a href="position-manage.html" class="nav-link active">
                        <i class="fas fa-briefcase"></i> 岗位管理
                    </a>
                    <a href="role-permission.html" class="nav-link">
                        <i class="fas fa-shield-alt"></i> 角色权限
                    </a>
                </div>
                <div class="nav-section">
                    <div class="nav-title">客户管理</div>
                    <a href="../crm/customer-dashboard.html" class="nav-link">
                        <i class="fas fa-chart-pie"></i> CRM工作台
                    </a>
                    <a href="../crm/customer-list.html" class="nav-link">
                        <i class="fas fa-address-book"></i> 客户列表
                    </a>
                </div>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部导航 -->
            <header class="main-header">
                <div class="header-left">
                    <button class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="breadcrumb">
                        <span>组织架构</span>
                        <i class="fas fa-chevron-right"></i>
                        <span>岗位管理</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="搜索岗位...">
                    </div>
                    <div class="user-menu">
                        <img src="https://via.placeholder.com/32" alt="用户头像" class="user-avatar">
                        <span>管理员</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </header>

            <!-- 页面内容 -->
            <div class="page-content">
                <div class="page-header">
                    <h1>岗位管理</h1>
                    <p>管理企业岗位体系，配置岗位职责和权限</p>
                </div>

                <!-- 操作按钮 -->
                <div class="position-actions">
                    <button class="btn btn-primary" onclick="showAddPositionModal()">
                        <i class="fas fa-plus"></i> 新增岗位
                    </button>
                    <button class="btn btn-success" onclick="importPositions()">
                        <i class="fas fa-upload"></i> 批量导入
                    </button>
                    <button class="btn btn-default" onclick="exportPositions()">
                        <i class="fas fa-download"></i> 导出配置
                    </button>
                    <div class="search-box-small">
                        <i class="fas fa-search"></i>
                        <input type="text" id="positionSearch" placeholder="搜索岗位名称..." onkeyup="searchPositions()">
                    </div>
                </div>

                <!-- 双面板布局 -->
                <div class="position-layout">
                    <!-- 岗位列表面板 -->
                    <div class="position-list-panel">
                        <div class="panel-header">
                            <h3>岗位列表</h3>
                            <span class="text-muted">共 <span id="positionCount">0</span> 个岗位</span>
                        </div>
                        <div class="panel-content" id="positionListContent">
                            <!-- 岗位列表将通过JavaScript渲染 -->
                        </div>
                    </div>

                    <!-- 岗位详情面板 -->
                    <div class="position-detail-panel">
                        <div class="panel-header">
                            <h3 id="detailTitle">选择岗位查看详情</h3>
                            <div id="detailActions" style="display: none;">
                                <button class="btn btn-sm btn-primary" onclick="editCurrentPosition()">
                                    <i class="fas fa-edit"></i> 编辑
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteCurrentPosition()">
                                    <i class="fas fa-trash"></i> 删除
                                </button>
                            </div>
                        </div>
                        <div class="panel-content" id="positionDetailContent">
                            <div class="text-center text-muted" style="padding: 60px 0;">
                                <i class="fas fa-briefcase" style="font-size: 48px; margin-bottom: 16px; opacity: 0.3;"></i>
                                <p>请从左侧选择一个岗位查看详细信息</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 新增/编辑岗位模态框 -->
    <div class="modal" id="positionModal">
        <div class="modal-content" style="max-width: 900px;">
            <div class="modal-header">
                <h3 id="positionModalTitle">新增岗位</h3>
                <button class="modal-close" onclick="closeModal('positionModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="positionForm" class="position-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>岗位名称 <span style="color: red;">*</span></label>
                            <input type="text" name="name" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label>岗位编码 <span style="color: red;">*</span></label>
                            <input type="text" name="code" class="form-input" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>岗位级别</label>
                            <select name="level" class="form-input">
                                <option value="1">一级岗位</option>
                                <option value="2">二级岗位</option>
                                <option value="3">三级岗位</option>
                                <option value="4">四级岗位</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>所属部门</label>
                            <select name="department" class="form-input">
                                <option value="">通用岗位</option>
                                <option value="总经理办公室">总经理办公室</option>
                                <option value="人事行政部">人事行政部</option>
                                <option value="财务部">财务部</option>
                                <option value="技术部">技术部</option>
                                <option value="销售部">销售部</option>
                                <option value="市场部">市场部</option>
                                <option value="客服部">客服部</option>
                                <option value="运维部">运维部</option>
                                <option value="质量管理部">质量管理部</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group-full">
                        <label>岗位职责</label>
                        <textarea name="responsibilities" class="form-input" rows="4" placeholder="描述岗位主要职责和工作内容"></textarea>
                    </div>
                    <div class="form-group-full">
                        <label>任职要求</label>
                        <textarea name="requirements" class="form-input" rows="3" placeholder="描述任职的技能要求、学历要求等"></textarea>
                    </div>
                    <div class="form-group-full">
                        <label>权限配置</label>
                        <div class="permission-tree" id="permissionTree">
                            <!-- 权限树将通过JavaScript渲染 -->
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" onclick="closeModal('positionModal')">取消</button>
                <button class="btn btn-primary" onclick="savePosition()">保存</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/mock-data.js"></script>
    <script>
        let positions = [];
        let selectedPositionId = null;
        let editingPositionId = null;

        // 权限数据
        const permissions = [
            {
                id: 'org',
                name: '组织架构管理',
                children: [
                    { id: 'org_dept', name: '部门管理' },
                    { id: 'org_emp', name: '员工管理' },
                    { id: 'org_pos', name: '岗位管理' },
                    { id: 'org_role', name: '角色权限' }
                ]
            },
            {
                id: 'crm',
                name: '客户关系管理',
                children: [
                    { id: 'crm_customer', name: '客户管理' },
                    { id: 'crm_follow', name: '跟进记录' },
                    { id: 'crm_transfer', name: '客户交接' }
                ]
            },
            {
                id: 'product',
                name: '商品管理',
                children: [
                    { id: 'product_category', name: '类目管理' },
                    { id: 'product_list', name: '商品列表' },
                    { id: 'product_inventory', name: '库存管理' }
                ]
            },
            {
                id: 'order',
                name: '订单管理',
                children: [
                    { id: 'order_list', name: '订单列表' },
                    { id: 'order_create', name: '订单创建' },
                    { id: 'order_audit', name: '订单审核' }
                ]
            },
            {
                id: 'support',
                name: '客服中心',
                children: [
                    { id: 'support_ticket', name: '工单管理' },
                    { id: 'support_knowledge', name: '知识库' }
                ]
            },
            {
                id: 'ops',
                name: '运维管理',
                children: [
                    { id: 'ops_task', name: '任务管理' },
                    { id: 'ops_schedule', name: '日程管理' },
                    { id: 'ops_report', name: '报表中心' }
                ]
            }
        ];

        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializePage();
            initializePositions();
            renderPositionList();
            renderPermissionTree();
        });

        function initializePositions() {
            // 初始化岗位数据
            positions = [
                {
                    id: 1,
                    name: '总经理',
                    code: 'CEO',
                    level: 1,
                    department: '总经理办公室',
                    responsibilities: '全面负责公司经营管理，制定公司发展战略和经营方针',
                    requirements: '本科以上学历，10年以上企业管理经验',
                    permissions: ['org', 'crm', 'product', 'order', 'support', 'ops'],
                    employeeCount: 1
                },
                {
                    id: 2,
                    name: '部门经理',
                    code: 'DEPT_MGR',
                    level: 2,
                    department: '',
                    responsibilities: '负责部门日常管理，制定部门工作计划，协调部门内外工作',
                    requirements: '本科以上学历，5年以上管理经验',
                    permissions: ['org_dept', 'org_emp', 'crm', 'order_list'],
                    employeeCount: 3
                },
                {
                    id: 3,
                    name: '技术主管',
                    code: 'TECH_LEAD',
                    level: 2,
                    department: '技术部',
                    responsibilities: '负责技术团队管理，技术方案设计，代码审核',
                    requirements: '本科以上学历，3年以上技术管理经验，精通主流技术栈',
                    permissions: ['org_emp', 'product', 'ops'],
                    employeeCount: 2
                },
                {
                    id: 4,
                    name: '销售专员',
                    code: 'SALES_SPEC',
                    level: 3,
                    department: '销售部',
                    responsibilities: '负责客户开发维护，销售业绩完成，客户关系管理',
                    requirements: '大专以上学历，有销售经验，沟通能力强',
                    permissions: ['crm', 'order_list', 'order_create'],
                    employeeCount: 2
                },
                {
                    id: 5,
                    name: '客服专员',
                    code: 'CS_SPEC',
                    level: 3,
                    department: '客服部',
                    responsibilities: '处理客户咨询投诉，维护客户关系，工单处理',
                    requirements: '大专以上学历，服务意识强，沟通能力佳',
                    permissions: ['crm_customer', 'support'],
                    employeeCount: 2
                }
            ];
        }

        function renderPositionList() {
            const container = document.getElementById('positionListContent');
            const searchTerm = document.getElementById('positionSearch').value.toLowerCase();
            
            const filteredPositions = positions.filter(position => 
                position.name.toLowerCase().includes(searchTerm) ||
                position.code.toLowerCase().includes(searchTerm)
            );

            container.innerHTML = filteredPositions.map(position => `
                <div class="position-item ${selectedPositionId === position.id ? 'active' : ''}" 
                     onclick="selectPosition(${position.id})">
                    <div class="position-name">${position.name}</div>
                    <div class="position-meta">
                        <span>编码：${position.code}</span>
                        <span class="position-level level-${position.level}">
                            ${position.level === 1 ? '一级岗位' : 
                              position.level === 2 ? '二级岗位' : 
                              position.level === 3 ? '三级岗位' : '四级岗位'}
                        </span>
                        <span>在职：${position.employeeCount}人</span>
                    </div>
                </div>
            `).join('');

            document.getElementById('positionCount').textContent = filteredPositions.length;
        }

        function selectPosition(id) {
            selectedPositionId = id;
            renderPositionList();
            renderPositionDetail();
        }

        function renderPositionDetail() {
            const position = positions.find(p => p.id === selectedPositionId);
            if (!position) return;

            document.getElementById('detailTitle').textContent = position.name;
            document.getElementById('detailActions').style.display = 'flex';

            const employees = window.mockData.employees.filter(emp => emp.position === position.name);

            document.getElementById('positionDetailContent').innerHTML = `
                <div class="position-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>岗位名称</label>
                            <div class="form-value">${position.name}</div>
                        </div>
                        <div class="form-group">
                            <label>岗位编码</label>
                            <div class="form-value">${position.code}</div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>岗位级别</label>
                            <div class="form-value">
                                <span class="position-level level-${position.level}">
                                    ${position.level === 1 ? '一级岗位' : 
                                      position.level === 2 ? '二级岗位' : 
                                      position.level === 3 ? '三级岗位' : '四级岗位'}
                                </span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>所属部门</label>
                            <div class="form-value">${position.department || '通用岗位'}</div>
                        </div>
                    </div>
                    <div class="form-group-full">
                        <label>岗位职责</label>
                        <div class="form-value">${position.responsibilities}</div>
                    </div>
                    <div class="form-group-full">
                        <label>任职要求</label>
                        <div class="form-value">${position.requirements}</div>
                    </div>
                    <div class="form-group-full">
                        <label>拥有权限</label>
                        <div class="form-value">
                            ${getPermissionNames(position.permissions).map(name => 
                                `<span class="badge badge-primary" style="margin-right: 8px; margin-bottom: 4px;">${name}</span>`
                            ).join('')}
                        </div>
                    </div>
                    <div class="employees-in-position">
                        <label>在职员工 (${employees.length}人)</label>
                        <div style="margin-top: 8px;">
                            ${employees.map(emp => `
                                <span class="employee-tag">
                                    ${emp.name} (${emp.employeeId})
                                    <i class="fas fa-times remove" onclick="removeEmployeeFromPosition('${emp.id}')"></i>
                                </span>
                            `).join('')}
                            ${employees.length === 0 ? '<span class="text-muted">暂无员工</span>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function getPermissionNames(permissionIds) {
            const names = [];
            permissions.forEach(perm => {
                if (permissionIds.includes(perm.id)) {
                    names.push(perm.name);
                }
                perm.children.forEach(child => {
                    if (permissionIds.includes(child.id)) {
                        names.push(child.name);
                    }
                });
            });
            return names;
        }

        function renderPermissionTree() {
            const container = document.getElementById('permissionTree');
            container.innerHTML = permissions.map(perm => `
                <div class="permission-node parent">
                    <input type="checkbox" id="perm_${perm.id}" value="${perm.id}" onchange="togglePermissionGroup('${perm.id}')">
                    <label for="perm_${perm.id}">${perm.name}</label>
                </div>
                ${perm.children.map(child => `
                    <div class="permission-node child">
                        <input type="checkbox" id="perm_${child.id}" value="${child.id}" data-parent="${perm.id}">
                        <label for="perm_${child.id}">${child.name}</label>
                    </div>
                `).join('')}
            `).join('');
        }

        function togglePermissionGroup(groupId) {
            const groupCheckbox = document.getElementById(`perm_${groupId}`);
            const childCheckboxes = document.querySelectorAll(`input[data-parent="${groupId}"]`);
            
            childCheckboxes.forEach(checkbox => {
                checkbox.checked = groupCheckbox.checked;
            });
        }

        function searchPositions() {
            renderPositionList();
        }

        function showAddPositionModal() {
            document.getElementById('positionModalTitle').textContent = '新增岗位';
            document.getElementById('positionForm').reset();
            editingPositionId = null;
            
            // 清空权限选择
            document.querySelectorAll('#permissionTree input[type="checkbox"]').forEach(cb => {
                cb.checked = false;
            });
            
            showModal('positionModal');
        }

        function editCurrentPosition() {
            if (!selectedPositionId) return;
            
            const position = positions.find(p => p.id === selectedPositionId);
            if (!position) return;

            document.getElementById('positionModalTitle').textContent = '编辑岗位';
            editingPositionId = selectedPositionId;

            const form = document.getElementById('positionForm');
            form.name.value = position.name;
            form.code.value = position.code;
            form.level.value = position.level;
            form.department.value = position.department;
            form.responsibilities.value = position.responsibilities;
            form.requirements.value = position.requirements;

            // 设置权限
            document.querySelectorAll('#permissionTree input[type="checkbox"]').forEach(cb => {
                cb.checked = position.permissions.includes(cb.value);
            });

            showModal('positionModal');
        }

        function savePosition() {
            const form = document.getElementById('positionForm');
            const formData = new FormData(form);
            
            if (!form.checkValidity()) {
                showMessage('请填写必填字段', 'error');
                return;
            }

            // 获取选中的权限
            const selectedPermissions = Array.from(document.querySelectorAll('#permissionTree input[type="checkbox"]:checked'))
                .map(cb => cb.value);

            const positionData = {
                name: formData.get('name'),
                code: formData.get('code'),
                level: parseInt(formData.get('level')),
                department: formData.get('department'),
                responsibilities: formData.get('responsibilities'),
                requirements: formData.get('requirements'),
                permissions: selectedPermissions,
                employeeCount: 0
            };

            if (editingPositionId) {
                // 编辑岗位
                const index = positions.findIndex(p => p.id === editingPositionId);
                if (index !== -1) {
                    positions[index] = { ...positions[index], ...positionData };
                    showMessage('岗位信息更新成功', 'success');
                }
            } else {
                // 新增岗位
                const newPosition = {
                    id: Date.now(),
                    ...positionData
                };
                positions.push(newPosition);
                showMessage('岗位添加成功', 'success');
            }

            closeModal('positionModal');
            renderPositionList();
            if (selectedPositionId) {
                renderPositionDetail();
            }
        }

        function deleteCurrentPosition() {
            if (!selectedPositionId) return;
            
            const position = positions.find(p => p.id === selectedPositionId);
            if (position.employeeCount > 0) {
                showMessage('该岗位下还有员工，无法删除', 'error');
                return;
            }

            if (confirm(`确定要删除岗位"${position.name}"吗？`)) {
                const index = positions.findIndex(p => p.id === selectedPositionId);
                if (index !== -1) {
                    positions.splice(index, 1);
                    selectedPositionId = null;
                    showMessage('岗位删除成功', 'success');
                    renderPositionList();
                    
                    // 清空详情面板
                    document.getElementById('detailTitle').textContent = '选择岗位查看详情';
                    document.getElementById('detailActions').style.display = 'none';
                    document.getElementById('positionDetailContent').innerHTML = `
                        <div class="text-center text-muted" style="padding: 60px 0;">
                            <i class="fas fa-briefcase" style="font-size: 48px; margin-bottom: 16px; opacity: 0.3;"></i>
                            <p>请从左侧选择一个岗位查看详细信息</p>
                        </div>
                    `;
                }
            }
        }

        function removeEmployeeFromPosition(employeeId) {
            if (confirm('确定要将该员工从此岗位移除吗？')) {
                showMessage('员工移除功能开发中...', 'info');
            }
        }

        function importPositions() {
            showMessage('批量导入功能开发中...', 'info');
        }

        function exportPositions() {
            showMessage('正在导出岗位配置...', 'info');
        }
    </script>
</body>
</html>
