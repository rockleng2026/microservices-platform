    <script>
        // 切换导航组展开/收起
        function toggleNavGroup(element) {
            const submenu = element.nextElementSibling;
            const arrow = element.querySelector('.nav-arrow');
            
            if (submenu && submenu.classList.contains('nav-submenu')) {
                submenu.classList.toggle('expanded');
                element.classList.toggle('expanded');
                
                if (submenu.classList.contains('expanded')) {
                    arrow.style.transform = 'rotate(90deg)';
                } else {
                    arrow.style.transform = 'rotate(0deg)';
                }
            }
        }
    </script>

                        { id: 'permission_manage', name: '权限管理', icon: '🛡️', description: '配置系统权限' },
                        { id: 'system_config', name: '系统配置', icon: '⚙️', description: '系统参数配置' },
                        { id: 'log_view', name: '日志查看', icon: '📋', description: '查看系统日志' }
                    ]
                }
            ];
        }
        
        // 加载角色数据
        function loadRoleData() {
            // 模拟角色数据
            roles = [
                {
                    id: 1,
                    name: '超级管理员',
                    description: '拥有系统所有权限',
                    userCount: 2,
                    permissions: permissions.flatMap(p => [p.id, ...p.children.map(c => c.id)])
                },
                {
                    id: 2,
                    name: '部门经理',
                    description: '部门管理和员工管理权限',
                    userCount: 5,
                    permissions: ['organization', 'dept_view', 'dept_edit', 'emp_view', 'emp_edit']
                },
                {
                    id: 3,
                    name: '销售经理',
                    description: '客户管理和订单管理权限',
                    userCount: 3,
                    permissions: ['crm', 'customer_view', 'customer_edit', 'follow_view', 'follow_create', 'order', 'order_view', 'order_create']
                },
                {
                    id: 4,
                    name: '销售员',
                    description: '基础客户和订单查看权限',
                    userCount: 12,
                    permissions: ['customer_view', 'follow_view', 'follow_create', 'order_view']
                },
                {
                    id: 5,
                    name: '客服专员',
                    description: '客户服务相关权限',
                    userCount: 8,
                    permissions: ['customer_view', 'follow_view', 'follow_create', 'order_view']
                },
                {
                    id: 6,
                    name: '仓库管理员',
                    description: '商品和库存管理权限',
                    userCount: 4,
                    permissions: ['product', 'product_view', 'product_edit', 'inventory_view', 'inventory_adjust']
                }
            ];
            
            filteredRoles = [...roles];
            renderRoleList();
        }
        
        // 渲染角色列表
        function renderRoleList() {
            const listContainer = document.getElementById('roleList');
            
            if (filteredRoles.length === 0) {
                listContainer.innerHTML = `
                    <div style="text-align: center; padding: 24px; color: #999;">
                        <i class="icon" style="font-size: 32px;">🔐</i><br>
                        暂无角色数据
                    </div>
                `;
                return;
            }
            
            listContainer.innerHTML = filteredRoles.map(role => `
                <div class="role-item ${currentRole === role.id ? 'active' : ''}" onclick="selectRole(${role.id})">
                    <div class="role-name">${role.name}</div>
                    <div class="role-meta">
                        <span>${role.description}</span>
                        <span>${role.userCount}人</span>
                    </div>
                    <div class="role-actions" onclick="event.stopPropagation()">
                        <button class="btn btn-icon btn-xs" onclick="editRole(${role.id})" title="编辑">
                            ✏️
                        </button>
                        <button class="btn btn-icon btn-xs" onclick="deleteRole(${role.id})" title="删除">
                            🗑️
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        // 搜索角色
        function searchRoles() {
            const keyword = document.getElementById('roleSearch').value.trim();
            
            if (keyword) {
                filteredRoles = roles.filter(role => 
                    role.name.includes(keyword) || role.description?.includes(keyword)
                );
            } else {
                filteredRoles = [...roles];
            }
            
            renderRoleList();
        }
        
        // 选择角色
        function selectRole(roleId) {
            currentRole = roleId;
            renderRoleList();
            loadPermissionConfig(roleId);
        }
        
        // 加载权限配置
        function loadPermissionConfig(roleId) {
            const role = roles.find(r => r.id === roleId);
            if (!role) return;
            
            const configHTML = `
                <div class="toolbar">
                    <div class="toolbar-left">
                        <strong>${role.name}</strong>
                        <span style="color: #666; margin-left: 8px;">${role.description}</span>
                    </div>
                    <div class="toolbar-right">
                        <button class="btn btn-default btn-sm" onclick="selectAllPermissions()">
                            <i class="icon">✅</i>
                            全选
                        </button>
                        <button class="btn btn-default btn-sm" onclick="clearAllPermissions()">
                            <i class="icon">❌</i>
                            清空
                        </button>
                        <button class="btn btn-primary btn-sm" onclick="savePermissions()">
                            <i class="icon">💾</i>
                            保存权限
                        </button>
                    </div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number">${role.permissions.length}</div>
                        <div class="stat-label">已授权权限</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${role.userCount}</div>
                        <div class="stat-label">角色用户数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${permissions.length}</div>
                        <div class="stat-label">权限分类数</div>
                    </div>
                </div>
                
                <div class="permission-tree">
                    ${renderPermissionTree(role.permissions)}
                </div>
            `;
            
            document.getElementById('permissionConfig').innerHTML = configHTML;
            
            // 展开所有权限分类
            setTimeout(() => {
                document.querySelectorAll('.category-header').forEach(header => {
                    header.click();
                });
            }, 100);
        }
        
        // 渲染权限树
        function renderPermissionTree(rolePermissions = []) {
            return permissions.map(category => {
                const categoryChecked = rolePermissions.includes(category.id);
                const childrenChecked = category.children.filter(child => rolePermissions.includes(child.id)).length;
                const allChildrenChecked = childrenChecked === category.children.length;
                const someChildrenChecked = childrenChecked > 0 && childrenChecked < category.children.length;
                
                return `
                    <div class="permission-category">
                        <div class="category-header" onclick="toggleCategory(this)">
                            <i class="category-icon">${category.icon}</i>
                            <span class="category-name">${category.name}</span>
                            <span class="category-toggle">▶</span>
                        </div>
                        <div class="permission-items">
                            <div class="permission-item">
                                <input type="checkbox" class="permission-checkbox category-checkbox" 
                                       value="${category.id}" 
                                       ${categoryChecked || allChildrenChecked ? 'checked' : ''}
                                       ${someChildrenChecked ? 'style="opacity: 0.5;"' : ''}
                                       onchange="toggleCategoryPermission('${category.id}')">
                                <i class="permission-icon">${category.icon}</i>
                                <span class="permission-name">全部${category.name}权限</span>
                                <span class="permission-description">包含所有子权限</span>
                            </div>
                            ${category.children.map(child => `
                                <div class="permission-item">
                                    <input type="checkbox" class="permission-checkbox child-checkbox" 
                                           value="${child.id}" 
                                           data-parent="${category.id}"
                                           ${rolePermissions.includes(child.id) ? 'checked' : ''}
                                           onchange="toggleChildPermission('${category.id}', '${child.id}')">
                                    <i class="permission-icon">${child.icon}</i>
                                    <span class="permission-name">${child.name}</span>
                                    <span class="permission-description">${child.description}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // 切换权限分类展开/收起
        function toggleCategory(header) {
            const items = header.nextElementSibling;
            const toggle = header.querySelector('.category-toggle');
            
            if (items.classList.contains('expanded')) {
                items.classList.remove('expanded');
                toggle.classList.remove('expanded');
            } else {
                items.classList.add('expanded');
                toggle.classList.add('expanded');
            }
        }
        
        // 切换分类权限
        function toggleCategoryPermission(categoryId) {
            const category = permissions.find(p => p.id === categoryId);
            const checkbox = document.querySelector(`input[value="${categoryId}"]`);
            const childCheckboxes = document.querySelectorAll(`input[data-parent="${categoryId}"]`);
            
            childCheckboxes.forEach(cb => {
                cb.checked = checkbox.checked;
            });
            
            updateRolePermissions();
        }
        
        // 切换子权限
        function toggleChildPermission(categoryId, childId) {
            const category = permissions.find(p => p.id === categoryId);
            const categoryCheckbox = document.querySelector(`input[value="${categoryId}"]`);
            const childCheckboxes = document.querySelectorAll(`input[data-parent="${categoryId}"]`);
            
            const checkedCount = Array.from(childCheckboxes).filter(cb => cb.checked).length;
            const totalCount = childCheckboxes.length;
            
            if (checkedCount === totalCount) {
                categoryCheckbox.checked = true;
                categoryCheckbox.style.opacity = '1';
            } else if (checkedCount === 0) {
                categoryCheckbox.checked = false;
                categoryCheckbox.style.opacity = '1';
            } else {
                categoryCheckbox.checked = false;
                categoryCheckbox.style.opacity = '0.5';
            }
            
            updateRolePermissions();
        }
        
        // 更新角色权限
        function updateRolePermissions() {
            if (!currentRole) return;
            
            const role = roles.find(r => r.id === currentRole);
            if (!role) return;
            
            const checkedPermissions = Array.from(document.querySelectorAll('.permission-checkbox:checked'))
                .map(cb => cb.value);
            
            role.permissions = checkedPermissions;
            
            // 更新统计数据
            const statNumber = document.querySelector('.stat-number');
            if (statNumber) {
                statNumber.textContent = checkedPermissions.length;
            }
        }
        
        // 全选权限
        function selectAllPermissions() {
            document.querySelectorAll('.permission-checkbox').forEach(cb => {
                cb.checked = true;
                cb.style.opacity = '1';
            });
            updateRolePermissions();
        }
        
        // 清空权限
        function clearAllPermissions() {
            document.querySelectorAll('.permission-checkbox').forEach(cb => {
                cb.checked = false;
                cb.style.opacity = '1';
            });
            updateRolePermissions();
        }
        
        // 保存权限
        function savePermissions() {
            if (!currentRole) {
                Message.warning('请先选择角色');
                return;
            }
            
            const role = roles.find(r => r.id === currentRole);
            if (!role) return;
            
            console.log('Save permissions for role:', role.name, role.permissions);
            Message.success('权限保存成功');
        }
        
        // 新增角色
        function addRole() {
            alert('新增角色功能开发中...');
        }
        
        // 编辑角色
        function editRole(roleId) {
            alert(`编辑角色 ID: ${roleId} 功能开发中...`);
        }
        
        // 删除角色
        function deleteRole(roleId) {
            const role = roles.find(r => r.id === roleId);
            if (!role) return;
            
            if (role.userCount > 0) {
                Message.error('该角色下还有用户，无法删除');
                return;
            }
            
            Utils.confirm('确认删除', `确定要删除角色"${role.name}"吗？`, function() {
                console.log('Delete role:', roleId);
                Message.success('角色删除成功');
                
                // 从数组中移除
                const index = roles.findIndex(r => r.id === roleId);
                if (index > -1) {
                    roles.splice(index, 1);
                }
                
                loadRoleData();
                
                if (currentRole === roleId) {
                    currentRole = null;
                    document.getElementById('permissionConfig').innerHTML = `
                        <div class="empty-state">
                            <i class="icon" style="font-size: 48px; color: #ccc;">🔐</i>
                            <p style="color: #999; margin-top: 16px;">请选择左侧角色配置权限</p>
                        </div>
                    `;
                }
            });
        }
        
        // 显示角色模态框
        function showRoleModal(title, data, callback) {
            const modalHTML = `
                <div class="modal-header">
                    <h3 class="modal-title">${title}</h3>
                </div>
                <div class="modal-body">
                    <form id="roleForm" class="form">
                        <div class="form-group">
                            <label class="form-label required">角色名称</label>
                            <input type="text" name="name" class="form-control" value="${data.name || ''}" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">角色描述</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="请输入角色描述">${data.description || ''}</textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">角色状态</label>
                                <select name="status" class="form-control">
                                    <option value="1" ${(data.status || 1) == 1 ? 'selected' : ''}>启用</option>
                                    <option value="0" ${data.status == 0 ? 'selected' : ''}>禁用</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">排序权重</label>
                                <input type="number" name="sort" class="form-control" value="${data.sort || 0}" min="0">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" onclick="Modal.close()">取消</button>
                    <button type="button" class="btn btn-primary" onclick="submitRoleForm()">保存</button>
                </div>
            `;
            
            Modal.show(modalHTML);
            
            window.submitRoleForm = function() {
                const form = document.getElementById('roleForm');
                const formData = new FormData(form);
                const submitData = Object.fromEntries(formData.entries());
                
                // 验证表单
                if (!submitData.name.trim()) {
                    Message.error('请输入角色名称');
                    return;
                }
                
                Modal.close();
                callback(submitData);
            };
        }
    </script>
</body>
