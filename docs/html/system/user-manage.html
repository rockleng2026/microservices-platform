<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - Portal 3.0</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/navigation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .user-manage-page {
            padding: 20px;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .page-header {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: #1a1a1a;
        }

        .header-left p {
            color: #666;
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--card-color, #1890ff);
        }

        .stat-card.success::before { background: #52c41a; }
        .stat-card.warning::before { background: #faad14; }
        .stat-card.danger::before { background: #f5222d; }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin: 0 0 8px 0;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            margin: 0;
        }

        .stat-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 28px;
            color: var(--card-color, #1890ff);
            opacity: 0.3;
        }

        .user-content {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #e8e8e8;
        }

        .toolbar-left {
            display: flex;
            gap: 12px;
        }

        .toolbar-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-input {
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            width: 200px;
        }

        .filter-select {
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            min-width: 120px;
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
        }

        .user-table th {
            background: #fafafa;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 1px solid #e8e8e8;
        }

        .user-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }

        .user-table tr:hover {
            background: #fafafa;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e8e8e8;
        }

        .user-details h4 {
            margin: 0 0 4px 0;
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .user-details p {
            margin: 0;
            font-size: 12px;
            color: #666;
        }

        .status-tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-active {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }

        .status-inactive {
            background: #fff2e8;
            color: #fa8c16;
            border: 1px solid #ffd591;
        }

        .status-locked {
            background: #fff1f0;
            color: #f5222d;
            border: 1px solid #ffa39e;
        }

        .role-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .role-tag {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 500;
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-primary {
            background: #1890ff;
            color: white;
        }

        .btn-primary:hover {
            background: #40a9ff;
        }

        .btn-success {
            background: #52c41a;
            color: white;
        }

        .btn-success:hover {
            background: #73d13d;
        }

        .btn-warning {
            background: #faad14;
            color: white;
        }

        .btn-warning:hover {
            background: #ffc53d;
        }

        .btn-danger {
            background: #f5222d;
            color: white;
        }

        .btn-danger:hover {
            background: #ff4d4f;
        }

        .btn-default {
            background: white;
            color: #333;
            border: 1px solid #d9d9d9;
        }

        .btn-default:hover {
            border-color: #40a9ff;
            color: #1890ff;
        }

        .btn-link {
            background: none;
            border: none;
            color: #1890ff;
            padding: 4px 8px;
            text-decoration: none;
        }

        .btn-link:hover {
            color: #40a9ff;
            background: #f0f8ff;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-top: 1px solid #e8e8e8;
        }

        .pagination-info {
            color: #666;
            font-size: 14px;
        }

        .pagination-controls {
            display: flex;
            gap: 8px;
        }

        .pagination-btn {
            padding: 6px 12px;
            border: 1px solid #d9d9d9;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .pagination-btn:hover:not(:disabled) {
            border-color: #40a9ff;
            color: #1890ff;
        }

        .pagination-btn:disabled {
            background: #f5f5f5;
            color: #ccc;
            cursor: not-allowed;
        }

        .pagination-btn.active {
            background: #1890ff;
            color: white;
            border-color: #1890ff;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            width: 600px;
            max-width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            color: #999;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #e8e8e8;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .form-section {
            margin-bottom: 24px;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin: 0 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #e8e8e8;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }

        .form-label.required::after {
            content: '*';
            color: #f5222d;
            margin-left: 4px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #40a9ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
            outline: none;
        }

        .avatar-upload {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px dashed #d9d9d9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .upload-btn {
            padding: 8px 16px;
            border: 1px solid #d9d9d9;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .role-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .role-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .role-item:hover {
            border-color: #40a9ff;
            background: #f0f8ff;
        }

        .role-item.selected {
            border-color: #1890ff;
            background: #e6f7ff;
        }

        .role-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .user-manage-page {
                padding: 10px;
            }
            
            .page-header {
                flex-direction: column;
                gap: 16px;
                align-items: stretch;
            }
            
            .toolbar {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }
            
            .stats-cards {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .role-selector {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- 左侧导航 -->
        <aside class="app-sidebar" id="app-sidebar">
            <!-- 导航内容将由navigation.js动态生成 -->
        </aside>

        <!-- 头部区域 -->
        <header class="app-header">
            <div class="header-left">
                <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
                <div class="breadcrumb">
                    <span class="breadcrumb-item">Portal 3.0</span>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-item">系统管理</span>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-item">用户管理</span>
                </div>
            </div>
            
            <div class="header-actions">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" placeholder="搜索功能...">
                </div>
                
                <button class="notification-btn">
                    <span>🔔</span>
                    <span class="notification-badge">5</span>
                </button>
                
                <div class="user-menu">
                    <div class="user-avatar">管</div>
                    <span>管理员</span>
                </div>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="app-main">
                <!-- 页面标题 -->
                <div class="page-header">
                    <div class="header-left">
                        <h1>用户管理</h1>
                        <p>管理系统用户账号、角色权限和状态设置</p>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-success" onclick="addUser()">
                            <i class="fas fa-plus"></i>
                            新增用户
                        </button>
                        <button class="btn btn-default" onclick="exportUsers()">
                            <i class="fas fa-download"></i>
                            导出用户
                        </button>
                        <button class="btn btn-default" onclick="importUsers()">
                            <i class="fas fa-upload"></i>
                            批量导入
                        </button>
                    </div>
                </div>

                <!-- 统计卡片 -->
                <div class="stats-cards">
                    <div class="stat-card">
                        <div class="stat-number">156</div>
                        <div class="stat-label">总用户数</div>
                        <i class="fas fa-users stat-icon"></i>
                    </div>
                    <div class="stat-card success">
                        <div class="stat-number">142</div>
                        <div class="stat-label">活跃用户</div>
                        <i class="fas fa-user-check stat-icon" style="color: #52c41a;"></i>
                    </div>
                    <div class="stat-card warning">
                        <div class="stat-number">12</div>
                        <div class="stat-label">禁用用户</div>
                        <i class="fas fa-user-times stat-icon" style="color: #faad14;"></i>
                    </div>
                    <div class="stat-card danger">
                        <div class="stat-number">2</div>
                        <div class="stat-label">锁定用户</div>
                        <i class="fas fa-user-lock stat-icon" style="color: #f5222d;"></i>
                    </div>
                </div>

                <!-- 用户列表 -->
                <div class="user-content">
                    <!-- 工具栏 -->
                    <div class="toolbar">
                        <div class="toolbar-left">
                            <button class="btn btn-primary" onclick="batchActivate()">批量激活</button>
                            <button class="btn btn-warning" onclick="batchDeactivate()">批量禁用</button>
                            <button class="btn btn-danger" onclick="batchDelete()">批量删除</button>
                        </div>
                        <div class="toolbar-right">
                            <select class="filter-select" id="statusFilter" onchange="filterByStatus()">
                                <option value="">全部状态</option>
                                <option value="active">活跃</option>
                                <option value="inactive">禁用</option>
                                <option value="locked">锁定</option>
                            </select>
                            <select class="filter-select" id="roleFilter" onchange="filterByRole()">
                                <option value="">全部角色</option>
                                <option value="admin">管理员</option>
                                <option value="manager">部门主管</option>
                                <option value="employee">普通员工</option>
                            </select>
                            <input type="text" class="search-input" placeholder="搜索用户..." 
                                   id="searchInput" oninput="searchUsers()">
                        </div>
                    </div>

                    <!-- 用户表格 -->
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>
                                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                                </th>
                                <th>用户信息</th>
                                <th>联系方式</th>
                                <th>角色</th>
                                <th>状态</th>
                                <th>最后登录</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <!-- 用户数据将由 JavaScript 动态生成 -->
                        </tbody>
                    </table>

                    <!-- 分页 -->
                    <div class="pagination">
                        <div class="pagination-info">
                            显示 1-10 条，共 156 条记录
                        </div>
                        <div class="pagination-controls">
                            <button class="pagination-btn" disabled>
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <button class="pagination-btn active">1</button>
                            <button class="pagination-btn">2</button>
                            <button class="pagination-btn">3</button>
                            <button class="pagination-btn">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- 底部页脚 -->
        <footer class="app-footer">
            <div class="footer-content">
                © 2024 Portal 3.0 企业管理平台 | 
                <a href="#" style="color: #1890ff; text-decoration: none;">技术支持</a> | 
                <a href="#" style="color: #1890ff; text-decoration: none;">帮助文档</a> | 
                <span style="color: #999;">版本 v3.0.1</span>
            </div>
        </footer>
    </div>

    <!-- 新增/编辑用户模态框 -->
    <div class="modal" id="userModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">新增用户</h3>
                <button class="modal-close" onclick="closeUserModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <div class="form-section">
                        <h4 class="section-title">基本信息</h4>
                        <div class="form-group">
                            <label class="form-label">用户头像</label>
                            <div class="avatar-upload">
                                <div class="avatar-preview">
                                    <img src="https://via.placeholder.com/80x80" alt="头像" id="avatarPreview">
                                </div>
                                <button type="button" class="upload-btn">
                                    <i class="fas fa-upload"></i>
                                    上传头像
                                </button>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label required">用户名</label>
                                <input type="text" class="form-input" id="username" placeholder="请输入用户名">
                            </div>
                            <div class="form-group">
                                <label class="form-label required">真实姓名</label>
                                <input type="text" class="form-input" id="realName" placeholder="请输入真实姓名">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label required">手机号</label>
                                <input type="tel" class="form-input" id="phone" placeholder="请输入手机号">
                            </div>
                            <div class="form-group">
                                <label class="form-label">邮箱</label>
                                <input type="email" class="form-input" id="email" placeholder="请输入邮箱">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label required">密码</label>
                                <input type="password" class="form-input" id="password" placeholder="请输入密码">
                            </div>
                            <div class="form-group">
                                <label class="form-label required">确认密码</label>
                                <input type="password" class="form-input" id="confirmPassword" placeholder="请确认密码">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h4 class="section-title">角色分配</h4>
                        <div class="role-selector">
                            <div class="role-item">
                                <input type="checkbox" id="role_admin" value="admin">
                                <div>
                                    <h5>系统管理员</h5>
                                    <p>拥有系统所有权限</p>
                                </div>
                            </div>
                            <div class="role-item">
                                <input type="checkbox" id="role_manager" value="manager">
                                <div>
                                    <h5>部门主管</h5>
                                    <p>管理本部门事务</p>
                                </div>
                            </div>
                            <div class="role-item">
                                <input type="checkbox" id="role_employee" value="employee">
                                <div>
                                    <h5>普通员工</h5>
                                    <p>基础业务权限</p>
                                </div>
                            </div>
                            <div class="role-item">
                                <input type="checkbox" id="role_guest" value="guest">
                                <div>
                                    <h5>访客</h5>
                                    <p>仅查看权限</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h4 class="section-title">账号设置</h4>
                        <div class="checkbox-item">
                            <input type="checkbox" id="userEnabled" checked>
                            <label for="userEnabled">启用账号</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="passwordExpire">
                            <label for="passwordExpire">首次登录强制修改密码</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="emailNotify" checked>
                            <label for="emailNotify">邮件通知</label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" onclick="closeUserModal()">取消</button>
                <button class="btn btn-primary" onclick="saveUser()">保存</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/navigation.js"></script>
    <script>
        // 用户数据
        const userData = [
            {
                id: 1,
                username: 'admin',
                realName: '系统管理员',
                phone: '13800138001',
                email: 'admin@portal.com',
                avatar: 'https://via.placeholder.com/40x40/1890ff/white?text=A',
                roles: ['admin'],
                status: 'active',
                lastLogin: '2024-01-15 09:30:00',

                roles: ['guest'],
                status: 'locked',
                lastLogin: '2024-01-08 10:15:00',
                createdAt: '2024-01-05 09:30:00'
            }
        ];

        let editingUserId = null;
        let selectedUserIds = new Set();

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化导航
            const navigation = new Navigation();
            navigation.init();
            navigation.setActiveMenu('system', 'user-manage');
            
            // 渲染用户表格
            renderUserTable();
        });

        // 渲染用户表格
        function renderUserTable(data = userData) {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            data.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <input type="checkbox" value="${user.id}" onchange="toggleUserSelection(${user.id})">
                    </td>
                    <td>
                        <div class="user-info">
                            <img src="${user.avatar}" alt="${user.realName}" class="user-avatar">
                            <div class="user-details">
                                <h4>${user.realName}</h4>
                                <p>@${user.username}</p>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div>${user.phone}</div>
                        <div style="font-size: 12px; color: #666;">${user.email}</div>
                    </td>
                    <td>
                        <div class="role-tags">
                            ${user.roles.map(role => `
                                <span class="role-tag">${getRoleText(role)}</span>
                            `).join('')}
                        </div>
                    </td>
                    <td>
                        <span class="status-tag status-${user.status}">
                            ${getStatusText(user.status)}
                        </span>
                    </td>
                    <td>${user.lastLogin}</td>
                    <td>${user.createdAt}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-link" onclick="editUser(${user.id})">
                                <i class="fas fa-edit"></i>
                                编辑
                            </button>
                            <button class="btn-link" onclick="resetPassword(${user.id})">
                                <i class="fas fa-key"></i>
                                重置密码
                            </button>
                            <button class="btn-link" onclick="toggleUserStatus(${user.id})" 
                                    style="color: ${user.status === 'active' ? '#faad14' : '#52c41a'};">
                                <i class="fas fa-${user.status === 'active' ? 'pause' : 'play'}"></i>
                                ${user.status === 'active' ? '禁用' : '启用'}
                            </button>
                            <button class="btn-link" onclick="deleteUser(${user.id})" style="color: #f5222d;">
                                <i class="fas fa-trash"></i>
                                删除
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // 获取角色文本
        function getRoleText(role) {
            const roleMap = {
                'admin': '管理员',
                'manager': '主管',
                'employee': '员工',
                'guest': '访客'
            };
            return roleMap[role] || role;
        }

        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'active': '活跃',
                'inactive': '禁用',
                'locked': '锁定'
            };
            return statusMap[status] || status;
        }

        // 切换用户选择
        function toggleUserSelection(userId) {
            if (selectedUserIds.has(userId)) {
                selectedUserIds.delete(userId);
            } else {
                selectedUserIds.add(userId);
            }
        }

        // 全选/取消全选
        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('#userTableBody input[type="checkbox"]');
            
            checkboxes.forEach(checkbox => {
                checkbox.checked = selectAll.checked;
                const userId = parseInt(checkbox.value);
                if (selectAll.checked) {
                    selectedUserIds.add(userId);
                } else {
                    selectedUserIds.delete(userId);
                }
            });
        }

        // 新增用户
        function addUser() {
            editingUserId = null;
            document.getElementById('modalTitle').textContent = '新增用户';
            document.getElementById('userForm').reset();
            document.getElementById('userEnabled').checked = true;
            document.getElementById('emailNotify').checked = true;
            document.getElementById('userModal').classList.add('show');
        }

        // 编辑用户
        function editUser(userId) {
            const user = userData.find(u => u.id === userId);
            if (!user) return;

            editingUserId = userId;
            document.getElementById('modalTitle').textContent = '编辑用户';
            
            // 填充表单
            document.getElementById('username').value = user.username;
            document.getElementById('realName').value = user.realName;
            document.getElementById('phone').value = user.phone;
            document.getElementById('email').value = user.email;
            document.getElementById('avatarPreview').src = user.avatar;
            document.getElementById('userEnabled').checked = user.status === 'active';
            
            // 设置角色
            user.roles.forEach(role => {
                const checkbox = document.getElementById(`role_${role}`);
                if (checkbox) checkbox.checked = true;
            });
            
            document.getElementById('userModal').classList.add('show');
        }

        // 保存用户
        function saveUser() {
            const username = document.getElementById('username').value;
            const realName = document.getElementById('realName').value;
            const phone = document.getElementById('phone').value;
            
            if (!username || !realName || !phone) {
                alert('请填写必填项');
                return;
            }

            // 收集角色
            const roles = [];
            ['admin', 'manager', 'employee', 'guest'].forEach(role => {
                const checkbox = document.getElementById(`role_${role}`);
                if (checkbox && checkbox.checked) {
                    roles.push(role);
                }
            });

            const userObj = {
                id: editingUserId || Date.now(),
                username: username,
                realName: realName,
                phone: phone,
                email: document.getElementById('email').value,
                avatar: document.getElementById('avatarPreview').src,
                roles: roles,
                status: document.getElementById('userEnabled').checked ? 'active' : 'inactive',
                lastLogin: editingUserId ? userData.find(u => u.id === editingUserId).lastLogin : '-',
                createdAt: editingUserId ? userData.find(u => u.id === editingUserId).createdAt : new Date().toLocaleString()
            };

            if (editingUserId) {
                // 编辑模式
                const index = userData.findIndex(u => u.id === editingUserId);
                if (index !== -1) {
                    userData[index] = userObj;
                }
            } else {
                // 新增模式
                userData.push(userObj);
            }

            closeUserModal();
            renderUserTable();
            alert('保存成功！');
        }

        // 关闭用户模态框
        function closeUserModal() {
            document.getElementById('userModal').classList.remove('show');
            editingUserId = null;
        }

        // 重置密码
        function resetPassword(userId) {
            if (confirm('确定要重置该用户的密码吗？新密码将发送到用户邮箱。')) {
                alert(`已重置用户 ${userId} 的密码`);
            }
        }

        // 切换用户状态
        function toggleUserStatus(userId) {
            const user = userData.find(u => u.id === userId);
            if (user) {
                const newStatus = user.status === 'active' ? 'inactive' : 'active';
                const action = newStatus === 'active' ? '启用' : '禁用';
                
                if (confirm(`确定要${action}该用户吗？`)) {
                    user.status = newStatus;
                    renderUserTable();
                    alert(`用户已${action}`);
                }
            }
        }

        // 删除用户
        function deleteUser(userId) {
            if (confirm('确定要删除该用户吗？删除后不可恢复！')) {
                const index = userData.findIndex(u => u.id === userId);
                if (index !== -1) {
                    userData.splice(index, 1);
                    renderUserTable();
                    alert('删除成功！');
                }
            }
        }

        // 批量操作
        function batchActivate() {
            if (selectedUserIds.size === 0) {
                alert('请先选择用户');
                return;
            }
            
            if (confirm(`确定要批量激活 ${selectedUserIds.size} 个用户吗？`)) {
                selectedUserIds.forEach(userId => {
                    const user = userData.find(u => u.id === userId);
                    if (user) user.status = 'active';
                });
                renderUserTable();
                selectedUserIds.clear();
                document.getElementById('selectAll').checked = false;
                alert('批量激活成功！');
            }
        }

        function batchDeactivate() {
            if (selectedUserIds.size === 0) {
                alert('请先选择用户');
                return;
            }
            
            if (confirm(`确定要批量禁用 ${selectedUserIds.size} 个用户吗？`)) {
                selectedUserIds.forEach(userId => {
                    const user = userData.find(u => u.id === userId);
                    if (user) user.status = 'inactive';
                });
                renderUserTable();
                selectedUserIds.clear();
                document.getElementById('selectAll').checked = false;
                alert('批量禁用成功！');
            }
        }

        function batchDelete() {
            if (selectedUserIds.size === 0) {
                alert('请先选择用户');
                return;
            }
            
            if (confirm(`确定要批量删除 ${selectedUserIds.size} 个用户吗？删除后不可恢复！`)) {
                selectedUserIds.forEach(userId => {
                    const index = userData.findIndex(u => u.id === userId);
                    if (index !== -1) {
                        userData.splice(index, 1);
                    }
                });
                renderUserTable();
                selectedUserIds.clear();
                document.getElementById('selectAll').checked = false;
                alert('批量删除成功！');
            }
        }

        // 筛选和搜索
        function filterByStatus() {
            applyFilters();
        }

        function filterByRole() {
            applyFilters();
        }

        function searchUsers() {
            applyFilters();
        }

        function applyFilters() {
            const status = document.getElementById('statusFilter').value;
            const role = document.getElementById('roleFilter').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filteredData = userData;
            
            if (status) {
                filteredData = filteredData.filter(user => user.status === status);
            }
            
            if (role) {
                filteredData = filteredData.filter(user => user.roles.includes(role));
            }
            
            if (searchTerm) {
                filteredData = filteredData.filter(user => 
                    user.username.toLowerCase().includes(searchTerm) ||
                    user.realName.toLowerCase().includes(searchTerm) ||
                    user.phone.includes(searchTerm) ||
                    user.email.toLowerCase().includes(searchTerm)
                );
            }
            
            renderUserTable(filteredData);
        }

        // 导出用户
        function exportUsers() {
            alert('导出用户数据');
        }

        // 批量导入
        function importUsers() {
            alert('批量导入用户');
        }

        // 点击模态框外部关闭
        document.getElementById('userModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeUserModal();
            }
        });
    </script>
