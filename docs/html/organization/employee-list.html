<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理 - Portal 3.0</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .employee-filters {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .filter-row {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 180px;
        }
        
        .employee-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .employee-table-container {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .employee-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .employee-table th,
        .employee-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .employee-table th {
            background: #fafafa;
            font-weight: 500;
            color: #666;
        }
        
        .employee-table tr:hover {
            background: #f9f9f9;
        }
        
        .employee-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
        }
        
        .employee-name-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .employee-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-active { background: #f6ffed; color: #52c41a; }
        .status-inactive { background: #fff2e8; color: #fa8c16; }
        .status-suspended { background: #fff1f0; color: #f5222d; }
        
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .action-btn.edit {
            background: #e6f7ff;
            color: #1890ff;
        }
        
        .action-btn.delete {
            background: #fff1f0;
            color: #f5222d;
        }
        
        .action-btn:hover {
            opacity: 0.8;
        }
        
        .employee-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }
        
        .form-group-full {
            grid-column: 1 / -1;
        }
        
        .batch-actions {
            padding: 16px;
            background: #f0f2f5;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .batch-actions.active {
            display: block;
        }
        
        .selected-count {
            color: var(--primary-color);
            font-weight: 500;
            margin-right: 16px;
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Portal 3.0</h2>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-title">组织架构</div>
                    <a href="department-tree.html" class="nav-link">
                        <i class="fas fa-sitemap"></i> 部门管理
                    </a>
                    <a href="employee-list.html" class="nav-link active">
                        <i class="fas fa-users"></i> 员工管理
                    </a>
                    <a href="position-manage.html" class="nav-link">
                        <i class="fas fa-briefcase"></i> 岗位管理
                    </a>
                    <a href="role-permission.html" class="nav-link">
                        <i class="fas fa-shield-alt"></i> 角色权限
                    </a>
                </div>
                <div class="nav-section">
                    <div class="nav-title">客户管理</div>
                    <a href="../crm/customer-dashboard.html" class="nav-link">
                        <i class="fas fa-chart-pie"></i> CRM工作台
                    </a>
                    <a href="../crm/customer-list.html" class="nav-link">
                        <i class="fas fa-address-book"></i> 客户列表
                    </a>
                </div>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部导航 -->
            <header class="main-header">
                <div class="header-left">
                    <button class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="breadcrumb">
                        <span>组织架构</span>
                        <i class="fas fa-chevron-right"></i>
                        <span>员工管理</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="搜索员工...">
                    </div>
                    <div class="user-menu">
                        <img src="https://via.placeholder.com/32" alt="用户头像" class="user-avatar">
                        <span>管理员</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </header>

            <!-- 页面内容 -->
            <div class="page-content">
                <div class="page-header">
                    <h1>员工管理</h1>
                    <p>管理公司所有员工信息，包括基本信息、部门归属、岗位设置等</p>
                </div>

                <!-- 筛选器 -->
                <div class="employee-filters">
                    <div class="filter-row">
                        <div class="filter-item">
                            <label>部门</label>
                            <select id="departmentFilter" class="form-input">
                                <option value="">全部部门</option>
                                <option value="总经理办公室">总经理办公室</option>
                                <option value="人事行政部">人事行政部</option>
                                <option value="财务部">财务部</option>
                                <option value="技术部">技术部</option>
                                <option value="销售部">销售部</option>
                                <option value="市场部">市场部</option>
                                <option value="客服部">客服部</option>
                                <option value="运维部">运维部</option>
                                <option value="质量管理部">质量管理部</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>岗位</label>
                            <select id="positionFilter" class="form-input">
                                <option value="">全部岗位</option>
                                <option value="总经理">总经理</option>
                                <option value="部门经理">部门经理</option>
                                <option value="主管">主管</option>
                                <option value="专员">专员</option>
                                <option value="助理">助理</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>在职状态</label>
                            <select id="statusFilter" class="form-input">
                                <option value="">全部状态</option>
                                <option value="在职">在职</option>
                                <option value="离职">离职</option>
                                <option value="停职">停职</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>员工姓名</label>
                            <input type="text" id="nameFilter" class="form-input" placeholder="输入员工姓名">
                        </div>
                        <div class="filter-item">
                            <label>工号</label>
                            <input type="text" id="employeeIdFilter" class="form-input" placeholder="输入工号">
                        </div>
                        <div class="filter-item">
                            <label>&nbsp;</label>
                            <div style="display: flex; gap: 8px;">
                                <button class="btn btn-primary" onclick="filterEmployees()">
                                    <i class="fas fa-search"></i> 查询
                                </button>
                                <button class="btn btn-default" onclick="resetFilters()">
                                    <i class="fas fa-undo"></i> 重置
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 批量操作栏 -->
                <div class="batch-actions" id="batchActions">
                    <span class="selected-count">已选择 <span id="selectedCount">0</span> 个员工</span>
                    <button class="btn btn-primary" onclick="batchExport()">
                        <i class="fas fa-download"></i> 批量导出
                    </button>
                    <button class="btn btn-warning" onclick="batchUpdate()">
                        <i class="fas fa-edit"></i> 批量编辑
                    </button>
                    <button class="btn btn-danger" onclick="batchDelete()">
                        <i class="fas fa-trash"></i> 批量删除
                    </button>
                </div>

                <!-- 操作按钮 -->
                <div class="employee-actions">
                    <button class="btn btn-primary" onclick="showAddModal()">
                        <i class="fas fa-plus"></i> 新增员工
                    </button>
                    <button class="btn btn-success" onclick="importEmployees()">
                        <i class="fas fa-upload"></i> 批量导入
                    </button>
                    <button class="btn btn-default" onclick="exportEmployees()">
                        <i class="fas fa-download"></i> 导出Excel
                    </button>
                </div>

                <!-- 员工表格 -->
                <div class="employee-table-container">
                    <table class="employee-table">
                        <thead>
                            <tr>
                                <th>
                                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                                </th>
                                <th>员工信息</th>
                                <th>工号</th>
                                <th>部门</th>
                                <th>岗位</th>
                                <th>电话</th>
                                <th>邮箱</th>
                                <th>入职日期</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody">
                            <!-- 员工数据将通过JavaScript渲染 -->
                        </tbody>
                    </table>
                </div>

                <!-- 分页器 -->
                <div class="pagination-container">
                    <div class="pagination-info">
                        共 <span id="totalCount">0</span> 条记录，每页显示 
                        <select id="pageSize" onchange="changePageSize()" class="form-input" style="width: auto; display: inline-block; margin: 0 8px;">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select> 
                        条
                    </div>
                    <div class="pagination" id="pagination">
                        <!-- 分页按钮将通过JavaScript渲染 -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 新增/编辑员工模态框 -->
    <div class="modal" id="employeeModal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h3 id="modalTitle">新增员工</h3>
                <button class="modal-close" onclick="closeModal('employeeModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="employeeForm" class="employee-form">
                    <div class="form-group">
                        <label>姓名 <span style="color: red;">*</span></label>
                        <input type="text" name="name" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>工号 <span style="color: red;">*</span></label>
                        <input type="text" name="employeeId" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>部门 <span style="color: red;">*</span></label>
                        <select name="department" class="form-input" required>
                            <option value="">请选择部门</option>
                            <option value="总经理办公室">总经理办公室</option>
                            <option value="人事行政部">人事行政部</option>
                            <option value="财务部">财务部</option>
                            <option value="技术部">技术部</option>
                            <option value="销售部">销售部</option>
                            <option value="市场部">市场部</option>
                            <option value="客服部">客服部</option>
                            <option value="运维部">运维部</option>
                            <option value="质量管理部">质量管理部</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>岗位 <span style="color: red;">*</span></label>
                        <select name="position" class="form-input" required>
                            <option value="">请选择岗位</option>
                            <option value="总经理">总经理</option>
                            <option value="部门经理">部门经理</option>
                            <option value="主管">主管</option>
                            <option value="专员">专员</option>
                            <option value="助理">助理</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>电话</label>
                        <input type="tel" name="phone" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" name="email" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>入职日期</label>
                        <input type="date" name="joinDate" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>状态</label>
                        <select name="status" class="form-input">
                            <option value="在职">在职</option>
                            <option value="离职">离职</option>
                            <option value="停职">停职</option>
                        </select>
                    </div>
                    <div class="form-group-full">
                        <label>备注</label>
                        <textarea name="remark" class="form-input" rows="3" placeholder="员工备注信息"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" onclick="closeModal('employeeModal')">取消</button>
                <button class="btn btn-primary" onclick="saveEmployee()">保存</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/mock-data.js"></script>
    <script>
        let currentEmployees = [];
        let currentPage = 1;
        let pageSize = 20;
        let selectedEmployees = new Set();
        let editingEmployeeId = null;

        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializePage();
            loadEmployees();
        });

        function loadEmployees() {
            // 从mock数据获取员工列表
            currentEmployees = window.mockData.employees;
            renderEmployeeTable();
            updatePagination();
        }

        function renderEmployeeTable() {
            const tbody = document.getElementById('employeeTableBody');
            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = startIndex + pageSize;
            const pageEmployees = currentEmployees.slice(startIndex, endIndex);

            tbody.innerHTML = pageEmployees.map(employee => `
                <tr>
                    <td>
                        <input type="checkbox" value="${employee.id}" onchange="toggleSelect(${employee.id})">
                    </td>
                    <td>
                        <div class="employee-name-cell">
                            <div class="employee-avatar">${employee.name.charAt(0)}</div>
                            <span>${employee.name}</span>
                        </div>
                    </td>
                    <td>${employee.employeeId}</td>
                    <td>${employee.department}</td>
                    <td>${employee.position}</td>
                    <td>${employee.phone}</td>
                    <td>${employee.email}</td>
                    <td>${employee.joinDate}</td>
                    <td>
                        <span class="employee-status status-${employee.status === '在职' ? 'active' : employee.status === '离职' ? 'inactive' : 'suspended'}">
                            ${employee.status}
                        </span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn edit" onclick="editEmployee(${employee.id})">
                                <i class="fas fa-edit"></i> 编辑
                            </button>
                            <button class="action-btn delete" onclick="deleteEmployee(${employee.id})">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');

            // 更新总数
            document.getElementById('totalCount').textContent = currentEmployees.length;
        }

        function updatePagination() {
            const totalPages = Math.ceil(currentEmployees.length / pageSize);
            const pagination = document.getElementById('pagination');
            
            let paginationHTML = '';
            
            // 上一页
            if (currentPage > 1) {
                paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage - 1})">上一页</button>`;
            }
            
            // 页码
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    paginationHTML += `<button class="page-btn active">${i}</button>`;
                } else {
                    paginationHTML += `<button class="page-btn" onclick="changePage(${i})">${i}</button>`;
                }
            }
            
            // 下一页
            if (currentPage < totalPages) {
                paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage + 1})">下一页</button>`;
            }
            
            pagination.innerHTML = paginationHTML;
        }

        function changePage(page) {
            currentPage = page;
            renderEmployeeTable();
            updatePagination();
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('pageSize').value);
            currentPage = 1;
            renderEmployeeTable();
            updatePagination();
        }

        function filterEmployees() {
            const departmentFilter = document.getElementById('departmentFilter').value;
            const positionFilter = document.getElementById('positionFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const nameFilter = document.getElementById('nameFilter').value.toLowerCase();
            const employeeIdFilter = document.getElementById('employeeIdFilter').value;

            currentEmployees = window.mockData.employees.filter(employee => {
                return (!departmentFilter || employee.department === departmentFilter) &&
                       (!positionFilter || employee.position === positionFilter) &&
                       (!statusFilter || employee.status === statusFilter) &&
                       (!nameFilter || employee.name.toLowerCase().includes(nameFilter)) &&
                       (!employeeIdFilter || employee.employeeId.includes(employeeIdFilter));
            });

            currentPage = 1;
            renderEmployeeTable();
            updatePagination();
        }

        function resetFilters() {
            document.getElementById('departmentFilter').value = '';
            document.getElementById('positionFilter').value = '';
            document.getElementById('statusFilter').value = '';
            document.getElementById('nameFilter').value = '';
            document.getElementById('employeeIdFilter').value = '';
            
            currentEmployees = window.mockData.employees;
            currentPage = 1;
            renderEmployeeTable();
            updatePagination();
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('tbody input[type="checkbox"]');
            
            checkboxes.forEach(checkbox => {
                checkbox.checked = selectAll.checked;
                const id = parseInt(checkbox.value);
                if (selectAll.checked) {
                    selectedEmployees.add(id);
                } else {
                    selectedEmployees.delete(id);
                }
            });
            
            updateBatchActions();
        }

        function toggleSelect(id) {
            if (selectedEmployees.has(id)) {
                selectedEmployees.delete(id);
            } else {
                selectedEmployees.add(id);
            }
            updateBatchActions();
        }

        function updateBatchActions() {
            const batchActions = document.getElementById('batchActions');
            const selectedCount = document.getElementById('selectedCount');
            
            if (selectedEmployees.size > 0) {
                batchActions.classList.add('active');
                selectedCount.textContent = selectedEmployees.size;
            } else {
                batchActions.classList.remove('active');
            }
        }

        function showAddModal() {
            document.getElementById('modalTitle').textContent = '新增员工';
            document.getElementById('employeeForm').reset();
            editingEmployeeId = null;
            showModal('employeeModal');
        }

        function editEmployee(id) {
            const employee = window.mockData.employees.find(emp => emp.id === id);
            if (!employee) return;

            document.getElementById('modalTitle').textContent = '编辑员工';
            editingEmployeeId = id;

            const form = document.getElementById('employeeForm');
            form.name.value = employee.name;
            form.employeeId.value = employee.employeeId;
            form.department.value = employee.department;
            form.position.value = employee.position;
            form.phone.value = employee.phone;
            form.email.value = employee.email;
            form.joinDate.value = employee.joinDate;
            form.status.value = employee.status;
            form.remark.value = employee.remark || '';

            showModal('employeeModal');
        }

        function saveEmployee() {
            const form = document.getElementById('employeeForm');
            const formData = new FormData(form);
            
            if (!form.checkValidity()) {
                showMessage('请填写必填字段', 'error');
                return;
            }

            const employeeData = {
                name: formData.get('name'),
                employeeId: formData.get('employeeId'),
                department: formData.get('department'),
                position: formData.get('position'),
                phone: formData.get('phone'),
                email: formData.get('email'),
                joinDate: formData.get('joinDate'),
                status: formData.get('status'),
                remark: formData.get('remark')
            };

            if (editingEmployeeId) {
                // 编辑员工
                const index = window.mockData.employees.findIndex(emp => emp.id === editingEmployeeId);
                if (index !== -1) {
                    window.mockData.employees[index] = { ...window.mockData.employees[index], ...employeeData };
                    showMessage('员工信息更新成功', 'success');
                }
            } else {
                // 新增员工
                const newEmployee = {
                    id: Date.now(),
                    ...employeeData
                };
                window.mockData.employees.push(newEmployee);
                showMessage('员工添加成功', 'success');
            }

            closeModal('employeeModal');
            loadEmployees();
        }

        function deleteEmployee(id) {
            if (confirm('确定要删除这个员工吗？')) {
                const index = window.mockData.employees.findIndex(emp => emp.id === id);
                if (index !== -1) {
                    window.mockData.employees.splice(index, 1);
                    showMessage('员工删除成功', 'success');
                    loadEmployees();
                }
            }
        }

        function batchExport() {
            if (selectedEmployees.size === 0) {
                showMessage('请选择要导出的员工', 'warning');
                return;
            }
            showMessage(`正在导出 ${selectedEmployees.size} 个员工的信息...`, 'info');
        }

        function batchUpdate() {
            if (selectedEmployees.size === 0) {
                showMessage('请选择要编辑的员工', 'warning');
                return;
            }
            showMessage('批量编辑功能开发中...', 'info');
        }

        function batchDelete() {
            if (selectedEmployees.size === 0) {
                showMessage('请选择要删除的员工', 'warning');
                return;
            }
            
            if (confirm(`确定要删除选中的 ${selectedEmployees.size} 个员工吗？`)) {
                window.mockData.employees = window.mockData.employees.filter(emp => !selectedEmployees.has(emp.id));
                selectedEmployees.clear();
                showMessage('批量删除成功', 'success');
                loadEmployees();
                updateBatchActions();
            }
        }

        function importEmployees() {
            showMessage('批量导入功能开发中...', 'info');
        }

        function exportEmployees() {
            showMessage('正在导出所有员工信息...', 'info');
        }
    </script>
</body>
</html>
