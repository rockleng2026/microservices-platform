<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色权限配置 - Portal 3.0</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .role-layout {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
            height: calc(100vh - 200px);
        }
        
        .role-panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            background: #fafafa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .panel-title {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }
        
        .panel-content {
            padding: 0;
            height: calc(100% - 60px);
            overflow-y: auto;
        }
        
        .role-item {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .role-item:hover {
            background: #f9f9f9;
        }
        
        .role-item.active {
            background: #e6f7ff;
            border-left: 3px solid var(--primary-color);
        }
        
        .role-info h4 {
            margin: 0 0 4px 0;
            font-size: 14px;
            font-weight: 500;
        }
        
        .role-info p {
            margin: 0;
            font-size: 12px;
            color: #666;
        }
        
        .role-actions {
            display: flex;
            gap: 8px;
        }
        
        .role-actions .btn {
            padding: 4px 8px;
            font-size: 12px;
        }
        
        .permission-tree {
            padding: 20px;
        }
        
        .permission-category {
            margin-bottom: 20px;
        }
        
        .category-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 12px;
        }
        
        .category-title {
            font-weight: 500;
            font-size: 14px;
        }
        
        .permission-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            margin-left: 20px;
        }
        
        .permission-item label {
            margin: 0;
            font-size: 13px;
            cursor: pointer;
        }
        
        .users-list {
            padding: 0;
        }
        
        .user-item {
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
        }
        
        .user-details h4 {
            margin: 0 0 2px 0;
            font-size: 13px;
            font-weight: 500;
        }
        
        .user-details p {
            margin: 0;
            font-size: 11px;
            color: #666;
        }
        
        .user-actions {
            display: flex;
            gap: 8px;
        }
        
        .user-actions .btn {
            padding: 2px 6px;
            font-size: 11px;
        }
        
        .role-form {
            display: grid;
            gap: 16px;
            padding: 20px;
        }
        
        .batch-actions {
            padding: 16px 20px;
            background: #f0f2f5;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .batch-actions.active {
            display: block;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .empty-state i {
            font-size: 32px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        .permission-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-number {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Portal 3.0</h2>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-title">组织架构</div>
                    <a href="department-tree.html" class="nav-link">
                        <i class="fas fa-sitemap"></i> 部门管理
                    </a>
                    <a href="employee-list.html" class="nav-link">
                        <i class="fas fa-users"></i> 员工管理
                    </a>
                    <a href="position-manage.html" class="nav-link">
                        <i class="fas fa-briefcase"></i> 岗位管理
                    </a>
                    <a href="role-permission.html" class="nav-link active">
                        <i class="fas fa-shield-alt"></i> 角色权限
                    </a>
                </div>
                <div class="nav-section">
                    <div class="nav-title">客户管理</div>
                    <a href="../crm/customer-dashboard.html" class="nav-link">
                        <i class="fas fa-chart-pie"></i> CRM工作台
                    </a>
                    <a href="../crm/customer-list.html" class="nav-link">
                        <i class="fas fa-address-book"></i> 客户列表
                    </a>
                </div>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部导航 -->
            <header class="main-header">
                <div class="header-left">
                    <button class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="breadcrumb">
                        <span>组织架构</span>
                        <i class="fas fa-chevron-right"></i>
                        <span>角色权限配置</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="搜索角色或用户...">
                    </div>
                    <div class="user-menu">
                        <img src="https://via.placeholder.com/32" alt="用户头像" class="user-avatar">
                        <span>管理员</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </header>

            <!-- 页面内容 -->
            <div class="page-content">
                <div class="page-header">
                    <h1>角色权限配置</h1>
                    <p>管理系统角色和权限分配，确保数据安全和访问控制</p>
                </div>

                <!-- 统计卡片 -->
                <div class="permission-stats">
                    <div class="stat-card">
                        <div class="stat-number" id="totalRoles">0</div>
                        <div class="stat-label">系统角色</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalPermissions">0</div>
                        <div class="stat-label">权限项目</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="assignedUsers">0</div>
                        <div class="stat-label">已分配用户</div>
                    </div>
                </div>

                <!-- 批量操作栏 -->
                <div class="batch-actions" id="batchActions">
                    <span class="selected-count">已选择 <span id="selectedCount">0</span> 个用户</span>
                    <button class="btn btn-primary" onclick="batchAssignRole()">
                        <i class="fas fa-user-plus"></i> 批量分配角色
                    </button>
                    <button class="btn btn-default" onclick="clearSelection()">
                        <i class="fas fa-times"></i> 取消选择
                    </button>
                </div>

                <!-- 三列布局 -->
                <div class="role-layout">
                    <!-- 左侧：角色列表 -->
                    <div class="role-panel">
                        <div class="panel-header">
                            <span class="panel-title">角色列表</span>
                            <button class="btn btn-primary btn-sm" onclick="showAddRoleModal()">
                                <i class="fas fa-plus"></i> 新增
                            </button>
                        </div>
                        <div class="panel-content" id="rolesList">
                            <!-- 角色列表将通过JavaScript渲染 -->
                        </div>
                    </div>

                    <!-- 中间：权限配置 -->
                    <div class="role-panel">
                        <div class="panel-header">
                            <span class="panel-title">权限配置</span>
                            <div>
                                <button class="btn btn-success btn-sm" onclick="savePermissions()" style="display: none;" id="savePermBtn">
                                    <i class="fas fa-save"></i> 保存
                                </button>
                            </div>
                        </div>
                        <div class="panel-content">
                            <div id="permissionTree">
                                <div class="empty-state">
                                    <i class="fas fa-shield-alt"></i>
                                    <p>请选择角色以配置权限</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 右侧：用户分配 -->
                    <div class="role-panel">
                        <div class="panel-header">
                            <span class="panel-title">用户分配</span>
                            <button class="btn btn-primary btn-sm" onclick="showAssignUserModal()" style="display: none;" id="assignUserBtn">
                                <i class="fas fa-user-plus"></i> 分配
                            </button>
                        </div>
                        <div class="panel-content">
                            <div id="usersList">
                                <div class="empty-state">
                                    <i class="fas fa-users"></i>
                                    <p>请选择角色以查看用户</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 新增/编辑角色模态框 -->
    <div class="modal" id="roleModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="roleModalTitle">新增角色</h3>
                <button class="modal-close" onclick="closeModal('roleModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="roleForm" class="role-form">
                    <div class="form-group">
                        <label>角色名称 <span style="color: red;">*</span></label>
                        <input type="text" name="name" class="form-input" required placeholder="请输入角色名称">
                    </div>
                    <div class="form-group">
                        <label>角色代码 <span style="color: red;">*</span></label>
                        <input type="text" name="code" class="form-input" required placeholder="请输入角色代码">
                    </div>
                    <div class="form-group">
                        <label>角色描述</label>
                        <textarea name="description" class="form-input" rows="3" placeholder="请输入角色描述"></textarea>
                    </div>
                    <div class="form-group">
                        <label>状态</label>
                        <select name="status" class="form-input">
                            <option value="1">启用</option>
                            <option value="0">禁用</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" onclick="closeModal('roleModal')">取消</button>
                <button class="btn btn-primary" onclick="saveRole()">保存</button>
            </div>
        </div>
    </div>

    <!-- 分配用户模态框 -->
    <div class="modal" id="assignUserModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>分配用户到角色</h3>
                <button class="modal-close" onclick="closeModal('assignUserModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 16px;">
                    <input type="text" id="userSearchInput" class="form-input" placeholder="搜索用户姓名或工号..." oninput="searchUsers()">
                </div>
                <div id="availableUsers" style="max-height: 300px; overflow-y: auto;">
                    <!-- 可分配用户列表 -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" onclick="closeModal('assignUserModal')">取消</button>
                <button class="btn btn-primary" onclick="confirmAssignUsers()">确认分配</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/mock-data.js"></script>
    <script>
        let currentRole = null;
        let editingRoleId = null;
        let selectedUsers = [];

        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializePage();
            loadRoles();
            updateStats();
        });

        function loadRoles() {
            const roles = window.mockData.roles;
            const rolesList = document.getElementById('rolesList');
            
            rolesList.innerHTML = roles.map(role => `
                <div class="role-item ${role.id === (currentRole?.id) ? 'active' : ''}" onclick="selectRole(${role.id})">
                    <div class="role-info">
                        <h4>${role.name}</h4>
                        <p>${role.description}</p>
                    </div>
                    <div class="role-actions">
                        <button class="btn btn-sm" onclick="editRole(${role.id}); event.stopPropagation();">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm" onclick="deleteRole(${role.id}); event.stopPropagation();">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function selectRole(roleId) {
            currentRole = window.mockData.roles.find(r => r.id === roleId);
            loadRoles(); // 重新渲染以更新选中状态
            loadPermissions();
            loadRoleUsers();
            
            // 显示操作按钮
            document.getElementById('savePermBtn').style.display = 'inline-flex';
            document.getElementById('assignUserBtn').style.display = 'inline-flex';
        }

        function loadPermissions() {
            if (!currentRole) return;
            
            const permissionTree = document.getElementById('permissionTree');
            const permissions = window.mockData.permissions;
            const rolePermissions = currentRole.permissions || [];
            
            // 按模块分组权限
            const groupedPermissions = permissions.reduce((groups, perm) => {
                const module = perm.module;
                if (!groups[module]) groups[module] = [];
                groups[module].push(perm);
                return groups;
            }, {});
            
            permissionTree.innerHTML = Object.entries(groupedPermissions).map(([module, perms]) => `
                <div class="permission-category">
                    <div class="category-header">
                        <input type="checkbox" id="module_${module}" onchange="toggleModulePermissions('${module}')" 
                               ${perms.every(p => rolePermissions.includes(p.id)) ? 'checked' : ''}>
                        <label for="module_${module}" class="category-title">${module}</label>
                    </div>
                    ${perms.map(perm => `
                        <div class="permission-item">
                            <input type="checkbox" id="perm_${perm.id}" 
                                   ${rolePermissions.includes(perm.id) ? 'checked' : ''}
                                   onchange="updatePermission(${perm.id})">
                            <label for="perm_${perm.id}">${perm.name}</label>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function loadRoleUsers() {
            if (!currentRole) return;
            
            const usersList = document.getElementById('usersList');
            const employees = window.mockData.employees;
            const roleUsers = employees.filter(emp => emp.roleIds && emp.roleIds.includes(currentRole.id));
            
            if (roleUsers.length === 0) {
                usersList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-slash"></i>
                        <p>暂无分配用户</p>
                    </div>
                `;
                return;
            }
            
            usersList.innerHTML = roleUsers.map(user => `
                <div class="user-item">
                    <div class="user-info">
                        <div class="user-avatar">${user.name.charAt(0)}</div>
                        <div class="user-details">
                            <h4>${user.name}</h4>
                            <p>${user.departmentName} | ${user.position}</p>
                        </div>
                    </div>
                    <div class="user-actions">
                        <button class="btn btn-sm" onclick="removeUserFromRole(${user.id})" title="移除">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const roles = window.mockData.roles;
            const permissions = window.mockData.permissions;
            const employees = window.mockData.employees;
            
            const assignedUsers = employees.filter(emp => emp.roleIds && emp.roleIds.length > 0).length;
            
            document.getElementById('totalRoles').textContent = roles.length;
            document.getElementById('totalPermissions').textContent = permissions.length;
            document.getElementById('assignedUsers').textContent = assignedUsers;
        }

        function toggleModulePermissions(module) {
            const checkbox = document.getElementById(`module_${module}`);
            const permissions = window.mockData.permissions.filter(p => p.module === module);
            
            permissions.forEach(perm => {
                const permCheckbox = document.getElementById(`perm_${perm.id}`);
                if (permCheckbox) {
                    permCheckbox.checked = checkbox.checked;
                    updatePermission(perm.id);
                }
            });
        }

        function updatePermission(permissionId) {
            if (!currentRole) return;
            
            const checkbox = document.getElementById(`perm_${permissionId}`);
            const rolePermissions = currentRole.permissions || [];
            
            if (checkbox.checked) {
                if (!rolePermissions.includes(permissionId)) {
                    rolePermissions.push(permissionId);
                }
            } else {
                const index = rolePermissions.indexOf(permissionId);
                if (index > -1) {
                    rolePermissions.splice(index, 1);
                }
            }
            
            currentRole.permissions = rolePermissions;
        }

        function savePermissions() {
            if (!currentRole) return;
            
            // 更新mock数据中的角色权限
            const roleIndex = window.mockData.roles.findIndex(r => r.id === currentRole.id);
            if (roleIndex !== -1) {
                window.mockData.roles[roleIndex].permissions = currentRole.permissions;
                showMessage('权限配置保存成功', 'success');
            }
        }

        function showAddRoleModal() {
            document.getElementById('roleModalTitle').textContent = '新增角色';
            document.getElementById('roleForm').reset();
            editingRoleId = null;
            showModal('roleModal');
        }

        function editRole(roleId) {
            const role = window.mockData.roles.find(r => r.id === roleId);
            if (!role) return;
            
            document.getElementById('roleModalTitle').textContent = '编辑角色';
            editingRoleId = roleId;
            
            const form = document.getElementById('roleForm');
            form.name.value = role.name;
            form.code.value = role.code;
            form.description.value = role.description || '';
            form.status.value = role.status ? '1' : '0';
            
            showModal('roleModal');
        }

        function saveRole() {
            const form = document.getElementById('roleForm');
            const formData = new FormData(form);
            
            if (!form.checkValidity()) {
                showMessage('请填写必填字段', 'error');
                return;
            }
            
            const roleData = {
                name: formData.get('name'),
                code: formData.get('code'),
                description: formData.get('description'),
                status: formData.get('status') === '1'
            };
            
            if (editingRoleId) {
                // 编辑角色
                const index = window.mockData.roles.findIndex(r => r.id === editingRoleId);
                if (index !== -1) {
                    window.mockData.roles[index] = { ...window.mockData.roles[index], ...roleData };
                    showMessage('角色更新成功', 'success');
                }
            } else {
                // 新增角色
                const newRole = {
                    id: Date.now(),
                    ...roleData,
                    permissions: []
                };
                window.mockData.roles.push(newRole);
                showMessage('角色创建成功', 'success');
            }
            
            closeModal('roleModal');
            loadRoles();
            updateStats();
        }

        function deleteRole(roleId) {
            if (confirm('确定要删除这个角色吗？已分配的用户将失去该角色权限。')) {
                const index = window.mockData.roles.findIndex(r => r.id === roleId);
                if (index !== -1) {
                    window.mockData.roles.splice(index, 1);
                    
                    // 清理用户的角色分配
                    window.mockData.employees.forEach(emp => {
                        if (emp.roleIds) {
                            emp.roleIds = emp.roleIds.filter(id => id !== roleId);
                        }
                    });
                    
                    showMessage('角色删除成功', 'success');
                    loadRoles();
                    updateStats();
                    
                    if (currentRole && currentRole.id === roleId) {
                        currentRole = null;
                        document.getElementById('permissionTree').innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-shield-alt"></i>
                                <p>请选择角色以配置权限</p>
                            </div>
                        `;
                        document.getElementById('usersList').innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-users"></i>
                                <p>请选择角色以查看用户</p>
                            </div>
                        `;
                        document.getElementById('savePermBtn').style.display = 'none';
                        document.getElementById('assignUserBtn').style.display = 'none';
                    }
                }
            }
        }

        function showAssignUserModal() {
            if (!currentRole) return;
            
            loadAvailableUsers();
            showModal('assignUserModal');
        }

        function loadAvailableUsers() {
            const employees = window.mockData.employees;
            const currentRoleUsers = employees.filter(emp => emp.roleIds && emp.roleIds.includes(currentRole.id));
            const availableUsers = employees.filter(emp => !emp.roleIds || !emp.roleIds.includes(currentRole.id));
            
            const container = document.getElementById('availableUsers');
            
            if (availableUsers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-check"></i>
                        <p>所有用户已分配该角色</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = availableUsers.map(user => `
                <div class="user-item">
                    <div class="user-info">
                        <input type="checkbox" id="assign_user_${user.id}" value="${user.id}" onchange="toggleUserSelection(${user.id})">
                        <label for="assign_user_${user.id}" style="margin-left: 8px;">
                            <div class="user-avatar">${user.name.charAt(0)}</div>
                            <div class="user-details">
                                <h4>${user.name}</h4>
                                <p>${user.departmentName} | ${user.position}</p>
                            </div>
                        </label>
                    </div>
                </div>
            `).join('');
        }

        function toggleUserSelection(userId) {
            const checkbox = document.getElementById(`assign_user_${userId}`);
            if (checkbox.checked) {
                selectedUsers.push(userId);
            } else {
                selectedUsers = selectedUsers.filter(id => id !== userId);
            }
        }

        function confirmAssignUsers() {
            if (selectedUsers.length === 0) {
                showMessage('请选择要分配的用户', 'warning');
                return;
            }
            
            selectedUsers.forEach(userId => {
                const employee = window.mockData.employees.find(emp => emp.id === userId);
                if (employee) {
                    if (!employee.roleIds) employee.roleIds = [];
                    if (!employee.roleIds.includes(currentRole.id)) {
                        employee.roleIds.push(currentRole.id);
                    }
                }
            });
            
            showMessage(`成功分配 ${selectedUsers.length} 个用户到角色`, 'success');
            selectedUsers = [];
            closeModal('assignUserModal');
            loadRoleUsers();
            updateStats();
        }

        function removeUserFromRole(userId) {
            if (confirm('确定要将该用户从角色中移除吗？')) {
                const employee = window.mockData.employees.find(emp => emp.id === userId);
                if (employee && employee.roleIds) {
                    employee.roleIds = employee.roleIds.filter(id => id !== currentRole.id);
                    showMessage('用户移除成功', 'success');
                    loadRoleUsers();
                    updateStats();
                }
            }
        }

        function searchUsers() {
            const searchTerm = document.getElementById('userSearchInput').value.toLowerCase();
            const userItems = document.querySelectorAll('#availableUsers .user-item');
            
            userItems.forEach(item => {
                const userName = item.querySelector('h4').textContent.toLowerCase();
                const userDept = item.querySelector('p').textContent.toLowerCase();
                
                if (userName.includes(searchTerm) || userDept.includes(searchTerm)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function batchAssignRole() {
            showMessage('批量分配功能开发中...', 'info');
        }

        function clearSelection() {
            selectedUsers = [];
            document.getElementById('batchActions').classList.remove('active');
        }
    </script>
</body>
</html>
